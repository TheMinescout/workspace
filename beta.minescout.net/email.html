<body class="ms-site"><header class="ms-topbar"><a class="ms-logo" href="index"><img src="../../assets/images/BETAFAVICON.png?v=1" alt="Minescout Beta" style="width:32px;height:32px;object-fit:contain;display:block;"><b>MINESCOUT</b><em>BETA</em></a><nav><a href="index">HOME</a><a href="pages">ATLS</a><a href="projects">PRDS</a><a href="feature-requests">REQUESTS</a><a class="active" href="email">CONTACT</a></nav><a class="top-login" href="login">ACCOUNT ↗</a></header><main class="directory-wrap"><section class="directory-head"><div><div class="eyebrow">CONTACT / COMMS</div><h1>Send a message</h1><p>Direct contact with the Minescout team.</p></div><div class="directory-code">MAIL<br><small>DIRECT</small></div></section><div class="email-client" style="margin-top:18px"><div class="client-header"><span>MINESCOUT / CONTACT</span><span>DIRECT CHANNEL</span></div><div class="field-row"><div class="field-label">TO</div><div class="field-input"><input value="theminescout@minescout.net" readonly></div></div><div class="field-row"><div class="field-label">FROM</div><div class="field-input"><input id="sender" placeholder="Your name or email"></div></div><div class="field-row"><div class="field-label">SUBJ</div><div class="field-input"><input id="subject" maxlength="180" placeholder="Subject"></div></div><div class="field-row ms-honeypot" aria-hidden="true"><div class="field-label">SITE</div><div class="field-input"><input id="website" tabindex="-1" autocomplete="off"></div></div><div class="body-input"><textarea id="body" placeholder="Write your message..."></textarea></div><div class="client-footer"><span style="font-size:10px;color:var(--dim)">Messages are reviewed through Minescout Life.</span><button class="send-btn" onclick="sendEmail()">SEND →</button></div><div id="status-overlay"><div id="status-text" style="font-size:14px;font-weight:700">SENDING…</div><div class="loading-bar"><div class="fill" id="fill-bar"></div></div></div></div></main><footer class="ms-footer"><span>CONTACT</span><a href="index">← MINESCOUT</a></footer><script src="assets/js/firebase-config.js"></script><script>
const EMAIL_SERVICE_ID="service_khgjq1e", EMAIL_TEMPLATE_ID="template_yb9xkyy", EMAIL_PUBLIC_KEY="Fa69EL7WS0e4EWsl-";
emailjs.init(EMAIL_PUBLIC_KEY);
async function sendEmail(){
 const sender=MS_SECURITY.cleanText(document.getElementById('sender').value,160), subject=MS_SECURITY.cleanText(document.getElementById('subject').value,180), body=MS_SECURITY.cleanText(document.getElementById('body').value,5000), status=document.getElementById('status-text'), overlay=document.getElementById('status-overlay'), fill=document.getElementById('fill-bar');
 if(document.getElementById('website').value)return;
 if(!sender||!subject||!body){status.textContent='ALL FIELDS REQUIRED.';overlay.style.display='flex';setTimeout(()=>overlay.style.display='none',1200);return;}
 if(!MS_SECURITY.canSubmit()){status.textContent='PLEASE WAIT BEFORE SENDING AGAIN.';overlay.style.display='flex';setTimeout(()=>overlay.style.display='none',1200);return;}
 overlay.style.display='flex'; fill.style.width='25%'; status.textContent='VALIDATING…';
 try{ const db=firebase.database(); await db.ref('messages').push({sender,subject,desc:body,priority:'EMAIL',timestamp:Date.now(),read:false,source:'beta-contact'}); fill.style.width='70%'; status.textContent='TRANSMITTING…'; await emailjs.send(EMAIL_SERVICE_ID,EMAIL_TEMPLATE_ID,{name:sender,time:new Date().toISOString(),message:`[TYPE]: DIRECT EMAIL\n[SUBJECT]: ${subject}\n\n[BODY]:\n${body}`}); fill.style.width='100%'; status.textContent='SENT SUCCESSFULLY.'; setTimeout(()=>location.href='index',900); }
 catch(err){ console.error(err); status.textContent='SEND FAILED. PLEASE TRY AGAIN.'; setTimeout(()=>overlay.style.display='none',1600); }
}
</script><script src="assets/js/background.js?v=12"></script><script src="assets/js/security.js?v=12"></script><script src="assets/js/article-nav.js?v=12"></script>
