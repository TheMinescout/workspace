<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI WRITER // MINESCOUT</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text y=%2214%22 font-size=%2214%22>✎</text></svg>">
    
    <!-- PROJECT STYLES -->
    <link rel="stylesheet" href="css/ai-writer.css">
</head>
<body>
    <div class="main-layout">
        <!-- HEADER -->
        <header>
            <div class="header-left">
                <h2 onclick="window.toggleCmd()">// AI_WRITER_v42.0</h2>
                <span class="status-badge">LOCAL MODE</span>
            </div>
            
            <div class="tabs">
                <div class="tab active" onclick="setTab('editor')">EDITOR</div>
                <div class="tab" onclick="setTab('assets')">ASSETS</div>
                <div class="tab" onclick="setTab('preview')">PREVIEW</div>
                <div class="tab" onclick="setTab('logs')">LOGS</div>
            </div>
        </header>

        <!-- WORKSPACE -->
        <div class="workspace">
            
            <!-- PANEL 1: EDITOR -->
            <div id="panel-editor" class="panel active">
                <div class="editor-grid">
                    <!-- Config Column -->
                    <div class="config-col">
                        <div>
                            <label>PROJECT TITLE:</label>
                            <input type="text" id="inp-title" placeholder="My Article">
                        </div>
                        
                        <!-- Saved Projects -->
                        <div class="save-box">
                            <label class="gold-label">LOCAL SAVES (IndexedDB):</label>
                            <div id="saved-list"></div>
                            <button class="btn btn-save" onclick="saveProject()">[ SAVE STATE ]</button>
                        </div>

                        <!-- AI Controls -->
                        <div>
                            <label>AI INSTRUCTIONS:</label>
                            <textarea id="ai-prompt" rows="3" placeholder="Describe what you want the AI to write..."></textarea>
                        </div>
                        <label class="check-label">
                            <input type="checkbox" id="web-search" checked>
                            🌐 Search Web for current info (DuckDuckGo)
                        </label>
                        <button class="btn btn-ai" onclick="generateAI()">[ ✨ GENERATE ]</button>
                        
                        <!-- Admin Panel -->
                        <div class="admin-box">
                            <label>ADMIN OVERRIDE:</label>
                            <input type="password" id="admin-code" placeholder="Code" onkeyup="checkAdminCode()">
                            
                            <div id="admin-fields" class="admin-fields">
                                <label>CATEGORY:</label>
                                <select id="prod-category">
                                    <option value="General">General</option>
                                    <option value="Tech Tips">Tech Tips</option>
                                    <option value="Coding Projects">Coding Projects</option>
                                    <option value="Updates">Updates</option>
                                    <option value="Puppy Life">Puppy Life</option>
                                    <option value="Minecraft Server">Minecraft Server</option>
                                    <option value="Beta">Beta</option>
                                </select>
                                <label>POST ID:</label>
                                <input type="text" id="prod-id" placeholder="auto-generated">
                                <label>AUTHOR:</label>
                                <input type="text" id="prod-author" value="Minescout AI">
                                <label>HEADER IMG:</label>
                                <input type="text" id="prod-img" placeholder="default.png">
                            </div>
                        </div>

                        <hr class="separator">
                        <button class="btn" onclick="openPreviewTab()">[ ↗ PREVIEW ]</button>
                        <button class="btn" onclick="openExportMenu()">[ 💾 EXPORT ]</button>
                    </div>

                    <!-- Text Editor Column -->
                    <div class="text-col">
                        <label>HTML BODY CONTENT (RAW):</label>
                        <textarea id="inp-content" spellcheck="false" placeholder="<h1>Title</h1><p>Content...</p>"></textarea>
                    </div>
                </div>
            </div>

            <!-- PANEL 2: ASSETS -->
            <div id="panel-assets" class="panel">
                <h3>// MEDIA ASSET MANAGER</h3>
                <div class="asset-input-row">
                    <div class="flex-grow">
                        <label>FILE:</label>
                        <input type="file" id="media-file" accept="image/*,video/*">
                    </div>
                    <div class="flex-grow">
                        <label>LABEL (For AI):</label>
                        <input type="text" id="media-label" placeholder="e.g. Main Menu Screenshot">
                    </div>
                    <div class="flex-end">
                        <button class="btn" onclick="addAsset()">[ + ADD ]</button>
                    </div>
                </div>
                <div id="asset-list"></div>
            </div>

            <!-- PANEL 3: PREVIEW -->
            <div id="panel-preview" class="panel">
                <div class="preview-toolbar">
                    <button class="btn" onclick="refreshPreview()">[ REFRESH ]</button>
                    <button class="btn" onclick="openPreviewInTab()">[ ↗ OPEN IN TAB ]</button>
                    <button class="btn" onclick="doExport('pdf')">[ 📄 PDF ]</button>
                    <button class="btn" onclick="doExport('html')">[ 💾 HTML ]</button>
                    <button class="btn" onclick="doExport('copy')">[ 📋 COPY ]</button>
                </div>
                <iframe id="preview-frame" src="about:blank" sandbox="allow-scripts"></iframe>
            </div>

            <!-- PANEL 4: LOGS -->
            <div id="panel-logs" class="panel">
                <div id="system-log">
                    <div class="log-line">> SYSTEM INITIALIZED.</div>
                </div>
            </div>
        </div>

        <!-- FOOTER -->
        <footer>
            <span id="storage-stat">DB: CONNECTING...</span>
            <span id="char-count">0 CHARS</span>
        </footer>
    </div>

    <!-- EXPORT MODAL -->
    <div id="export-modal" class="modal-overlay">
        <div class="modal-box">
            <h2 class="modal-title">EXPORT PROTOCOL</h2>
            <p class="modal-desc">Select output format:</p>
            
            <button class="btn mb-10" onclick="doExport('html')">DOWNLOAD .HTML (Standalone)</button>
            <button class="btn mb-10" onclick="doExport('pdf')">PRINT TO PDF</button>
            <button class="btn mb-10" onclick="doExport('copy')">COPY TO CLIPBOARD</button>
            
            <button class="btn btn-danger mt-10" onclick="closeExportMenu()">CANCEL</button>
        </div>
    </div>

    <!-- TEMPLATES (Safe Storage) -->
    
    <!-- 1. BETA PREVIEW TEMPLATE -->
    <script type="text/template" id="inp-template">
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{title}}</title>
<style>
    body { overflow-y: auto; padding: 20px; font-family: sans-serif; background: #f5f5f5; }
    .page-container { max-width: 900px; margin: 0 auto; background: #fff; padding: 40px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); }
    h1 { border-bottom: 2px solid #333; padding-bottom: 10px; }
    h2 { color: #444; margin-top: 30px; }
    p { line-height: 1.6; color: #333; margin-bottom: 15px; }
    img, video { max-width: 100%; height: auto; border-radius: 4px; margin: 15px 0; display: block; margin-left: auto; margin-right: auto; }
    .media-caption { text-align: center; font-size: 0.85em; color: #888; margin-top: 5px; font-style: italic; }
</style>
</head>
<body>
    <div class="page-container">
        <h1>{{title}}</h1>
        <p style="color:#888;">GENERATED: {{date}}</p>
        <hr style="margin-bottom:30px;">
        <div id="content">{{AI}}</div>
    </div>
</body>
</html>
    </script>

    <!-- 2. PRODUCTION TEMPLATE -->
    <script type="text/template" id="prod-template">
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>body{margin:0;font-family:'Inter',sans-serif;background:#f8f8f8;color:#222;line-height:1.7;padding:40px;max-width:900px;margin:0 auto;}img,video{max-width:100%;border-radius:8px;margin:20px 0;}h1{border-bottom:2px solid #333;padding-bottom:8px;}h2{color:#555;margin-top:32px;}</style>
</head>
<body>
    <h1>{{title}}</h1>
    <p style="color:#888;">Posted on {{date}} by {{author}}</p>
    <div class="post-content">{{AI}}</div>
</body>
</html>
    </script>

    <!-- PROJECT LOGIC -->
    <script src="js/ai-writer.js?v=1.01"></script>
</body>
</html>
