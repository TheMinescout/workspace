<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOOL // AI_WRITER_COMMUNITY</title>
    <link rel="icon" type="image/png" href="../../assets/images/BETAFAVICON.png">
    
    <!-- EXTERNAL LIBRARIES -->
    <script src="../../assets/js/firebase-config.js?v=3.2"></script>
    <script src="../../assets/js/terminal-core.js?v=4.4"></script>
    <script src="https://js.puter.com/v2/"></script>

    <!-- PROJECT STYLES -->
    <link rel="stylesheet" href="css/ai-writer.css?v=40.0">
</head>
<body>
    <canvas id="matrixCanvas"></canvas>

    <div class="main-layout">
        <!-- HEADER -->
        <header>
            <div class="header-left">
                <h2 onclick="window.toggleCmd()">// AI_WRITER_v40.0</h2>
                <span class="status-badge" id="auth-status">GUEST MODE</span>
            </div>
            
            <div class="tabs">
                <div class="tab active" onclick="setTab('editor')">EDITOR</div>
                <div class="tab" onclick="setTab('assets')">ASSETS</div>
                <div class="tab" onclick="setTab('library')">COMMUNITY</div>
                <div class="tab" onclick="setTab('logs')">LOGS</div>
            </div>
        </header>

        <!-- WORKSPACE -->
        <div class="workspace">
            
            <!-- PANEL 1: EDITOR -->
            <div id="panel-editor" class="panel active">
                <div class="editor-grid">
                    <!-- Config Column -->
                    <div class="config-col">
                        <div>
                            <label>PROJECT_TITLE:</label>
                            <input type="text" id="inp-title" placeholder="My Article">
                        </div>
                        
                        <!-- Saved Projects -->
                        <div class="save-box">
                            <label class="gold-label">LOCAL_SAVES (IndexedDB):</label>
                            <div id="saved-list"></div>
                            <button class="btn btn-save" onclick="saveProject()">[ SAVE STATE ]</button>
                        </div>

                        <!-- AI Controls -->
                        <div>
                            <label>AI_INSTRUCTIONS:</label>
                            <textarea id="ai-prompt" rows="3" placeholder="Instructions..."></textarea>
                        </div>
                        <button class="btn btn-ai" onclick="generateAI()">[ ✨ GENERATE ]</button>
                        
                        <!-- Admin Panel -->
                        <div class="admin-box">
                            <label>ADMIN OVERRIDE:</label>
                            <input type="password" id="admin-code" placeholder="Code" onkeyup="checkAdminCode()">
                            
                            <div id="admin-fields" class="admin-fields">
                                <label>CATEGORY:</label>
                                <select id="prod-category">
                                    <option value="General">General</option>
                                    <option value="Tech Tips">Tech Tips</option>
                                    <option value="Coding Projects">Coding Projects</option>
                                    <option value="Updates">Updates</option>
                                    <option value="Puppy Life">Puppy Life</option>
                                    <option value="Minecraft Server">Minecraft Server</option>
                                    <option value="Beta">Beta</option>
                                </select>
                                <label>POST ID:</label>
                                <input type="text" id="prod-id" placeholder="auto-generated">
                                <label>AUTHOR:</label>
                                <input type="text" id="prod-author" value="Minescout AI">
                                <label>HEADER IMG:</label>
                                <input type="text" id="prod-img" placeholder="default.png">
                            </div>
                        </div>

                        <hr class="separator">
                        <button class="btn" style="background:#004444; border-color:#0FF; color:#0FF;" onclick="openCurrentInNewTab()">[ ↗ OPEN IN NEW TAB ]</button>
                        <button class="btn" onclick="openExportMenu()">[ 💾 DOWNLOAD OPTIONS ]</button>
                        <button class="btn btn-share" onclick="publishToCommunity()">[ ☁ SHARE TO LIBRARY ]</button>
                    </div>

                    <!-- Text Editor Column -->
                    <div class="text-col">
                        <label>HTML_BODY_CONTENT (RAW):</label>
                        <textarea id="inp-content" spellcheck="false" placeholder="<h1>Title</h1><p>Content...</p>"></textarea>
                    </div>
                </div>
            </div>

            <!-- PANEL 2: ASSETS -->
            <div id="panel-assets" class="panel">
                <h3>// MEDIA_ASSET_MANAGER</h3>
                <div class="asset-input-row">
                    <div class="flex-grow">
                        <label>FILE:</label>
                        <input type="file" id="media-file" accept="image/*,video/*">
                    </div>
                    <div class="flex-grow">
                        <label>LABEL (For AI):</label>
                        <input type="text" id="media-label" placeholder="e.g. Main Menu Screenshot">
                    </div>
                    <div class="flex-end">
                        <button class="btn" onclick="addAsset()">[ + ADD ]</button>
                    </div>
                </div>
                <div id="asset-list"></div>
            </div>

            <!-- PANEL 3: LIBRARY -->
            <div id="panel-library" class="panel">
                <div class="library-header">
                    <h3>// GLOBAL_COMMUNITY_LIBRARY</h3>
                    <button class="btn small-btn" onclick="loadLibrary()">REFRESH FEED</button>
                </div>
                <div id="lib-grid" class="lib-grid">
                    <div style="color:#555;">Loading secure feed...</div>
                </div>
            </div>

            <!-- PANEL 4: LOGS -->
            <div id="panel-logs" class="panel">
                <div id="system-log">
                    <div class="log-line">> SYSTEM INITIALIZED.</div>
                </div>
            </div>
        </div>

        <!-- FOOTER -->
        <footer>
            <span id="storage-stat">DB: CONNECTING...</span>
            <span id="char-count">0 CHARS</span>
        </footer>
    </div>

    <!-- EXPORT MODAL -->
    <div id="export-modal" class="modal-overlay">
        <div class="modal-box">
            <h2 class="modal-title">EXPORT PROTOCOL</h2>
            <p class="modal-desc">Select output format:</p>
            
            <button class="btn mb-10" onclick="doExport('html')">DOWNLOAD .HTML (Standalone)</button>
            <button class="btn mb-10" onclick="doExport('txt')">DOWNLOAD .TXT (Raw Code)</button>
            <button class="btn mb-10" onclick="doExport('copy')">COPY TO CLIPBOARD</button>
            
            <button class="btn btn-danger mt-10" onclick="closeExportMenu()">CANCEL</button>
        </div>
    </div>

    <!-- TEMPLATES (Safe Storage) -->
    
    <!-- 1. BETA PREVIEW TEMPLATE -->
    <script type="text/template" id="inp-template">
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{title}}</title>
<link rel="stylesheet" href="assets/css/style.css">
<style>
    body { overflow-y: auto; padding: 20px; }
    .page-container { max-width: 900px; margin: 0 auto; border: 1px solid #0F0; background: rgba(0, 10, 0, 0.9); padding: 40px; }
    h1 { border-bottom: 2px solid #0F0; padding-bottom: 10px; color: #0F0; }
    h2 { color: #88ff88; margin-top: 30px; border-left: 3px solid #0F0; padding-left: 10px; }
    p { line-height: 1.6; color: #ccffcc; margin-bottom: 15px; }
    img, video { max-width: 100%; height: auto; max-height: 600px; object-fit: contain; border: 1px solid #0F0; margin: 15px 0; display: block; margin-left: auto; margin-right: auto; }
    .media-caption { text-align: center; font-size: 0.8em; color: #005500; margin-top: 5px; font-style: italic; }
</style>
</head>
<body>
    <div class="page-container">
        <h1>{{title}}</h1>
        <p style="color:#005500;">GENERATED: {{date}} | AUTHOR: AI_ASSISTANT</p>
        <hr style="border-color:#003300; margin-bottom:30px;">
        <div id="content">{{AI}}</div>
    </div>
</body>
</html>
    </script>

    <!-- 2. PRODUCTION TEMPLATE -->
    <script type="text/template" id="prod-template">
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}} - Minescouts Life</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../assests/css/homepage.css?v=3.02">
    <link rel="icon" type="image/png" href="../../assests/images/favicon.png?v=2">
    <style>img,video{max-width:100%;border-radius:8px;margin:20px 0;border:2px solid #333;display:block;margin-left:auto;margin-right:auto;}.media-container{text-align:center;margin-bottom:20px;}.media-caption{font-size:0.9em;color:#666;font-style:italic;margin-top:5px;}</style>
</head>
<body>
    <header class="main-header">
        <div class="container site-title-container">
            <div id="auth-container"><a href="../../login.html" id="login-link">Login</a></div>
            <div class="site-title-wrapper">
                <h1 class="site-title"><a href="../../index.html" style="color: white; text-decoration: none;">Minescouts Life</a></h1>
                <p class="tagline">{{category}}</p>
            </div>
            <div id="user-display" class="hidden">
                <a href="../../account.html"><span id="user-email-display"></span></a>
                <button id="signOut-btn">Sign Out</button>
            </div>
        </div>
    </header>
    <div class="main-content-area">
        <div class="container">
            <main class="post-main" data-post-id="{{post_id}}">
                <a href="{{back_link}}" class="back-link">&laquo; Back to {{category}}</a>
                <article class="post-full">
                    <h1>{{title}}</h1>
                    <p class="post-meta">Posted on {{date}} by {{author}}</p>
                    <img src="../../assests/images/{{header_image}}" alt="Title Image" class="post-image-full" onerror="this.style.display='none'">
                    <div class="post-content">{{AI}}</div>
                </article>
                <section class="comments-section">
                    <h2>Comments</h2>
                    <div class="comment-form-container">
                        <h3>Leave a Comment</h3>
                        <form>
                            <div class="form-group"><label for="name">Name:</label><input type="text" id="name" name="name" required></div>
                            <div class="form-group"><label for="comment">Comment:</label><textarea id="comment" name="comment" rows="5" required></textarea></div>
                            <button type="submit" class="submit-button">Post Comment</button>
                        </form>
                    </div>
                    <div class="comments-list"></div>
                </section>
            </main>
            <aside id="sidebar"><div id="sidebar-container"></div></aside>
        </div>
    </div>
    <footer class="main-footer"><div class="container"><p id="copyright">© 2026 Minescouts Life. All rights reserved.</p></div></footer>
    
    [[SCRIPT type="module" src="../../assests/js/auth.js?v=1.1"]][[CLOSE_SCRIPT]]
    [[SCRIPT type="module" src="../../assests/js/homepage.js"]][[CLOSE_SCRIPT]]
    [[SCRIPT src="../../assests/js/loader.js"]][[CLOSE_SCRIPT]]
</body>
</html>
    </script>

    <!-- PROJECT LOGIC -->
    <script src="js/ai-writer.js"></script>
</body>
</html>
