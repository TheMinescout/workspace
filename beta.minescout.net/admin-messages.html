<!DOCTYPE html>
<html lang="en">
<head><meta name="referrer" content="strict-origin-when-cross-origin">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>ADMIN // INBOX</title>
    <link rel="icon" type="image/png" href="assets/images/BETAFAVICON.png?v=1">

    
    <link rel="stylesheet" href="assets/css/style.css?v=8">
</head>
<body>
    <header class="ms-topbar"><a class="ms-logo" href="index"><img src="../../assets/images/BETAFAVICON.png?v=1" alt="Minescout Beta" style="width:32px;height:32px;object-fit:contain;display:block;"><b>MINESCOUT</b><em>BETA</em></a><nav><a href="index">HOME</a><a href="pages">ATLS</a><a href="projects">PRDS</a><a href="feature-requests">REQUESTS</a><a href="email">CONTACT</a></nav><a class="top-login" href="index">EXIT ↗</a></header>
    <div id="lockout">ACCESS DENIED</div>

    <div id="main-interface">
        <div class="header"><span>// ADMIN / INBOX</span><span class="status-secure">SECURE — life.minescout.net</span></div>
        <div id="inbox-view"><div style="padding:20px;color:#555;">LOADING...</div></div>
        <div id="message-view">
            <div class="view-frame">
                <div style="border-bottom:1px solid #004400; padding-bottom:10px;">
                    <div id="view-subject" style="font-weight:bold;"></div>
                    <div id="view-sender" style="font-size:0.8rem; color:#007700;"></div>
                    <div class="note">// messages stored at life.minescout.net/data/messages.json</div>
                </div>
                <div id="view-body" class="view-body"></div>
            </div>
        </div>
    </div>

    <!-- Auth (no Firebase) -->
    <script src="assets/js/auth.js?v=1.01"></script>

    <script>
        const ADMIN_USERNAME = "theminescout@minescout.net"; // must match users.json username
        const MESSAGES_URL   = "https://life.minescout.net/data/messages.json";

        let currentMessages = [];
        let viewMode = 'LIST';

        document.addEventListener('auth-ready', async (e) => {
            const user = e.detail.user;

            if (user && user.username.toLowerCase() === ADMIN_USERNAME.toLowerCase()) {
                document.getElementById('main-interface').style.display = 'flex';
                await initInbox();
            } else {
                document.getElementById('lockout').style.display = 'flex';
                setTimeout(() => window.location.href = 'index', 3000);
            }
        });

        async function fetchMessages() {
            try {
                const res = await fetch(MESSAGES_URL + '?_=' + Date.now());
                return res.ok ? await res.json() : [];
            } catch (e) {
                console.error('Could not load messages:', e);
                return [];
            }
        }

        async function initInbox() {
            currentMessages = await fetchMessages();
            renderList();
        }

        function renderList() {
            if (viewMode === 'READ') return;
            const inboxEl = document.getElementById('inbox-view');
            inboxEl.style.display = 'block';
            document.getElementById('message-view').style.display = 'none';
            inboxEl.innerHTML = '';

            if (currentMessages.length === 0) {
                inboxEl.innerHTML = "<div style='padding:20px; color:#555;'>// NO MESSAGES FOUND</div>";
                return;
            }

            currentMessages.slice().reverse().forEach(msg => {
                const div = document.createElement('div');
                div.className = msg.read ? 'msg-bar read' : 'msg-bar unread';
                div.onclick = () => openMessage(msg);
                div.innerHTML = `<span>${msg.subject}</span><span style="font-size:0.8rem">${msg.sender || ''}</span>`;
                inboxEl.appendChild(div);
            });
        }

        function openMessage(msg) {
            viewMode = 'READ';
            document.getElementById('inbox-view').style.display = 'none';
            document.getElementById('message-view').style.display = 'block';
            document.getElementById('view-subject').innerText = msg.subject;
            document.getElementById('view-sender').innerText = msg.sender || '';
            document.getElementById('view-body').innerText = msg.desc || msg.body || '';
            // Note: marking messages as read requires a writable API on life.minescout.net
        }

        window.handlePageCommand = function(cmd, args) {
            const query = Array.isArray(args) ? args.join(' ').toLowerCase() : String(args).toLowerCase();

            if (cmd === 'open' || cmd === 'read') {
                const target = currentMessages.find(m => m.subject.toLowerCase().includes(query));
                if (target) { openMessage(target); return true; }
                return "Msg not found.";
            }
            if (cmd === 'close' || cmd === 'back') {
                viewMode = 'LIST'; renderList(); return "Returned to inbox.";
            }
            if (cmd === 'refresh') {
                initInbox(); return "Refreshing messages...";
            }
            // delete is read-only without a backend — inform the user
            if (cmd === 'delete' || cmd === 'del') {
                return "Delete requires a write API at life.minescout.net. Edit messages.json manually or add an endpoint.";
            }
            return null;
        };

        if (window.authReady) document.dispatchEvent(new CustomEvent('auth-ready', { detail: { user: window.currentUser } }));
    </script>
<script src="assets/js/background.js?v=12"></script>
<script src="assets/js/security.js?v=12"></script>
</body>
</html>
