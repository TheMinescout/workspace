<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MineScout // SPA ENGINE</title>
    <link rel="icon" type="image/png" href="assets/images/BETAFAVICON.png">

    <!-- Central Stylesheet -->
    <link rel="stylesheet" href="homepage.css">

    <style>
        /* Base fallback styles (Can be moved entirely to homepage.css) */
        :root { 
            --green: #0F0; --red: #FF3333; --gold: #FFD700; 
            --bg: #000; --glass: rgba(0, 10, 0, 0.95); --cyan: #00FFFF; 
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background-color: var(--bg); 
            font-family: 'Courier New', monospace; 
            color: var(--green); 
            height: 100vh; 
            overflow: hidden; 
        }

        canvas { position: fixed; top: 0; left: 0; z-index: 0; opacity: 0.3; }
        
        .scanline { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: linear-gradient(to bottom, rgba(255,255,255,0) 50%, rgba(0,0,0,0.2) 50%); 
            background-size: 100% 4px; pointer-events: none; z-index: 100; opacity: 0.6; 
        }

        .open-btn { 
            position: fixed; top: 10px; left: 10px; border: 1px solid var(--green); 
            padding: 8px; cursor: pointer; z-index: 300; background: #000; 
            font-weight: bold; color: var(--green); transition: 0.2s;
        }
        .open-btn:hover { background: var(--green); color: #000; }

        /* SPA Container */
        #app { position: relative; z-index: 200; height: 100%; width: 100%; overflow-y: auto; }
    </style>
</head>
<body>

    <!-- GLOBAL RENDER ENGINE ASSETS -->
    <canvas id="matrixCanvas"></canvas>
    <div class="scanline"></div>
    <div class="open-btn" onclick="window.toggleCmd()">[ CMD ]</div>

    <!-- GLOBAL TERMINAL OVERLAY -->
    <div id="cmd-overlay" style="display:none; position:fixed; bottom:0; left:0; width:100%; background:rgba(0,20,0,0.95); border-top:2px solid #0F0; z-index:999; padding:15px; box-shadow: 0 -5px 20px rgba(0,255,0,0.2);">
        <div style="color:#0F0; font-size:12px; margin-bottom:5px;">// GLOBAL TERMINAL INSTANCE (Type 'home', 'login', 'projects', 'email', 'inbox')</div>
        <div style="display:flex; align-items:center;">
            <span style="color:#0F0; margin-right:10px; font-weight:bold;">></span>
            <input type="text" id="global-cmd-input" style="background:transparent; border:none; color:#0F0; font-family:'Courier New', monospace; font-size:16px; flex-grow:1; outline:none;" autocomplete="off" placeholder="Awaiting command...">
        </div>
    </div>

    <!-- SPA VIEWPORT CONTAINER -->
    <div id="app"></div>

    <!-- APP ENGINE (Router & Logic) -->
    <script type="module" src="app.js?v=1.03"></script>

</body>
</html>
