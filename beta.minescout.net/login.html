<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>AUTH // MineScout</title>
    <link rel="icon" type="image/png" href="assets/images/BETAFAVICON.png?v=1.01">

    <style>
        body { background-color: #000; color: #0F0; font-family: 'Courier New', monospace; height: 100vh; overflow: hidden; display: flex; align-items: center; justify-content: center; margin: 0; }
        canvas { position: fixed; top: 0; left: 0; z-index: -1; opacity: 0.2; }
        .login-box { border: 2px solid #0F0; padding: 40px; background: rgba(0,20,0,0.95); width: 420px; box-shadow: 0 0 20px #0F0; max-width: 90%; }
        h2 { border-bottom: 2px dashed #0F0; padding-bottom: 15px; margin-bottom: 20px; text-align: center; }
        .input-group { margin-bottom: 16px; }
        label { display: block; font-size: 0.75rem; color: #007700; margin-bottom: 4px; }
        input { width: 100%; background: #000; border: 1px solid #004400; color: #fff; padding: 10px; font-family: inherit; outline: none; box-sizing: border-box; }
        input:focus { border-color: #0F0; }
        button { width: 100%; padding: 12px; background: #003300; color: #0F0; border: 1px solid #0F0; font-weight: bold; cursor: pointer; font-family: inherit; font-size: 1rem; }
        button:hover:not(:disabled) { background: #0F0; color: #000; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .error-msg { color: #ff3333; text-align: center; margin-top: 10px; min-height: 20px; font-size: 0.9rem; }
        .signup-note { margin-top: 18px; border-top: 1px dashed #004400; padding-top: 14px; font-size: 0.78rem; color: #006600; text-align: center; line-height: 1.6; }
        .signup-note a { color: #0F0; text-decoration: none; }
        .signup-note a:hover { text-decoration: underline; }
        .open-btn { position: fixed; top: 10px; left: 10px; border: 1px solid #0F0; padding: 5px; cursor: pointer; z-index: 100; font-family: 'Courier New', monospace; background: #000; color: #0F0; font-size: 0.8rem; }
        .spinner { display: inline-block; animation: spin 0.6s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <canvas id="matrixCanvas"></canvas>
    <div class="open-btn" onclick="window.toggleCmd && window.toggleCmd()">[ OPEN CMD ]</div>

    <div class="login-box">
        <h2>// SECURITY CHECKPOINT</h2>

        <div class="input-group">
            <label>IDENTITY</label>
            <input type="text" id="username" placeholder="username or email" autocomplete="username">
        </div>
        <div class="input-group">
            <label>PASSPHRASE</label>
            <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
        </div>

        <button id="login-btn" onclick="attemptLogin()">[ AUTHENTICATE ]</button>
        <div id="error-display" class="error-msg"></div>

        <div class="signup-note">
            No account?&nbsp;
            <a href="https://life.minescout.net" target="_blank">Create one at life.minescout.net</a>
            &mdash; same login works here.
        </div>
    </div>

    <!-- Auth (no Firebase) -->
    <script src="assets/js/auth.js?v=1.01"></script>
    <!-- Terminal core (cmd panel, matrix) -->
    <script src="assets/js/terminal-core.js?v=4.86"></script>

    <script>
        // If already logged in, skip straight to index
        document.addEventListener('auth-ready', (e) => {
            if (e.detail.user) window.location.href = 'index.html';
        });

        async function attemptLogin() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const err      = document.getElementById('error-display');
            const btn      = document.getElementById('login-btn');

            if (!username || !password) { err.innerText = 'CREDENTIALS MISSING'; return; }

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner">◌</span> VERIFYING...';
            err.innerText = '';

            const result = await MS_AUTH.login(username, password);

            if (result.ok) {
                btn.innerText = 'ACCESS GRANTED';
                setTimeout(() => window.location.href = 'index.html', 800);
            } else {
                btn.disabled = false;
                btn.innerText = '[ AUTHENTICATE ]';
                err.innerText = result.error;
            }
        }

        // Allow Enter key to submit
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && document.activeElement !== document.getElementById('global-cmd-input')) {
                attemptLogin();
            }
        });
    </script>
</body>
</html>
