<!doctype html><html lang="en"><head><meta name="referrer" content="strict-origin-when-cross-origin"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login // Minescout</title><link rel="icon" href="assets/images/BETAFAVICON.png?v=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/style.css?v=8"></head><body class="ms-site"><header class="ms-topbar"><a class="ms-logo" href="index"><img src="../../assets/images/BETAFAVICON.png?v=1" alt="Minescout Beta" style="width:32px;height:32px;object-fit:contain;display:block;"><b>MINESCOUT</b><em>BETA</em></a><nav><a href="index">HOME</a><a href="pages">ATLS</a><a href="projects">PRDS</a><a href="feature-requests">REQUESTS</a><a href="email">CONTACT</a></nav><a class="top-login active" href="login">ACCOUNT ↗</a></header><main class="directory-wrap"><div class="form-layout"><div class="login-box"><div class="eyebrow">ACCOUNT / IDENTITY</div><h2>Sign in to Minescout</h2><div class="input-group"><label>USERNAME / EMAIL</label><input id="username" autocomplete="username" placeholder="user@domain"></div><div class="input-group"><label>PASSPHRASE</label><input id="password" type="password" autocomplete="current-password" placeholder="••••••••"></div><button id="login-btn" class="transmit-btn" onclick="attemptLogin()">AUTHENTICATE →</button><div id="error-display" class="error-msg"></div><div class="signup-note">Accounts are managed by Minescout Life. Existing Minescout credentials work here.<br><a href="https://life.minescout.net" target="_blank" rel="noopener">Open account portal →</a></div></div></div></main><footer class="ms-footer"><span>ACCOUNT</span><a href="index">← MINESCOUT</a></footer><script src="assets/js/auth.js?v=10"></script><script>document.addEventListener('auth-ready',e=>{if(e.detail.user)location.href='index'});async function attemptLogin(){const u=document.getElementById('username').value.trim(),p=document.getElementById('password').value,e=document.getElementById('error-display'),b=document.getElementById('login-btn');if(!u||!p){e.textContent='Credentials missing.';return}b.disabled=true;b.textContent='VERIFYING…';e.textContent='';const r=await MS_AUTH.login(u,p);if(r.ok){b.textContent='ACCESS GRANTED';setTimeout(()=>location.href='index',500)}else{b.disabled=false;b.textContent='AUTHENTICATE →';e.textContent=r.error||'Authentication failed.'}}document.addEventListener('keydown',e=>{if(e.key==='Enter')attemptLogin()})</script><script src="assets/js/background.js?v=12"></script>
<script src="assets/js/security.js?v=12"></script>
</body>
