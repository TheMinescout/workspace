<html lang="en">
<head><meta name="referrer" content="strict-origin-when-cross-origin">

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

</head>
<body class="ms-site"><header class="ms-topbar"><a class="ms-logo" href="index"><img src="../../assets/images/BETAFAVICON.png?v=1" alt="Minescout Beta" style="width:32px;height:32px;object-fit:contain;display:block;"><b>MINESCOUT</b><em>BETA</em></a><nav><a href="index">HOME</a><a href="pages">ATLS</a><a href="projects">PRDS</a><a class="active" href="feature-requests">REQUESTS</a><a href="email">CONTACT</a></nav><a class="top-login" href="login">ACCOUNT ↗</a></header><main class="directory-wrap"><section class="directory-head"><div><div class="eyebrow">REQUESTS / UPLINK</div><h1>Feature request</h1><p>Tell Minescout what should exist next.</p></div><div class="directory-code">REQ<br><small>UPLINK</small></div></section><div class="form-block" style="margin-top:18px"><div class="input-group"><label>NAME / HANDLE</label><input type="text" id="sender" placeholder="Optional"></div><div class="input-group"><label>FEATURE TITLE</label><input type="text" id="subject" placeholder="What should we build?"></div><div class="input-group"><label>PRIORITY</label><select id="priority"><option value="LOW">LOW</option><option value="MED">MEDIUM</option><option value="HIGH">HIGH</option></select></div><div class="input-group"><label>DESCRIPTION</label><textarea id="desc" rows="7" maxlength="5000" placeholder="Describe the idea, problem, or workflow..."></textarea></div><div class="input-group ms-honeypot" aria-hidden="true"><label>WEBSITE</label><input id="website" tabindex="-1" autocomplete="off"></div><button class="transmit-btn" onclick="transmitData()">SEND REQUEST →</button><div id="prog-cont" style="display:none;margin-top:12px"><div class="loading-bar"><div class="fill" id="prog-bar"></div></div></div><div id="status-msg" style="margin-top:10px;color:var(--muted);font-size:11px"></div></div></main><footer class="ms-footer"><span>FEATURE REQUESTS</span><a href="index">← MINESCOUT</a></footer><script src="assets/js/firebase-config.js"></script><script>
const EMAIL_SERVICE_ID = "service_khgjq1e";
const EMAIL_TEMPLATE_ID = "template_yb9xkyy";
const EMAIL_PUBLIC_KEY = "Fa69EL7WS0e4EWsl-";
emailjs.init(EMAIL_PUBLIC_KEY);
async function transmitData(){
  const status=document.getElementById('status-msg'), btn=document.querySelector('.transmit-btn');
  const sender=MS_SECURITY.cleanText(document.getElementById('sender').value,120)||'Guest';
  const subject=MS_SECURITY.cleanText(document.getElementById('subject').value,180);
  const desc=MS_SECURITY.cleanText(document.getElementById('desc').value,5000);
  const priority=document.getElementById('priority').value;
  if(document.getElementById('website').value){status.textContent='REQUEST REJECTED.';return;}
  if(!subject||!desc){status.textContent='Please provide a title and description.';return;}
  if(!MS_SECURITY.canSubmit()){status.textContent='Please wait before sending another request.';return;}
  btn.disabled=true; status.textContent='TRANSMITTING…';
  document.getElementById('prog-cont').style.display='block'; document.getElementById('prog-bar').style.width='30%';
  try{
    const db=firebase.database();
    await db.ref('messages').push({sender,subject,desc,priority,timestamp:Date.now(),read:false,source:'beta-request'});
    document.getElementById('prog-bar').style.width='70%';
    await emailjs.send(EMAIL_SERVICE_ID,EMAIL_TEMPLATE_ID,{name:sender,time:new Date().toISOString(),message:`[PRIORITY]: ${priority}\n[SUBJECT]: ${subject}\n\n[CONTENT]:\n${desc}`});
    document.getElementById('prog-bar').style.width='100%'; status.textContent='REQUEST SENT.';
    setTimeout(()=>location.href='index',900);
  }catch(err){console.error(err);btn.disabled=false;status.textContent='Transmission failed. Please try again.';document.getElementById('prog-cont').style.display='none';}
}
</script><script src="assets/js/background.js?v=12"></script><script src="assets/js/security.js?v=12"></script><script src="assets/js/article-nav.js?v=12"></script>
</body></html>
