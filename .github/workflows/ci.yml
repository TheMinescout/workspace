name: CI

on:
  push:
    branches: [main]
    paths:
      - "life.minescout.net/**"
      - "minescout.net/**"
      - "chop-lab.com/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "life.minescout.net/**"
      - "minescout.net/**"
      - "chop-lab.com/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: life.minescout.net

jobs:
  verify:
    name: Build, lint and render smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: life.minescout.net/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Install Chromium for the render smoke test
        run: npx playwright install --with-deps chromium

      - name: Render smoke test (fails on a blank page)
        run: node scripts/smoke.mjs

      - name: MCP server integration test
        run: node scripts/mcp-smoke.mjs

  minescout-net:
    name: Minescout blog tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: minescout.net
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Unit tests
        run: npm test

  chop-lab:
    name: Chop Lab typecheck, build and feed
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chop-lab.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: chop-lab.com/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Verify Merchant Center feed
        run: npm run feed:merchant -- --check

      # The current test baseline has 16 documented failures (see PR #46).
      # Keep collecting test output without making every PR red until those
      # failures are resolved; then remove continue-on-error.
      - name: Unit tests (known baseline failures; temporarily non-blocking)
        id: chop-tests
        run: npm test
        continue-on-error: true

      - name: Report non-blocking test failures
        if: steps.chop-tests.outcome == 'failure'
        run: |
          {
            echo "### Chop Lab tests need attention"
            echo
            echo "The test command failed. This step is temporarily non-blocking because the current baseline has 16 documented failures (see PR #46)."
            echo "Do not treat this as a passing test suite. Remove `continue-on-error` after the baseline failures are fixed."
          } >> "$GITHUB_STEP_SUMMARY"
