name: CI

on:
  push:
    branches: [main]
    paths:
      - "life.minescout.net/**"
      - "minescout.net/**"
      - "chop-lab.com/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "life.minescout.net/**"
      - "minescout.net/**"
      - "chop-lab.com/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: life.minescout.net

jobs:
  verify:
    name: Build, lint and render smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: life.minescout.net/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Install Chromium for the render smoke test
        run: npx playwright install --with-deps chromium

      - name: Render smoke test (fails on a blank page)
        run: node scripts/smoke.mjs

      - name: MCP server integration test
        run: node scripts/mcp-smoke.mjs

  minescout-net:
    name: Minescout blog tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: minescout.net
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Unit tests
        run: npm test

  chop-lab:
    name: Chop Lab typecheck, build and feed
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: chop-lab.com
    env:
      # The script test suites carry known failures (see PR #46). CI tolerates
      # this many and fails on anything above it, so the baseline can shrink
      # but never grow. Lower this number as failures are fixed.
      SCRIPT_TEST_FAILURE_BASELINE: "16"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Vite 8 and nitro require >=22.12.0. `feed:merchant` and the test
          # suites import .ts files with a bare `node`, which needs the unflagged
          # type stripping of >=22.18.0.
          node-version: 22
          cache: npm
          cache-dependency-path: chop-lab.com/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Cheap, and independent of the build: a stale feed should not have to
      # wait for a full production build to fail.
      - name: Verify Merchant Center feed is current
        run: npm run feed:merchant -- --check

      - name: Production build
        # `build` also runs `db:migrate`, which applies migrations to whatever
        # DATABASE_URL it is given. Keep it empty so a repository secret can
        # never let CI write to a live database.
        env:
          DATABASE_URL: ""
        run: npm run build

      # `npm test` chains its two stages with `&&`, so the script-suite baseline
      # failures stop the app suites from ever running. Run them on their own:
      # they are green and they cover product data, auth identity and SEO. Match
      # them by glob so a new src/lib test file cannot be skipped here.
      - name: Unit tests (app suites)
        run: node --experimental-strip-types --test 'src/lib/**/*.test.ts'

      # Eight of the baseline failures read App Builder scaffolding this repo
      # does not ship (`.grok/**`); eight expect the PWA plugin's og:title to
      # follow <title> while site.json pins it. Both are documented in PR #46.
      # Run the suites anyway and fail only when the count rises, so a new
      # regression cannot hide behind the known ones.
      - name: Unit tests (script suites, known baseline)
        run: |
          tap="$RUNNER_TEMP/chop-script-tests.tap"
          set +e
          mapfile -d '' -t test_files < <(find scripts -type f -name '*.test.mjs' -print0 | sort -z)
          if [ "${#test_files[@]}" -eq 0 ]; then
            echo "::error::No script test files were discovered."
            exit 1
          fi

          node --test --test-reporter=tap "${test_files[@]}" > "$tap"
          set -e

          total=$(grep -E '^# tests ' "$tap" | tail -1 | awk '{print $3}')
          failed=$(grep -E '^# fail ' "$tap" | tail -1 | awk '{print $3}')
          if [ -z "$total" ] || [ -z "$failed" ]; then
            echo "::error::The script test run produced no TAP summary — the suites did not run."
            tail -n 60 "$tap"
            exit 1
          fi

          echo "script tests: $total run, $failed failed (baseline $SCRIPT_TEST_FAILURE_BASELINE)"
          {
            echo "### Chop Lab script tests"
            echo
            echo "$total run, **$failed failed** — documented baseline $SCRIPT_TEST_FAILURE_BASELINE (see PR #46)."
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$failed" -gt 0 ]; then
            {
              echo
              echo "Failing test cases:"
              grep 'not ok ' "$tap" || true
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$failed" -gt "$SCRIPT_TEST_FAILURE_BASELINE" ]; then
            {
              echo
              echo "Failures above the baseline:"
              echo '```'
              grep 'not ok' "$tap" || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::$failed script tests failed, above the documented baseline of $SCRIPT_TEST_FAILURE_BASELINE. Fix the new failures, or lower SCRIPT_TEST_FAILURE_BASELINE if you fixed old ones."
            exit 1
          fi
