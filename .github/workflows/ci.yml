name: CI

on:
  push:
    branches: [main]
    paths:
      - "life.minescout.net/**"
      - "minescout.net/**"
      - "chop-lab.com/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "life.minescout.net/**"
      - "minescout.net/**"
      - "chop-lab.com/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Build, lint and render smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: life.minescout.net
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: life.minescout.net/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Install Chromium for the render smoke test
        run: npx playwright install --with-deps chromium

      - name: Render smoke test (fails on a blank page)
        run: node scripts/smoke.mjs

      - name: MCP server integration test
        run: node scripts/mcp-smoke.mjs

  minescout-net:
    name: Minescout blog tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: minescout.net
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Unit tests
        run: npm test

  chop-lab:
    name: Chop Lab typecheck, build and feed
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: chop-lab.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Vite 8 and nitro require >=22.12.0. `feed:merchant` and the test
          # suites import .ts files with a bare `node`, which needs the unflagged
          # type stripping of >=22.18.0.
          node-version: 22
          cache: npm
          cache-dependency-path: chop-lab.com/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Cheap, and independent of the build: a stale feed should not have to
      # wait for a full production build to fail.
      - name: Verify Merchant Center feed is current
        run: npm run feed:merchant -- --check

      - name: Production build
        # `build` also runs `db:migrate`, which applies migrations to whatever
        # DATABASE_URL it is given. Keep it empty so a repository secret can
        # never let CI write to a live database.
        env:
          DATABASE_URL: ""
        run: npm run build

      # `npm test` runs both stages through `scripts/run-tests.mjs`, but CI wants
      # the app suites as their own blocking step, separate from the ratcheted
      # script suites. `test:app` owns the glob, so a new `src/lib` suite cannot
      # be skipped here.
      - name: Unit tests (app suites)
        run: npm run test:app

      # Eight of the baseline failures read App Builder scaffolding this repo
      # does not ship (`.grok/**`); eight expect the PWA plugin's og:title to
      # follow <title> while site.json pins it. Both are documented in PR #46.
      # `scripts/known-test-failures.txt` names them, so any other failure fails
      # the job: a count-only baseline cannot tell a fixed test from a new one.
      - name: Unit tests (script suites, known baseline)
        run: |
          tap="$RUNNER_TEMP/chop-script-tests.tap"
          set +e
          mapfile -d '' -t test_files < <(find scripts -type f -name '*.test.mjs' -print0 | sort -z)
          if [ "${#test_files[@]}" -eq 0 ]; then
            echo "::error::No script test files were discovered."
            exit 1
          fi

          node --test --test-reporter=tap "${test_files[@]}" > "$tap"
          status=$?
          set -e

          total=$(grep -E '^# tests ' "$tap" | tail -1 | awk '{print $3}')
          if [ -z "$total" ]; then
            echo "::error::The script test run produced no TAP summary - the suites did not run."
            tail -n 60 "$tap"
            exit 1
          fi

          if [ "$status" -eq 0 ]; then
            echo "::notice::The script suites all pass. Delete scripts/known-test-failures.txt and the allowlist check below."
            exit 0
          fi

          # Compare the failing test names against the documented baseline, not
          # just their count: a change that fixes one baseline failure and breaks
          # another would keep a count-based check green.
          failing="$RUNNER_TEMP/chop-script-tests-failed.txt"
          allowlist="scripts/known-test-failures.txt"
          grep -E '^not ok ' "$tap" | sed -E 's/^not ok [0-9]+ - //' | sort -u > "$failing" || true
          if [ ! -s "$failing" ]; then
            echo "::error::The script suites failed without per-test results."
            tail -n 60 "$tap"
            exit 1
          fi

          grep -vE '^[[:space:]]*(#|$)' "$allowlist" | sort -u > "$RUNNER_TEMP/chop-allowlist.txt"
          new_failures=$(comm -23 "$failing" "$RUNNER_TEMP/chop-allowlist.txt" || true)
          fixed=$(comm -13 "$failing" "$RUNNER_TEMP/chop-allowlist.txt" || true)

          {
            echo "### Chop Lab script tests"
            echo
            echo "$total run, **$(wc -l < "$failing") failed** - $(wc -l < "$RUNNER_TEMP/chop-allowlist.txt") of them on the documented baseline (see PR #46)."
            echo
            sed 's/^/- /' "$failing"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$new_failures" ]; then
            echo "::error::Script tests failing that are not on $allowlist:"
            printf '%s\n' "$new_failures"
            exit 1
          fi
          if [ -n "$fixed" ]; then
            echo "These allowlisted tests now pass; delete them from $allowlist:"
            printf '%s\n' "$fixed"
          fi
          echo "Every failing script test is on the documented baseline."
