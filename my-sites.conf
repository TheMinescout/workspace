# Needed for proper WebSocket proxying (must be in http{} context — conf.d is fine)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ─────────────────────────────────────────────────────────────────────────────
# life.minescout.net  →  Vite dev server on :3000
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen      80;
    server_name life.minescout.net;

    # Main app, SPA routes, and Vite HMR websocket (/@vite/ is covered here too)
    location / {
        proxy_pass         http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_read_timeout 86400;
    }

    # Static data files — readable cross-origin from beta.minescout.net
    location /data/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  "https://beta.minescout.net" always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type" always;
            add_header Access-Control-Max-Age       86400 always;
            return 204;
        }

        proxy_pass         http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        add_header Access-Control-Allow-Origin  "https://beta.minescout.net" always;
        add_header Vary                         Origin always;
    }

    # Local API (comments, ratings, auth, posts, sidebar-config)
    location /api/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  "https://beta.minescout.net" always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
            add_header Access-Control-Max-Age       86400 always;
            return 204;
        }

        proxy_pass         http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_buffering    off;

        add_header Access-Control-Allow-Origin  "https://beta.minescout.net" always;
        add_header Vary                         Origin always;
    }

    location = /favicon.ico { log_not_found off; access_log off; }
    location = /robots.txt  { log_not_found off; access_log off; }
}

# ─────────────────────────────────────────────────────────────────────────────
# beta.minescout.net  →  static, clean URLs
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name beta.minescout.net;

    root  /usr/share/nginx/html/beta.minescout.net;
    index index.html index.htm;

    error_page 404 /404.html;

    # /index.html -> /   and   /foo/index.html -> /foo/
    # (must NOT go to /index, or the root URL would redirect to /index)
    location ~ ^(/.*/)?index\.html$ {
        return 301 $1;
    }

    # Legacy .html -> clean URL:  /pages.html -> /pages
    location ~ ^/(.+)\.html$ {
        return 301 /$1;
    }

    # Clean URL -> file:  /pages -> /pages.html
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location = /404.html {
        internal;
    }
}

# ─────────────────────────────────────────────────────────────────────────────
# chop-lab.com → TanStack Start / Vite dev server on :8080
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name chop-lab.com www.chop-lab.com;

    location / {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Vite HMR / WebSockets
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_read_timeout 86400;
    }

    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    location = /robots.txt {
        log_not_found off;
        access_log off;
    }
}

# ─────────────────────────────────────────────────────────────────────────────
# minescout.net  →  SPA with real files under /ai/ and /services/
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name minescout.net www.minescout.net;

    root  /usr/share/nginx/html/minescout.net/public;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    autoindex off;

    # Real files in /ai/ & /services/ served directly, otherwise SPA
    location ~ ^/(ai|services)/ {
        try_files $uri $uri/ /index.html;
    }

    location / {
        try_files $uri @spa;
    }

    location @spa {
        rewrite ^ /index.html last;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}

# ─────────────────────────────────────────────────────────────────────────────
# Catch-all: drop requests by raw IP / unknown hosts
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 80 default_server;
    server_name _;
    return 444;
}