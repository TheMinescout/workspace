server {
    listen       80;
    server_name  chop-lab.com www.chop-lab.com;

    root   /usr/share/nginx/html/chop-lab.com;
    index  index.html index.htm;

    # SPA Routing: Directs all missing paths back to index.html so the JS router can handle it (and show the custom 404)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets for better performance
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|stl)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }
}

server {
    listen 80;
    server_name minescout.net www.minescout.net;

    # IMPORTANT: Update this to point exactly to your /public folder
    root /usr/share/nginx/html/minescout.net/public;
    index index.html;

    # Compression: Makes your site load lightning fast
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    ## Security Headers
    # add_header X-Frame-Options "SAMEORIGIN";
    # add_header X-XSS-Protection "1; mode=block";
    # add_header X-Content-Type-Options "nosniff";

    location / {
        # Check for the literal file, then the directory (which triggers index.html),
        # then try appending .html, then fall back to 404.
        try_files $uri $uri/ $uri.html =404;
    }

    # Cache static assets for better performance
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}

# Optional: Default catch-all (prevents access via IP address)
server {
    listen 80 default_server;
    return 444; # Close connection without response
}