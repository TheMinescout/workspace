# Nginx Server Block Configuration for life.minescout.net
# Optimized to support Vanilla JS Single Page Application (SPA) client-side routing

server {
    listen       80;
    server_name  life.minescout.net;

    # Ensure this directory contains your index.html, app.js, and views/ folders
    root   /usr/share/nginx/html/life.minescout.net;
    index  index.html index.htm;

    # Dynamic Routing fallback for SPAs
    location / {
        # 1. Look for a physical file matching the request URL ($uri)
        # 2. Look for a directory matching the request URL ($uri/)
        # 3. If neither exists, fallback to serve your main SPA template (/index.html)
        try_files $uri $uri/ /index.html;
    }

    # Optional but highly recommended: Cache performance parameters for static assets
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1M;
        access_log off;
        add_header Cache-Control "public, no-transform";
    }

    # Disable access logs for favicon and robots.txt
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    location = /robots.txt {
        log_not_found off;
        access_log off;
    }

    # Route all API traffic to your Cloudflare Worker securely
    location /api/ {
        proxy_pass https://minescout-api.tmcarleton11.workers.dev;
        proxy_set_header Host minescout-api.tmcarleton11.workers.dev;
        proxy_ssl_server_name on;
        proxy_buffering off;
    }
}

server {
    listen       80;
    server_name  beta.minescout.net;

    root   /usr/share/nginx/html/beta.minescout.net;
    index  index.html index.htm;

    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /404.html {
        internal;
    }
}

server {
    listen       80;
    server_name  chop-lab.com www.chop-lab.com;

    root   /usr/share/nginx/html/chop-lab.com;
    index  index.html index.htm;

    # SPA Routing: Directs all missing paths back to index.html so the JS router can handle it (and show the custom 404)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets for better performance
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|stl)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }
}

server {
    listen 80;
    server_name minescout.net www.minescout.net;

    root /usr/share/nginx/html/minescout.net/public;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    autoindex off;

    # Real files in /ai/ served directly
    location ^~ /ai/ {
        try_files $uri =404;
    }

    # SPA — skip directory check, fall back to index.html
    location / {
        try_files $uri @spa;
    }

    location @spa {
        rewrite ^ /index.html last;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}

# Optional: Default catch-all (prevents access via IP address)
server {
    listen 80 default_server;
    return 444; # Close connection without response
}
