server {
    listen      80;
    server_name life.minescout.net;

    # ── Main app + SPA routes ─────────────────────────────────────────────
    location / {
        proxy_pass         http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 86400;
    }

    # ── Vite HMR WebSocket ────────────────────────────────────────────────
    location /@vite/ {
        proxy_pass         http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 86400;
    }

    # ── Static data files (users.json, messages.json, etc.) ───────────────
    # Allows beta.minescout.net to fetch these cross-origin
    location /data/ {
        proxy_pass         http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        add_header         Access-Control-Allow-Origin  "https://beta.minescout.net";
        add_header         Access-Control-Allow-Methods "GET, OPTIONS";
        add_header         Access-Control-Allow-Headers "Content-Type";
    }

    # ── Local API (Vite dev server handles these) ─────────────────────────
    # comments, ratings, auth, posts, sidebar-config
    location /api/ {
        proxy_pass         http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_buffering    off;
        add_header         Access-Control-Allow-Origin  "https://beta.minescout.net";
        add_header         Access-Control-Allow-Methods "GET, POST, OPTIONS";
        add_header         Access-Control-Allow-Headers "Content-Type";
    }

    location = /favicon.ico { log_not_found off; access_log off; }
    location = /robots.txt  { log_not_found off; access_log off; }
}

server {
    listen 80;
    server_name beta.minescout.net;

    root /usr/share/nginx/html/beta.minescout.net;
    index index.html index.htm;

    error_page 404 /404.html;

    # Redirect legacy .html URLs to clean URLs.
    # Example: /pages.html -> /pages
    location ~ ^/(.+)\.html$ {
        return 301 /$1;
    }

    # Serve extensionless routes from their matching .html files.
    # Example: /pages -> /pages.html
    # The browser keeps the clean URL.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location = /404.html {
        internal;
    }
}


server {
    listen       80;
    server_name  chop-lab.com www.chop-lab.com;

    root   /usr/share/nginx/html/chop-lab.com;
    index  index.html index.htm;

    # SPA Routing: Directs all missing paths back to index.html so the JS router can handle it (and show the custom 404)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets for better performance
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|stl)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }
}

server {
    listen 80;
    server_name minescout.net www.minescout.net;

    root /usr/share/nginx/html/minescout.net/public;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    autoindex off;

    # FIX: Real files in /ai/ & /services/ served directly, fall back to SPA routing if not found
    location ~ ^/(ai|services)/ {
        try_files $uri $uri/ /index.html;
    }

    # SPA — skip directory check, fall back to index.html
    location / {
        try_files $uri @spa;
    }

    location @spa {
        rewrite ^ /index.html last;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}

# Optional: Default catch-all (prevents access via IP address)
server {
    listen 80 default_server;
    return 444; # Close connection without response
}