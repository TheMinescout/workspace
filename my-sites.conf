server {
    listen 80;
    server_name minescout.net www.minescout.net;

    # IMPORTANT: Update this to point exactly to your /public folder
    root /usr/share/nginx/html/minescout.net/public;
    index index.html;

    # Compression: Makes your site load lightning fast
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";

    location / {
        # This line allows for "Clean URLs"
        # It looks for a file, then a directory, then tries adding .html 
        # Finally, it falls back to index.html for your JavaScript to handle
        try_files $uri $uri/ $uri.html /index.html;
    }

    # Cache static assets for better performance
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
# Optional: Default catch-all (prevents access via IP address)
server {
    listen 80 default_server;
    return 444; # Close connection without response
}
