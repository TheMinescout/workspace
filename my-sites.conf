# Needed for proper WebSocket proxying (must be in http{} context — conf.d is fine)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# CORS allowlist for the Life API. Only these origins get a header; anything
# else gets none, so the browser blocks it. nginx uses this for the OPTIONS
# preflight; the relay sets the same header on its own responses.
map $http_origin $cors_origin {
    default "";
    "https://minescout.net"      "https://minescout.net";
    "https://www.minescout.net"  "https://www.minescout.net";
    "https://beta.minescout.net" "https://beta.minescout.net";
    "https://life.minescout.net" "https://life.minescout.net";
}

# ─────────────────────────────────────────────────────────────────────────────
# life.minescout.net  →  Vite dev server on :3000
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen      80;
    server_name life.minescout.net;

    # Main app, SPA routes, and Vite HMR websocket (/@vite/ is covered here too)
    location / {
        proxy_pass         http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_read_timeout 86400;
    }

    # Static data files — readable cross-origin from beta.minescout.net
    location /data/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  "https://beta.minescout.net" always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type" always;
            add_header Access-Control-Max-Age       86400 always;
            return 204;
        }

        proxy_pass         http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        add_header Access-Control-Allow-Origin  "https://beta.minescout.net" always;
        add_header Vary                         Origin always;
    }

    # Local API (comments, ratings, auth, posts, sidebar-config, mail relay).
    # The relay sets Access-Control-Allow-Origin on its own responses: it
    # echoes the caller from ALLOWED_ORIGINS. nginx answers the preflight with
    # the same origin and must not add a second origin to the proxied response,
    # or the browser sees two values and rejects it.
    location /api/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin      $cors_origin always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Methods     "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers     "Content-Type, Authorization" always;
            add_header Access-Control-Max-Age           86400 always;
            add_header Vary                             Origin always;
            return 204;
        }

        proxy_pass         http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_buffering    off;
    }

    location = /favicon.ico { log_not_found off; access_log off; }
    location = /robots.txt  { log_not_found off; access_log off; }
}

# ─────────────────────────────────────────────────────────────────────────────
# beta.minescout.net  →  static, clean URLs
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name beta.minescout.net;

    root  /usr/share/nginx/html/beta.minescout.net;
    index index.html index.htm;

    error_page 404 /404.html;

    # /index.html -> /   and   /foo/index.html -> /foo/
    # (must NOT go to /index, or the root URL would redirect to /index)
    location ~ ^(/.*/)?index\.html$ {
        return 301 $1;
    }

    # Legacy .html -> clean URL:  /pages.html -> /pages
    location ~ ^/(.+)\.html$ {
        return 301 /$1;
    }

    # Clean URL -> file:  /pages -> /pages.html
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location = /404.html {
        internal;
    }
}

# ─────────────────────────────────────────────────────────────────────────────
# chop-lab.com → TanStack Start / Vite dev server on :8080
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name chop-lab.com www.chop-lab.com;

    location / {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Vite HMR / WebSockets
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_read_timeout 86400;
    }

    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    location = /robots.txt {
        log_not_found off;
        access_log off;
    }
}

# ─────────────────────────────────────────────────────────────────────────────
# minescout.net  →  SPA with real files under /ai/ and /services/
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name minescout.net www.minescout.net;

    root  /usr/share/nginx/html/minescout.net/public;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    autoindex off;

    # Legacy /ai/ URLs -> their real replacement. The map lives in
    # minescout.net/seo/legacy-redirects.json and scripts/redirects.test.mjs
    # keeps the two in step. Permanent, single hop: no chains, no loops.
    location = /ai                        { return 301 /studio; }
    location = /ai/                       { return 301 /studio; }
    location = /ai/pricing                { return 301 /studio/pricing; }
    location = /ai/legal                  { return 301 /studio/legal; }
    location = /ai/process                { return 301 /studio/process; }
    location = /ai/clients                { return 301 /studio/clients; }
    location = /ai/tools                  { return 301 /studio/tools; }
    location = /ai/roi                    { return 301 /studio/roi; }
    location = /ai/intake                 { return 301 /studio/intake; }
    location = /ai/info                   { return 301 /studio/intake; }
    location = /ai/creation               { return 301 /studio/creation; }
    location = /ai/review                 { return 301 /studio/review; }
    location = /ai/local-web-design       { return 301 /studio/local-web-design; }
    location = /ai/custom-storefronts     { return 301 /studio/custom-storefronts; }
    location = /ai/student-nonprofit      { return 301 /studio/student-nonprofit; }
    location = /ai/admin                  { return 301 /studio/admin; }
    location = /ai/chat-config            { return 301 /studio/chat-config; }
    location = /studio/2026               { return 301 /studio; }
    # Anything else left under /ai/ (old generator, admin, assets) goes to the
    # Studio overview rather than rendering the SPA 404.
    location ~ ^/ai/ {
        return 301 /studio;
    }

    # Real files under /services/ are served directly, otherwise SPA
    location ~ ^/services/ {
        try_files $uri $uri/index.html $uri/ /index.html;
    }

    # $uri/index.html keeps /studio on the canonical URL: without it nginx
    # redirects to /studio/, which then disagrees with the canonical tag.
    location / {
        try_files $uri $uri/index.html @spa;
    }

    location @spa {
        rewrite ^ /index.html last;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}

# ─────────────────────────────────────────────────────────────────────────────
# tools.minescout.net → React + Vite dashboard on :5173
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen      80;
    server_name tools.minescout.net;

    location / {
        proxy_pass         http://localhost:5173;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Vite hot-module replacement WebSockets
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;

        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    location = /robots.txt {
        log_not_found off;
        access_log off;
    }
}
# ─────────────────────────────────────────────────────────────────────────────
# Catch-all: drop requests by raw IP / unknown hosts
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 80 default_server;
    server_name _;
    return 444;
}