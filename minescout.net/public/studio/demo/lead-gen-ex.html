<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contractor Quote Engine (Demo)</title>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* --- CSS Variables & Reset --- */
    :root {
      --primary: #0F172A; /* Deep Navy */
      --secondary: #2563EB; /* Bright Blue */
      --accent: #F59E0B; /* Safety Orange */
      --bg: #F8FAFC;
      --surface: #FFFFFF;
      --text: #334155;
      --muted: #94A3B8;
      --border: #E2E8F0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Jost', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* --- Demo Banner --- */
    .demo-banner {
      background-color: var(--primary);
      color: white;
      width: 100%;
      text-align: center;
      padding: 10px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      z-index: 1000;
    }
    .demo-banner span { color: var(--accent); }

    /* --- App Container --- */
    #app {
      width: 100%;
      max-width: 600px;
      padding: 20px;
      margin-top: 40px;
      margin-bottom: 40px;
    }

    .card {
      background: var(--surface);
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 20px 40px rgba(15, 23, 42, 0.05);
      border: 1px solid var(--border);
      animation: slideUp 0.4s ease-out forwards;
    }

    /* --- Typography --- */
    h1 { font-size: 2rem; font-weight: 800; color: var(--primary); margin-bottom: 12px; line-height: 1.2; }
    h2 { font-size: 1.5rem; font-weight: 700; color: var(--primary); margin-bottom: 8px; }
    p { font-size: 1.05rem; line-height: 1.6; margin-bottom: 25px; color: var(--text); }
    .step-indicator { font-size: 0.75rem; font-weight: 700; color: var(--secondary); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 15px; display: block; }

    /* --- Forms & Buttons --- */
    .btn {
      display: inline-block;
      width: 100%;
      background: var(--secondary);
      color: white;
      font-family: inherit;
      font-size: 1.1rem;
      font-weight: 700;
      padding: 16px 24px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }
    .btn:hover { background: #1D4ED8; transform: translateY(-2px); box-shadow: 0 10px 20px rgba(37, 99, 235, 0.2); }
    .btn-accent { background: var(--accent); color: var(--primary); }
    .btn-accent:hover { background: #D97706; box-shadow: 0 10px 20px rgba(245, 158, 11, 0.2); }
    .btn-outline { background: transparent; color: var(--muted); border: 2px solid var(--border); margin-top: 15px; }
    .btn-outline:hover { background: var(--bg); color: var(--text); transform: none; box-shadow: none; }

    .input-group { margin-bottom: 20px; text-align: left; }
    .input-group label { display: block; font-size: 0.85rem; font-weight: 700; color: var(--primary); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em; }
    .input-field {
      width: 100%; padding: 16px; font-size: 1.1rem; font-family: inherit; font-weight: 600;
      color: var(--primary); border: 2px solid var(--border); border-radius: 8px;
      background-color: var(--bg); outline: none; transition: border-color 0.2s;
    }
    .input-field:focus { border-color: var(--secondary); background-color: var(--surface); }

    /* --- Grid Options --- */
    .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 30px; }
    .option-card {
      border: 2px solid var(--border); border-radius: 12px; padding: 20px; text-align: center; cursor: pointer; transition: all 0.2s; background: var(--surface);
    }
    .option-card:hover { border-color: var(--secondary); background: #EFF6FF; }
    .option-icon { font-size: 2.5rem; margin-bottom: 10px; }
    .option-title { font-weight: 700; font-size: 1.1rem; color: var(--primary); }
    .option-desc { font-size: 0.8rem; color: var(--muted); margin-top: 5px; margin-bottom: 0; }

    /* --- Address Tabs --- */
    .tabs { display: flex; border-bottom: 2px solid var(--border); margin-bottom: 25px; }
    .tab { flex: 1; text-align: center; padding: 12px; font-weight: 700; color: var(--muted); cursor: pointer; transition: 0.2s; border-bottom: 2px solid transparent; margin-bottom: -2px; }
    .tab.active { color: var(--secondary); border-bottom-color: var(--secondary); }

    /* --- Loading State --- */
    .loader {
      border: 4px solid var(--border); border-top: 4px solid var(--secondary); border-radius: 50%;
      width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 20px;
    }

    /* --- Final Quote --- */
    .quote-box { background: #EFF6FF; border: 2px dashed var(--secondary); border-radius: 12px; padding: 30px; margin-bottom: 30px; }
    .quote-price { font-size: 2.8rem; font-weight: 800; color: var(--secondary); line-height: 1; margin: 10px 0; }

    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

    @media (max-width: 500px) {
      .card { padding: 30px 20px; }
      .options-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="demo-banner">Lead-Gen Widget Concept <span>(Demo)</span></div>
  
  <div id="app"></div>

  <script>
    /* =========================================
       STATE MANAGEMENT
       ========================================= */
    const state = {
      sqft: null,
      material: null,
      timeline: null,
      email: null,
      addressTab: 'address' // 'address' or 'manual'
    };

    // Pricing Logic (Cost per SqFt based on material)
    const pricing = {
      "Asphalt Shingles": { min: 4.5, max: 6.5 },
      "Architectural Shingles": { min: 6.0, max: 8.5 },
      "Metal Roofing": { min: 10.0, max: 14.0 },
      "Spanish Tile": { min: 12.0, max: 18.0 }
    };

    /* =========================================
       ROUTER & VIEWS
       ========================================= */
    const app = document.getElementById('app');

    function render() {
      const hash = window.location.hash || '#home';
      app.innerHTML = ''; // Clear current view

      switch (hash) {
        case '#home': renderHome(); break;
        case '#step-1': renderStep1_Size(); break;
        case '#step-2': renderStep2_Material(); break;
        case '#step-3': renderStep3_Timeline(); break;
        case '#gate': renderLeadGate(); break;
        case '#quote': renderFinalQuote(); break;
        default: renderHome();
      }
    }

    /* ─── 0. HOME VIEW ─── */
    function renderHome() {
      app.innerHTML = `
        <div class="card" style="text-align: center;">
          <div style="font-size: 3rem; margin-bottom: 10px;">🏠</div>
          <h1>Get Your Instant Roofing Estimate</h1>
          <p>No waiting for callbacks. Answer 3 quick questions about your home and get a highly accurate pricing window instantly.</p>
          <button class="btn btn-accent" onclick="window.location.hash='#step-1'">Start Free Estimate →</button>
          <p style="font-size: 0.8rem; color: var(--muted); margin-top: 15px; margin-bottom: 0;">Takes less than 30 seconds.</p>
        </div>
      `;
    }

    /* ─── 1. SIZE INPUT (ADDRESS SIMULATION) ─── */
    window.switchTab = function(tab) {
      state.addressTab = tab;
      renderStep1_Size();
    }

    window.simulateAddressLookup = function() {
      const address = document.getElementById('address-input').value;
      if(!address) return alert("Please enter an address.");
      
      // Show loading state
      app.innerHTML = `
        <div class="card" style="text-align: center; padding: 60px 20px;">
          <div class="loader"></div>
          <h2>Scanning Property Records...</h2>
          <p>Connecting to satellite and county tax databases for ${address}.</p>
        </div>
      `;

      // Simulate a 2-second API delay, then set a random sqft and move to next step
      setTimeout(() => {
        // Generate a realistic random square footage between 1500 and 3500
        state.sqft = Math.floor(Math.random() * (3500 - 1500 + 1) + 1500);
        window.location.hash = '#step-2';
      }, 2500);
    }

    window.saveManualSqft = function() {
      const val = document.getElementById('sqft-input').value;
      if(!val || val < 100) return alert("Please enter a valid square footage.");
      state.sqft = parseInt(val);
      window.location.hash = '#step-2';
    }

    function renderStep1_Size() {
      let content = '';

      if(state.addressTab === 'address') {
        content = `
          <div class="input-group">
            <label>Property Address</label>
            <input type="text" id="address-input" class="input-field" placeholder="123 Main St, City, ST" autocomplete="street-address">
          </div>
          <button class="btn" onclick="simulateAddressLookup()">Look Up My Home</button>
        `;
      } else {
        content = `
          <div class="input-group">
            <label>Approximate Square Footage</label>
            <input type="number" id="sqft-input" class="input-field" placeholder="e.g. 2400" min="100">
          </div>
          <button class="btn" onclick="saveManualSqft()">Continue</button>
        `;
      }

      app.innerHTML = `
        <div class="card">
          <span class="step-indicator">Step 1 of 3</span>
          <h2>How large is your roof?</h2>
          <p>We can automatically pull your roof dimensions using county tax records, or you can enter it manually.</p>
          
          <div class="tabs">
            <div class="tab ${state.addressTab === 'address' ? 'active' : ''}" onclick="switchTab('address')">Auto-Lookup</div>
            <div class="tab ${state.addressTab === 'manual' ? 'active' : ''}" onclick="switchTab('manual')">Enter Manually</div>
          </div>

          ${content}
        </div>
      `;
    }

    /* ─── 2. MATERIAL CHOICE ─── */
    window.selectMaterial = function(material) {
      state.material = material;
      window.location.hash = '#step-3';
    }

    function renderStep2_Material() {
      app.innerHTML = `
        <div class="card">
          <span class="step-indicator">Step 2 of 3</span>
          <h2>What type of roof do you want?</h2>
          <p>Select the primary material for your new roof. (We detected your home is approx <strong>${state.sqft.toLocaleString()} sq ft.</strong>)</p>
          
          <div class="options-grid">
            <div class="option-card" onclick="selectMaterial('Asphalt Shingles')">
              <div class="option-icon">⬛</div>
              <div class="option-title">Standard Asphalt</div>
              <p class="option-desc">Affordable & Reliable</p>
            </div>
            <div class="option-card" onclick="selectMaterial('Architectural Shingles')">
              <div class="option-icon">🔳</div>
              <div class="option-title">Architectural</div>
              <p class="option-desc">Premium Look & Lifespan</p>
            </div>
            <div class="option-card" onclick="selectMaterial('Metal Roofing')">
              <div class="option-icon">⛓️</div>
              <div class="option-title">Standing Seam Metal</div>
              <p class="option-desc">Maximum Durability</p>
            </div>
            <div class="option-card" onclick="selectMaterial('Spanish Tile')">
              <div class="option-icon">🧱</div>
              <div class="option-title">Spanish Tile</div>
              <p class="option-desc">Classic Aesthetic</p>
            </div>
          </div>
          <button class="btn btn-outline" onclick="window.location.hash='#step-1'">← Back</button>
        </div>
      `;
    }

    /* ─── 3. TIMELINE / URGENCY ─── */
    window.selectTimeline = function(timeline) {
      state.timeline = timeline;
      window.location.hash = '#gate';
    }

    function renderStep3_Timeline() {
      app.innerHTML = `
        <div class="card">
          <span class="step-indicator">Step 3 of 3</span>
          <h2>How soon do you need this done?</h2>
          <p>This helps us check our crew availability.</p>
          
          <div style="display: flex; flex-direction: column; gap: 15px;">
            <div class="option-card" style="text-align: left; display: flex; align-items: center; gap: 20px; padding: 15px 25px;" onclick="selectTimeline('Emergency')">
              <div style="font-size: 2rem;">🚨</div>
              <div>
                <div class="option-title">Emergency / Leaking Now</div>
                <p class="option-desc">Needs immediate tarping or replacement.</p>
              </div>
            </div>
            <div class="option-card" style="text-align: left; display: flex; align-items: center; gap: 20px; padding: 15px 25px;" onclick="selectTimeline('1-3 Months')">
              <div style="font-size: 2rem;">📅</div>
              <div>
                <div class="option-title">Next 1 to 3 Months</div>
                <p class="option-desc">Planning a standard replacement.</p>
              </div>
            </div>
            <div class="option-card" style="text-align: left; display: flex; align-items: center; gap: 20px; padding: 15px 25px;" onclick="selectTimeline('Browsing')">
              <div style="font-size: 2rem;">🤔</div>
              <div>
                <div class="option-title">Just budgeting for next year</div>
                <p class="option-desc">Gathering prices for the future.</p>
              </div>
            </div>
          </div>
          <button class="btn btn-outline" onclick="window.location.hash='#step-2'">← Back</button>
        </div>
      `;
    }

    /* ─── 4. THE LEAD GATE ─── */
    window.submitLead = function() {
      const name = document.getElementById('lead-name').value;
      const email = document.getElementById('lead-email').value;
      const phone = document.getElementById('lead-phone').value;

      if(!name || !email || !phone) return alert("Please fill out all fields to unlock your quote.");
      
      state.email = email;
      
      // Simulate sending data to contractor CRM
      console.log("LEAD CAPTURED:", state);
      
      // Show loading before revealing price
      app.innerHTML = `
        <div class="card" style="text-align: center; padding: 60px 20px;">
          <div class="loader"></div>
          <h2>Calculating Final Estimate...</h2>
        </div>
      `;

      setTimeout(() => {
        window.location.hash = '#quote';
      }, 1500);
    }

    function renderLeadGate() {
      app.innerHTML = `
        <div class="card">
          <div style="text-align: center;">
            <div style="font-size: 3.5rem; margin-bottom: 10px;">🔒</div>
            <h2>Your Estimate is Ready!</h2>
            <p>We've calculated the cost for a <strong>${state.sqft} sq ft ${state.material}</strong> roof. Where should we send your detailed pricing report?</p>
          </div>

          <div class="input-group">
            <label>Full Name</label>
            <input type="text" id="lead-name" class="input-field" placeholder="John Doe">
          </div>
          <div class="input-group">
            <label>Email Address</label>
            <input type="email" id="lead-email" class="input-field" placeholder="john@example.com">
          </div>
          <div class="input-group">
            <label>Phone Number</label>
            <input type="tel" id="lead-phone" class="input-field" placeholder="(555) 123-4567">
          </div>

          <button class="btn btn-accent" onclick="submitLead()">Unlock My Quote 🔓</button>
          <p style="font-size: 0.7rem; color: var(--muted); text-align: center; margin-top: 15px; margin-bottom: 0;">By continuing, you agree to our privacy policy. No spam, ever.</p>
        </div>
      `;
    }

    /* ─── 5. THE FINAL REVEAL ─── */
    function renderFinalQuote() {
      // Calculate Math
      const rates = pricing[state.material];
      let minPrice = state.sqft * rates.min;
      let maxPrice = state.sqft * rates.max;

      // Add emergency premium if applicable
      if(state.timeline === 'Emergency') {
        minPrice *= 1.1;
        maxPrice *= 1.15;
      }

      // Format nicely
      const formatUSD = (num) => '$' + Math.round(num).toLocaleString();

      app.innerHTML = `
        <div class="card" style="text-align: center;">
          <span class="step-indicator" style="color: #10B981;">✓ Analysis Complete</span>
          <h2>Your Estimated Investment</h2>
          <p>Based on ${state.sqft} sq ft of ${state.material}.</p>
          
          <div class="quote-box">
            <div style="font-size: 0.85rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em;">Estimated Range</div>
            <div class="quote-price">${formatUSD(minPrice)} - ${formatUSD(maxPrice)}</div>
            <p style="font-size: 0.85rem; color: var(--text); margin-bottom: 0;">Includes tear-off, disposal, underlayment, and installation.</p>
          </div>

          <p style="font-size: 0.95rem; line-height: 1.6; margin-bottom: 30px;">
            A copy of this estimate has been sent to <strong>${state.email}</strong>.<br>
            To get an exact, to-the-penny quote, we need to inspect your roof's decking and pitch.
          </p>

          <button class="btn" onclick="alert('Demo: Routes to scheduling software (like Calendly).')">Book Free Site Inspection</button>
          <button class="btn btn-outline" onclick="window.location.hash='#home'">Start Over</button>
        </div>
      `;
    }

    /* =========================================
       INITIALIZE
       ========================================= */
    window.addEventListener('hashchange', render);
    render(); // Initial load

  </script>
</body>
</html>
