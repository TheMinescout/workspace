<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ask — Thomas Carleton</title>
  <link rel="icon" type="image/png" href="/assets/favicon.png" />
  <link rel="stylesheet" href="/styles/main.css?v=22" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    .ask-wrap { max-width: 640px; width: 100%; display: flex; flex-direction: column; height: calc(100vh - 8rem); min-height: 500px; }
    .chat-window { flex: 1; overflow-y: auto; border: 1px solid var(--border); border-radius: 6px 6px 0 0; padding: 1.25rem; display: flex; flex-direction: column; gap: 1rem; background: var(--bg); scroll-behavior: smooth; }
    .msg { display: flex; flex-direction: column; gap: 0.2rem; max-width: 88%; }
    .msg.user { align-self: flex-end; items: flex-end; }
    .msg.assistant { align-self: flex-start; items: flex-start; }
    .msg-bubble { padding: 0.7rem 1rem; border-radius: 6px; font-size: 0.86rem; line-height: 1.65; }
    .msg.user .msg-bubble { background: var(--fg); color: var(--bg); border-bottom-right-radius: 2px; }
    .msg.assistant .msg-bubble { background: var(--light); color: var(--fg); border: 1px solid var(--border); border-bottom-left-radius: 2px; }
    .chat-input-row { display: flex; border: 1px solid var(--border); border-top: none; border-radius: 0 0 6px 6px; overflow: hidden; }
    .chat-input { flex: 1; font-family: var(--sans); font-size: 0.88rem; color: var(--fg); background: var(--bg); border: none; padding: 0.85rem 1rem; outline: none; }
    .chat-send { font-family: var(--sans); font-size: 0.7rem; font-weight: 500; text-transform: uppercase; color: var(--bg); background: var(--fg); border: none; padding: 0 1.25rem; cursor: pointer; }
    .status-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 0.65rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; padding: 4px 10px; border-radius: 20px; margin-bottom: 10px; }
    .status-loading { background: #fff8e8; color: #c9922a; }
    .status-online { background: #f0faf4; color: #4caf82; }
    .typing-indicator { display: flex; gap: 4px; padding: 10px; }
    .typing-dot { width: 6px; height: 6px; background: #ccc; border-radius: 50%; animation: typingBounce 1.2s infinite; }
    @keyframes typingBounce { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-4px); } }
  </style>
</head>
<body>
  
  <script src="/scripts/sidebar.js"></script>

  <main class="main main--page">
    <div class="page-content ask-wrap">
      <div id="status-badge" class="status-badge status-loading">● Local Brain Active</div>
      <h1 class="page-title">Ask Thomas</h1>
      
      <div class="chat-window" id="chat-window">
        <div id="chat-empty" style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#aaa; font-size:0.8rem; text-align:center;">
          <p>I only know what's in Thomas's portfolio. How can I help?</p>
        </div>
      </div>

      <div class="chat-input-row">
        <input type="text" class="chat-input" id="chat-input" placeholder="Ask about GPA, projects..." autocomplete="off" />
        <button class="chat-send" id="chat-send" onclick="sendMessage()">Send</button>
      </div>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { getFirestore, collection, getDocs, query, where } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: "AIzaSyAmZbRI37rbHWGaOSVomMdcG-IvHMf6S3Y",
      authDomain: "minescout-5533a.firebaseapp.com",
      projectId: "minescout-5533a",
      storageBucket: "minescout-5533a.firebasestorage.app",
      messagingSenderId: "639262143843",
      appId: "1:639262143843:web:4fe407d3b15a4c885a8f56"
    };

    const app = initializeApp(firebaseConfig);
    const db  = getFirestore(app);
    const CLIENT_ID = '5mAIDPwf9kNmNTk3pAQPDfIP9Z93';
    
    // --- 1. IMMEDIATE HARDCODED FACTS (The "Wall") ---
    window.knowledgeBase = `STRICT SYSTEM ROLE: You are Thomas Carleton's AI Assistant. 
You ONLY answer using the facts below. If a fact is missing, say you don't know. 

THOMAS CARLETON KEY FACTS:
- GPA: Thomas has a 4.0 GPA at Eastlake High School. (NEVER say 3.8).
- IDENTITY: You represent Thomas. Use "I" or "Thomas".
- PROJECTS: Minescout AI, The Chop Lab (chop-lab.com), FRC Team 1294 (Turret Subteam), Minescout Beta.
- SKILLS: HTML, CSS, JS, Python, Firebase, Cloudflare Workers.
- ATHLETICS: 5K PR is 26:00.
- BIO: 9th grader at Eastlake High, Eagle Scout Candidate.

DO NOT HALLUCINATE. DO NOT GUESSTIMATE.
\n\n`;

    async function safeFetch(url, selector, label) {
      try {
        const res = await fetch(url, { signal: AbortSignal.timeout(4000) });
        const html = await res.text();
        const doc = new DOMParser().parseFromString(html, 'text/html');
        const items = doc.querySelectorAll(selector);
        let data = `\n[LIVE DATA FROM ${label}]:\n`;
        items.forEach((item) => {
          if (url === '/work') data += `- Project: ${item.querySelector('.project-title').innerText}\n`;
          if (url === '/resume') data += `- Entry: ${item.innerText.replace(/\s+/g, ' ')}\n`;
        });
        return data;
      } catch (e) { return ""; }
    }

    async function loadExtraKnowledge() {
      try {
        const results = await Promise.allSettled([
          safeFetch('/work', '.project-card', 'WORK'),
          safeFetch('/resume', '.entry-row', 'RESUME'),
          getDocs(query(collection(db, 'clients', CLIENT_ID, 'corrections'), where('status', '==', 'applied'))),
          getDocs(collection(db, 'clients', CLIENT_ID, 'faqs'))
        ]);

        if (results[0].status === 'fulfilled') window.knowledgeBase += results[0].value;
        if (results[1].status === 'fulfilled') window.knowledgeBase += results[1].value;
        
        if (results[2].status === 'fulfilled') {
          results[2].value.forEach(d => { window.knowledgeBase += `MANDATORY FACT: ${d.data().question} -> ${d.data().correction}\n`; });
        }
        if (results[3].status === 'fulfilled') {
          results[3].value.forEach(d => { window.knowledgeBase += `FAQ: ${d.data().question} -> ${d.data().answer}\n`; });
        }

        document.getElementById('status-badge').innerText = "● Verified Brain";
        document.getElementById('status-badge').className = "status-badge status-online";
      } catch (e) { console.warn(e); }
    }

    loadExtraKnowledge();
  </script>

  <script>
    const history = [];
    const chatWin = document.getElementById('chat-window');
    const input   = document.getElementById('chat-input');
    const sendBtn = document.getElementById('chat-send');

    async function sendMessage() {
      const text = input.value.trim();
      if (!text || sendBtn.disabled) return;

      document.getElementById('chat-empty')?.remove();
      addMessage('user', text);
      history.push({ role: 'user', content: text });
      input.value = '';
      sendBtn.disabled = true;

      const typing = addTyping();

      try {
        const res = await fetch('https://thomas-chat.tmcarleton11.workers.dev', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            messages: history, 
            client_id: '5mAIDPwf9kNmNTk3pAQPDfIP9Z93',
            system_override: window.knowledgeBase,
            temperature: 0 
          })
        });

        const data = await res.json();
        typing.remove();
        addMessage('assistant', data.content);
        history.push({ role: 'assistant', content: data.content });
      } catch(err) {
        typing.remove();
        addMessage('assistant', 'Connection error.');
      }
      sendBtn.disabled = false;
    }

    function addMessage(role, text) {
      const msg = document.createElement('div');
      msg.className = `msg ${role}`;
      msg.innerHTML = `<div class="msg-bubble">${text}</div>`;
      chatWin.appendChild(msg);
      chatWin.scrollTop = chatWin.scrollHeight;
      return msg;
    }

    function addTyping() {
      const wrap = document.createElement('div');
      wrap.className = 'msg assistant';
      wrap.innerHTML = `<div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>`;
      chatWin.appendChild(wrap);
      chatWin.scrollTop = chatWin.scrollHeight;
      return wrap;
    }

    input.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });
  </script>
</body>
</html>
