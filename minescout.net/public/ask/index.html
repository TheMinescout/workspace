<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ask — Thomas Carleton</title>
  <link rel="icon" type="image/png" href="/assets/favicon.png" />
  <link rel="stylesheet" href="/styles/main.css?v=25" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    .ask-wrap { max-width: 640px; width: 100%; display: flex; flex-direction: column; height: calc(100vh - 8rem); min-height: 500px; margin: 0 auto;}
    .chat-window { flex: 1; overflow-y: auto; border: 1px solid var(--border); border-radius: 6px 6px 0 0; padding: 1.25rem; display: flex; flex-direction: column; gap: 1rem; background: var(--bg); scroll-behavior: smooth; }
    .msg { display: flex; flex-direction: column; gap: 0.2rem; max-width: 88%; }
    .msg.user { align-self: flex-end; align-items: flex-end; }
    .msg.assistant { align-self: flex-start; align-items: flex-start; }
    .msg-bubble { padding: 0.7rem 1rem; border-radius: 6px; font-size: 0.86rem; line-height: 1.65; }
    .msg.user .msg-bubble { background: var(--fg); color: var(--bg); border-bottom-right-radius: 2px; }
    .msg.assistant .msg-bubble { background: var(--light); color: var(--fg); border: 1px solid var(--border); border-bottom-left-radius: 2px; }
    .chat-input-row { display: flex; border: 1px solid var(--border); border-top: none; border-radius: 0 0 6px 6px; overflow: hidden; }
    .chat-input { flex: 1; font-family: var(--sans); font-size: 0.88rem; color: var(--fg); background: var(--bg); border: none; padding: 0.85rem 1rem; outline: none; }
    .chat-send { font-family: var(--sans); font-size: 0.7rem; font-weight: 500; text-transform: uppercase; color: var(--bg); background: var(--fg); border: none; padding: 0 1.25rem; cursor: pointer; transition: 0.2s;}
    .chat-send:hover { opacity: 0.9; }
    .chat-send:disabled { background: var(--muted); cursor: not-allowed; }
    .status-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 0.65rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; padding: 4px 10px; border-radius: 20px; margin-bottom: 10px; width: fit-content;}
    .status-loading { background: #fff8e8; color: #c9922a; }
    .status-online { background: #f0faf4; color: #4caf82; }
    .typing-indicator { display: flex; gap: 4px; padding: 10px; }
    .typing-dot { width: 6px; height: 6px; background: #ccc; border-radius: 50%; animation: typingBounce 1.2s infinite; }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typingBounce { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-4px); } }
  </style>
</head>
<body>
  
  <script src="/scripts/sidebar.js"></script>

  <main class="main main--page">
    <div class="page-content ask-wrap">
      <div id="status-badge" class="status-badge status-loading">● Scraping Live Data...</div>
      <h1 class="page-title">Ask Thomas</h1>
      
      <div class="chat-window" id="chat-window">
        <div id="chat-empty" style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#aaa; font-size:0.8rem; text-align:center;">
          <p>I am connected directly to Thomas's live resume and Minescout AI infrastructure. What would you like to know?</p>
        </div>
      </div>

      <div class="chat-input-row">
        <input type="text" class="chat-input" id="chat-input" placeholder="Ask about FRC, Minescout AI, Eagle Scout..." autocomplete="off" />
        <button class="chat-send" id="chat-send" onclick="window.sendMessage()">Send</button>
      </div>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { getFirestore, collection, getDocs, query, where } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: "AIzaSyAmZbRI37rbHWGaOSVomMdcG-IvHMf6S3Y",
      authDomain: "minescout-5533a.firebaseapp.com",
      projectId: "minescout-5533a",
      storageBucket: "minescout-5533a.firebasestorage.app",
      messagingSenderId: "639262143843",
      appId: "1:639262143843:web:4fe407d3b15a4c885a8f56"
    };

    const app = initializeApp(firebaseConfig);
    const db  = getFirestore(app);
    const CLIENT_ID = '5mAIDPwf9kNmNTk3pAQPDfIP9Z93';
    
    // Lock the UI until the brain is loaded
    document.getElementById('chat-input').disabled = true;
    document.getElementById('chat-send').disabled = true;
    document.getElementById('chat-input').placeholder = "Loading Thomas's data...";

    // --- 1. CORE SYSTEM PROMPT ---
    window.knowledgeBase = `STRICT SYSTEM ROLE: You are the AI Assistant representing Thomas Carleton and Minescout AI.
Your ONLY truth is the live context provided below. If a user asks about a project, service, or stat that is NOT in this text, say you don't have that information.
Identity: Speak as an extension of Thomas/Minescout. Be highly professional, technical, and concise. Do NOT hallucinate skills or metrics.

LIVE SCRAPED CONTEXT:
`;

    // --- 2. DYNAMIC DOM SCRAPER ---
    async function scrapePageText(url, label) {
      try {
        const res = await fetch(url, { signal: AbortSignal.timeout(5000) });
        if (!res.ok) {
          console.warn(`Fetch returned ${res.status} for ${url}`);
          return "";
        }
        const html = await res.text();
        const doc = new DOMParser().parseFromString(html, 'text/html');
        
        // CRITICAL FIX: Remove scripts and styles before reading text
        doc.querySelectorAll('script, style, nav, footer, iframe').forEach(el => el.remove());
        
        const mainContent = doc.querySelector('main') || doc.body;
        
        // Use textContent instead of innerText for background parsing
        let cleanText = mainContent.textContent.replace(/\s+/g, ' ').trim();
        
        return `\n--- SOURCE: ${label} (${url}) ---\n${cleanText.substring(0, 3500)}\n`;
      } catch (e) { 
        console.warn(`Failed to scrape ${url}:`, e);
        return ""; 
      }
    }

    async function loadExtraKnowledge() {
      try {
        // Explicitly targeting the index.html files to bypass static routing issues
        const results = await Promise.allSettled([
          scrapePageText('/resume/index.html', 'RESUME & EXPERIENCE'),
          scrapePageText('/ai/index.html', 'MINESCOUT AI PLATFORM'),
          scrapePageText('/index.html', 'PORTFOLIO & WORK'),
          getDocs(query(collection(db, 'clients', CLIENT_ID, 'corrections'), where('status', '==', 'applied'))),
          getDocs(collection(db, 'clients', CLIENT_ID, 'faqs'))
        ]);

        if (results[0].status === 'fulfilled') window.knowledgeBase += results[0].value;
        if (results[1].status === 'fulfilled') window.knowledgeBase += results[1].value;
        if (results[2].status === 'fulfilled') window.knowledgeBase += results[2].value;
        
        if (results[3].status === 'fulfilled') {
          results[3].value.forEach(d => { window.knowledgeBase += `\nFACT OVERRIDE: ${d.data().question} -> ${d.data().correction}`; });
        }
        if (results[4].status === 'fulfilled') {
          results[4].value.forEach(d => { window.knowledgeBase += `\nFAQ OVERRIDE: ${d.data().question} -> ${d.data().answer}`; });
        }

        // Unlock the UI
        const input = document.getElementById('chat-input');
        input.disabled = false;
        input.placeholder = "Ask about FRC, Minescout AI, Eagle Scout...";
        document.getElementById('chat-send').disabled = false;

        const badge = document.getElementById('status-badge');
        badge.innerText = "● System Online (Context Synced)";
        badge.className = "status-badge status-online";
      } catch (e) { 
        console.error("Knowledge base load error:", e); 
      }
    }

    loadExtraKnowledge();
  </script>

  <script>
    const history = [];
    const chatWin = document.getElementById('chat-window');
    const input   = document.getElementById('chat-input');
    const sendBtn = document.getElementById('chat-send');

    window.sendMessage = async function() {
      const text = input.value.trim();
      if (!text || sendBtn.disabled) return;

      const emptyState = document.getElementById('chat-empty');
      if (emptyState) emptyState.remove();

      addMessage('user', text);
      history.push({ role: 'user', content: text });
      input.value = '';
      sendBtn.disabled = true;

      const typing = addTyping();

      try {
        const res = await fetch('https://thomas-chat.tmcarleton11.workers.dev', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            messages: history, 
            client_id: '5mAIDPwf9kNmNTk3pAQPDfIP9Z93',
            system_override: window.knowledgeBase,
            temperature: 0.1 // Kept very low to strictly enforce reading from the scraped text
          })
        });

        const data = await res.json();
        typing.remove();
        addMessage('assistant', data.content);
        history.push({ role: 'assistant', content: data.content });
      } catch(err) {
        typing.remove();
        addMessage('assistant', 'Network disruption. Unable to reach Minescout Edge Worker.');
      }
      sendBtn.disabled = false;
      input.focus();
    };

    function addMessage(role, text) {
      const msg = document.createElement('div');
      msg.className = `msg ${role}`;
      const cleanText = text.replace(/\n/g, '<br/>');
      msg.innerHTML = `<div class="msg-bubble">${cleanText}</div>`;
      chatWin.appendChild(msg);
      chatWin.scrollTop = chatWin.scrollHeight;
      return msg;
    }

    function addTyping() {
      const wrap = document.createElement('div');
      wrap.className = 'msg assistant';
      wrap.innerHTML = `<div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>`;
      chatWin.appendChild(wrap);
      chatWin.scrollTop = chatWin.scrollHeight;
      return wrap;
    }

    input.addEventListener('keydown', e => { 
      if (e.key === 'Enter') window.sendMessage(); 
    });
  </script>
</body>
</html>
