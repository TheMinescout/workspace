<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Client Login — Minescout AI</title>
  <link rel="icon" type="image/png" href="/assets/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #ffffff;
      --fg: #1a1916;
      --accent: #ff4d1c;
      --muted: #66625a;
      --light: #f9f8f6;
      --border: #e8e4dd;
      --serif: 'Playfair Display', serif;
      --sans: 'Jost', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--sans);
      background: #f0ede8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      -webkit-font-smoothing: antialiased;
    }

    .login-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      width: 100%;
      max-width: 400px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.08);
    }

    .login-header {
      background: var(--fg);
      padding: 2rem;
      text-align: center;
    }

    .login-logo {
      font-family: var(--serif);
      font-size: 1.3rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 0.3rem;
    }

    .login-sub {
      font-size: 0.65rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.45);
    }

    .login-body { padding: 2rem; }

    .login-title {
      font-family: var(--serif);
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--fg);
      margin-bottom: 0.35rem;
    }

    .login-desc {
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 1.75rem;
      line-height: 1.6;
    }

    .field { margin-bottom: 1rem; }

    .field label {
      display: block;
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.4rem;
    }

    .field input {
      width: 100%;
      font-family: var(--sans);
      font-size: 0.88rem;
      color: var(--fg);
      background: var(--light);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.7rem 0.9rem;
      outline: none;
      transition: border-color 0.15s;
    }

    .field input:focus { border-color: var(--fg); background: var(--bg); }

    .login-btn {
      width: 100%;
      font-family: var(--sans);
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #fff;
      background: var(--fg);
      border: none;
      border-radius: 4px;
      padding: 0.85rem;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: background 0.15s;
    }

    .login-btn:hover { background: var(--accent); }
    .login-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .login-error {
      font-size: 0.72rem;
      color: var(--accent);
      background: #fff4f1;
      border: 1px solid #ffd5c8;
      border-radius: 4px;
      padding: 0.6rem 0.8rem;
      margin-top: 1rem;
      display: none;
      line-height: 1.5;
    }

    .login-footer {
      padding: 1rem 2rem;
      border-top: 1px solid var(--border);
      background: var(--light);
      font-size: 0.65rem;
      color: var(--muted);
      text-align: center;
      line-height: 1.6;
    }

    .login-footer a { color: var(--muted); border-bottom: 1px solid var(--border); text-decoration: none; }

    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="login-header">
      <div class="login-logo">Minescout AI</div>
      <div class="login-sub">Client Portal</div>
    </div>

    <div class="login-body">
      <div class="login-title">Welcome back</div>
      <p class="login-desc">Sign in to manage your AI assistant, update your business info, and review conversation logs.</p>

      <div class="field">
        <label>Email</label>
        <input type="email" id="email" placeholder="you@yourbusiness.com" autocomplete="email" />
      </div>

      <div class="field">
        <label>Password</label>
        <input type="password" id="password" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" autocomplete="current-password" />
      </div>

      <button class="login-btn" id="login-btn" onclick="doLogin()">Sign In</button>

      <div class="login-error" id="login-error"></div>
    </div>

    <div class="login-footer">
      Don't have an account? <a href="/contact">Contact Thomas</a> to get set up. &nbsp;&middot;&nbsp; <a href="/ai/">Back to Minescout AI</a>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged }
      from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';

    // ── PASTE YOUR FIREBASE CONFIG HERE ──────────────────────
     const firebaseConfig = {
      apiKey: "AIzaSyAmZbRI37rbHWGaOSVomMdcG-IvHMf6S3Y",
      authDomain: "minescout-5533a.firebaseapp.com",
      projectId: "minescout-5533a",
      storageBucket: "minescout-5533a.firebasestorage.app",
      messagingSenderId: "639262143843",
      appId: "1:639262143843:web:4fe407d3b15a4c885a8f56",
      measurementId: "G-VD5NNWE1MK"
    };
    // ─────────────────────────────────────────────────────────

    const app  = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // Redirect if already logged in
    onAuthStateChanged(auth, user => {
      if (user) window.location.href = '/ai/clients/portal';
    });

    window.doLogin = async function() {
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn      = document.getElementById('login-btn');
      const errBox   = document.getElementById('login-error');

      if (!email || !password) {
        showError('Please enter your email and password.');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Signing in...';
      errBox.style.display = 'none';

      try {
        await signInWithEmailAndPassword(auth, email, password);
        // onAuthStateChanged will redirect
      } catch (err) {
        btn.disabled = false;
        btn.textContent = 'Sign In';
        showError(friendlyError(err.code));
      }
    };

    // Enter key support
    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') window.doLogin();
    });

    function showError(msg) {
      const el = document.getElementById('login-error');
      el.textContent = msg;
      el.style.display = 'block';
    }

    function friendlyError(code) {
      const map = {
        'auth/user-not-found':   'No account found with that email.',
        'auth/wrong-password':   'Incorrect password. Try again.',
        'auth/invalid-email':    'Please enter a valid email address.',
        'auth/too-many-requests':'Too many attempts. Please wait a few minutes.',
        'auth/invalid-credential': 'Email or password is incorrect.',
      };
      return map[code] || 'Sign-in failed. Please try again.';
    }
  </script>

</body>
</html>
