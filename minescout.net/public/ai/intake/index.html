<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minescout AI — Client Intake</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  
  <style>
    :root {
      --bg: #ffffff;
      --fg: #0a2540;
      --accent: #c9a96e;
      --muted: #64748b;
      --light: #f8fafc;
      --border: #e2e8f0;
      --serif: 'Libre Baskerville', serif;
      --sans: 'Jost', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body { 
      background: #f1f5f9; 
      color: var(--fg); 
      font-family: var(--sans); 
      line-height: 1.6; 
      padding: 40px 20px; 
      -webkit-font-smoothing: antialiased;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .form-container { 
      background: var(--bg); 
      width: 100%;
      max-width: 600px; 
      padding: 60px; 
      box-shadow: 0 20px 50px rgba(0,0,0,0.05); 
      border-radius: 6px; 
      border-top: 4px solid var(--fg);
    }

    header { 
      border-bottom: 2px solid var(--border); 
      padding-bottom: 25px; 
      margin-bottom: 35px; 
      text-align: center;
    }
    
    .brand h1 { 
      font-family: var(--serif); 
      font-size: 2rem; 
      line-height: 1; 
      margin-bottom: 10px; 
      text-transform: uppercase; 
      letter-spacing: -0.02em; 
    }
    
    .brand p { 
      font-size: 0.85rem; 
      letter-spacing: 0.2em; 
      text-transform: uppercase; 
      color: var(--accent); 
      font-weight: 600; 
    }

    .intro-text {
      text-align: center;
      margin-bottom: 30px;
      font-size: 0.95rem;
      color: var(--muted);
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      font-size: 0.75rem;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--fg);
      letter-spacing: 0.1em;
      display: block;
      margin-bottom: 8px;
    }

    .optional-tag {
      color: var(--muted);
      font-weight: 400;
      font-size: 0.65rem;
      letter-spacing: 0.05em;
    }

    input[type="text"],
    input[type="email"],
    input[type="url"],
    textarea {
      width: 100%;
      padding: 12px 15px;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-family: var(--sans);
      font-size: 1rem;
      outline: none;
      background: var(--light);
      transition: all 0.2s ease;
      color: var(--fg);
    }

    input:focus,
    textarea:focus {
      border-color: var(--accent);
      background: var(--bg);
      box-shadow: 0 0 0 3px rgba(201, 169, 110, 0.1);
    }

    textarea {
      resize: vertical;
      min-height: 120px;
    }

    .btn { 
      background: var(--fg); 
      color: white; 
      border: none; 
      padding: 15px 20px; 
      width: 100%;
      border-radius: 4px; 
      font-family: var(--sans); 
      font-weight: 600; 
      cursor: pointer; 
      transition: 0.2s; 
      letter-spacing: 0.1em; 
      text-transform: uppercase; 
      font-size: 0.9rem;
      margin-top: 10px;
    }

    .btn:hover { 
      background: var(--accent); 
    }

    footer {
      margin-top: 30px;
      text-align: center;
      font-size: 0.7rem;
      color: var(--muted);
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    /* Mobile Responsiveness */
    @media (max-width: 600px) {
      .form-container { padding: 40px 25px; }
    }
    
    /* Print Styles */
    @media print {
      body { background: white; padding: 0; margin: 0; align-items: flex-start; }
      .form-container { box-shadow: none; border-top: none; max-width: 100%; padding: 0.5in; }
    }
  </style>
</head>
<body>

  <div class="form-container" id="main-container">
    <header>
      <div class="brand">
        <h1>Minescout AI</h1>
        <p>Project Initiation</p>
      </div>
    </header>

    <p class="intro-text" id="intro-msg">
      Please provide your operational details below. A Minescout architect will review your infrastructure and reach out within 24 hours.
    </p>

    <form id="intake-form">
      
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" required placeholder="e.g. Jane Doe">
      </div>

      <div class="form-group">
        <label for="email">Contact Email</label>
        <input type="email" id="email" name="email" required placeholder="jane@example.com">
      </div>

      <div class="form-group">
        <label for="business">Business Name</label>
        <input type="text" id="business" name="business" required placeholder="Your Company LLC">
      </div>

      <div class="form-group">
        <label for="url">Current Website URL <span class="optional-tag">(Optional)</span></label>
        <input type="url" id="url" name="url" placeholder="https://www.yourdomain.com">
      </div>

      <div class="form-group">
        <label for="goals">Primary Goal for New Architecture</label>
        <textarea id="goals" name="goals" required placeholder="e.g. Need to capture more leads, want a modern design, need an AI booking system..."></textarea>
      </div>

      <button type="submit" class="btn">Submit Request</button>
    </form>

    <footer id="form-footer">
      Secure Transmission • Minescout Edge Network
    </footer>
  </div>

  <script>
    // Your live Cloudflare Edge Endpoint
    const WORKER_URL = "https://minescout-intake.tmcarleton11.workers.dev/";

    document.getElementById('intake-form').addEventListener('submit', async function(e) {
      e.preventDefault(); // Stops the page from refreshing
      
      // 1. Loading State
      const btn = e.target.querySelector('button');
      const originalBtnText = btn.innerText;
      btn.innerText = "Transmitting to Edge...";
      btn.disabled = true;
      btn.style.opacity = "0.7";

      // 2. Package the Lead Data
      const payload = {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        business: document.getElementById('business').value,
        url: document.getElementById('url').value,
        goals: document.getElementById('goals').value
      };

      try {
        // 3. Send to your Cloudflare Worker
        const response = await fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        if (!response.ok) {
          throw new Error("Network response was not ok");
        }

        // 4. Success! Morph the UI into the Printable Receipt
        const container = document.getElementById('main-container');
        
        container.innerHTML = `
          <header style="border-bottom: 2px solid var(--border); padding-bottom: 25px; margin-bottom: 35px; text-align: center;">
            <div class="brand">
              <h1 style="font-family: var(--serif); font-size: 2rem; line-height: 1; margin-bottom: 10px; text-transform: uppercase; letter-spacing: -0.02em;">Minescout AI</h1>
              <p style="font-size: 0.85rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent); font-weight: 600;">Initiation Receipt</p>
            </div>
          </header>
          
          <div style="background: var(--light); border: 1px solid var(--border); border-left: 4px solid var(--fg); padding: 30px; border-radius: 4px; margin-bottom: 30px;">
            <p style="font-size: 0.75rem; text-transform: uppercase; font-weight: 700; color: var(--muted); letter-spacing: 0.1em; margin-bottom: 5px;">Target Infrastructure</p>
            <h2 style="font-family: var(--serif); font-size: 1.5rem; color: var(--fg); margin-bottom: 20px;">${payload.business}</h2>
            
            <p style="font-size: 0.75rem; text-transform: uppercase; font-weight: 700; color: var(--muted); letter-spacing: 0.1em; margin-bottom: 5px;">Primary Contact</p>
            <p style="font-family: var(--sans); font-size: 1.1rem; color: var(--fg); font-weight: 500;">${payload.name} &lt;${payload.email}&gt;</p>
            
            <p style="font-size: 0.75rem; text-transform: uppercase; font-weight: 700; color: var(--muted); letter-spacing: 0.1em; margin-top: 20px; margin-bottom: 5px;">Scan Target URL</p>
            <p style="font-family: var(--sans); font-size: 1.1rem; color: var(--fg); font-weight: 500;">${payload.url || 'Not Provided'}</p>
          </div>
          
          <p style="text-align: center; color: var(--fg); font-weight: 500; font-size: 1.05rem;">
            Your diagnostic request has been successfully transmitted to the Minescout Edge Network.
          </p>
          <p style="text-align: center; color: var(--muted); font-size: 0.9rem; margin-top: 15px;">
            A lead architect will review your current infrastructure and reach out within 24 hours. You may save or print this document for your records.
          </p>

          <footer style="margin-top: 40px; text-align: center; font-size: 0.7rem; color: var(--muted); font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; border-top: 1px solid var(--border); padding-top: 20px;">
            Verified by Minescout Lead Architect • System Generated
          </footer>
        `;
        
        // 5. Trigger the automatic PDF Save/Print dialog
        setTimeout(() => window.print(), 800);

      } catch (error) {
        alert("Error connecting to edge network. Please check your connection and try again.");
        btn.innerText = originalBtnText;
        btn.disabled = false;
        btn.style.opacity = "1";
      }
    });
  </script>
</body>
</html>
