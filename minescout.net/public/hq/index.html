<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MINESCOUT | Command Center</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --bg-dark: #0a0a0c;
      --bg-panel: #121214;
      --border-color: #222226;
      --text-main: #f4f4f5;
      --text-muted: #a1a1aa;
      --neon-green: #10b981;
      --neon-blue: #3b82f6;
      --neon-purple: #8b5cf6;
      --neon-orange: #f59e0b;
      --danger: #ef4444;
      --font-mono: 'Space Mono', monospace;
      --font-sans: 'Inter', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-sans);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .terminal-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 3rem;
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 2rem;
      margin-bottom: 3rem;
    }

    .brand h1 {
      font-family: var(--font-mono);
      font-size: 1.8rem;
      letter-spacing: 0.1em;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .status-indicator {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: var(--neon-green);
      box-shadow: 0 0 10px var(--neon-green);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
      70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
      100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }

    .stats-bar {
      display: flex;
      gap: 3rem;
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .stat-label { font-family: var(--font-mono); font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; }
    .stat-value { font-size: 1.5rem; font-weight: 800; font-family: var(--font-mono); }

    /* Node Grid */
    .node-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
      gap: 2rem;
    }

    .node-card {
      background-color: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 2rem;
      transition: all 0.2s ease;
      position: relative;
    }

    .node-card:hover {
      border-color: #33333a;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      transform: translateY(-2px);
    }

    .node-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 1.5rem;
    }

    .node-id {
      font-family: var(--font-mono);
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--neon-green);
    }

    .node-name {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* Tier Badges */
    .tier-badge {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 50px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .tier-charter { background: rgba(16, 185, 129, 0.1); border: 1px solid var(--neon-green); color: var(--neon-green); }
    .tier-ai { background: rgba(139, 92, 246, 0.1); border: 1px solid var(--neon-purple); color: var(--neon-purple); }
    .tier-classic { background: rgba(245, 158, 11, 0.1); border: 1px solid var(--neon-orange); color: var(--neon-orange); }

    .node-details {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 2rem;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
    }
    .detail-label { color: var(--text-muted); font-family: var(--font-mono); }
    .detail-value { font-weight: 600; }
    .detail-value.link a { color: var(--text-main); text-decoration: none; border-bottom: 1px dashed var(--text-muted); }
    .detail-value.link a:hover { color: var(--neon-blue); border-color: var(--neon-blue); }

    .node-actions {
      display: flex;
      gap: 10px;
      border-top: 1px solid var(--border-color);
      padding-top: 1.5rem;
    }

    .btn {
      flex: 1;
      padding: 10px;
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      border-radius: 4px;
      cursor: pointer;
      transition: 0.2s;
      text-align: center;
      text-decoration: none;
    }

    .btn:hover { background: rgba(255,255,255,0.05); border-color: var(--text-muted); }
    .btn.primary { background: var(--text-main); color: var(--bg-dark); border-color: var(--text-main); }
    .btn.primary:hover { background: var(--neon-green); border-color: var(--neon-green); color: #000; }
    .btn.danger { border-color: rgba(239, 68, 68, 0.3); color: var(--danger); }
    .btn.danger:hover { background: rgba(239, 68, 68, 0.1); border-color: var(--danger); }

    /* Modals & Auth */
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); display: flex; align-items: center; justify-content: center; z-index: 9999; }
    .modal-card { background: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 8px; padding: 3rem; width: 100%; max-width: 500px; }
    
    .input-group { margin-bottom: 1.5rem; }
    .input-group label { display: block; font-family: var(--font-mono); font-size: 0.7rem; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; }
    .input-group input, .input-group select { width: 100%; background: var(--bg-dark); border: 1px solid var(--border-color); color: white; padding: 12px; border-radius: 4px; font-family: var(--font-mono); outline: none; }
    .input-group input:focus, .input-group select:focus { border-color: var(--neon-green); }

    .add-node-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px dashed var(--border-color);
      border-radius: 8px;
      background: transparent;
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 1rem;
      cursor: pointer;
      transition: 0.2s;
      min-height: 250px;
    }
    .add-node-btn:hover { border-color: var(--neon-green); color: var(--neon-green); background: rgba(16,185,129,0.05); }

  </style>
</head>
<body>

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const WORKER_URL = "https://backend.tmcarleton11.workers.dev/"; 
    const MASTER_SITE_ID = "minescout_master_registry"; 

    const App = () => {
      const [isAuthed, setIsAuthed] = useState(false);
      const [adminKey, setAdminKey] = useState("");
      const [registry, setRegistry] = useState({ nodes: [] });
      const [loading, setLoading] = useState(false);
      const [showAddModal, setShowAddModal] = useState(false);
      
      // New Node Form State
      const [newNode, setNewNode] = useState({ id: '', name: '', url: '', tier: 'Classic Remodel' });

      const authenticate = async () => {
        setLoading(true);
        try {
          const res = await fetch(WORKER_URL, { headers: { 'X-Site-Id': MASTER_SITE_ID } });
          if (res.ok) {
            const data = await res.json();
            if (data && data.nodes) {
              setRegistry(data);
            } else {
              // Initialize default registry if it's the very first time
              setRegistry({
                nodes: [
                  { id: "handmadebyjayme", name: "Jayme M. Carleton", url: "https://jaymecarleton.com", tier: "Charter Spot", lastSync: "2026-03-15" },
                  { id: "smith_cole_legal", name: "Smith & Cole Legal", url: "https://smithcole.com", tier: "AI Managed Node", lastSync: "2026-03-10" }
                ]
              });
            }
            setIsAuthed(true);
          } else {
            // If the node doesn't exist yet, we let them in but they must save to create it
            setIsAuthed(true);
            setRegistry({
                nodes: [
                  { id: "handmadebyjayme", name: "Jayme M. Carleton", url: "https://jaymecarleton.com", tier: "Charter Spot", lastSync: "2026-03-15" }
                ]
            });
          }
        } catch (e) {
          alert("Could not connect to Edge Network.");
        }
        setLoading(false);
      };

      const saveRegistry = async (updatedRegistry) => {
        const res = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Site-Id': MASTER_SITE_ID },
          body: JSON.stringify({ key: adminKey, data: updatedRegistry })
        });
        if (res.ok) {
          setRegistry(updatedRegistry);
          setShowAddModal(false);
          setNewNode({ id: '', name: '', url: '', tier: 'Classic Remodel' });
        } else {
          alert("Invalid Reason Key. Cannot save to Master Registry.");
        }
      };

      const handleAddNode = () => {
        const updated = {
          nodes: [...registry.nodes, { 
            ...newNode, 
            id: newNode.id.toLowerCase().replace(/[^a-z0-9_]/g, ''),
            lastSync: new Date().toISOString().split('T')[0] 
          }]
        };
        saveRegistry(updated);
      };

      const handleRemoveNode = (index) => {
        if(!confirm("Are you sure you want to remove this node from the registry?")) return;
        const updated = { nodes: [...registry.nodes] };
        updated.nodes.splice(index, 1);
        saveRegistry(updated);
      };

      const getTierClass = (tier) => {
        if (tier.includes('Charter')) return 'tier-charter';
        if (tier.includes('AI')) return 'tier-ai';
        return 'tier-classic';
      };

      const getTierPrice = (tier) => {
        if (tier.includes('Charter')) return '$0/mo';
        if (tier.includes('AI')) return '$59/mo';
        return '$29/mo';
      };

      // Calculate MRR (Monthly Recurring Revenue)
      const calculateMRR = () => {
        return registry.nodes.reduce((total, node) => {
          if (node.tier.includes('AI')) return total + 59;
          if (node.tier.includes('Classic')) return total + 29;
          return total;
        }, 0);
      };

      if (!isAuthed) {
        return (
          <div className="overlay">
            <div className="modal-card" style={{textAlign: 'center'}}>
              <h2 style={{fontFamily:'var(--font-mono)', marginBottom:'2rem'}}>MINESCOUT HQ</h2>
              <div className="input-group">
                <input 
                  type="password" 
                  placeholder="Master Key..." 
                  value={adminKey} 
                  onChange={e => setAdminKey(e.target.value)}
                  onKeyDown={e => e.key === 'Enter' && authenticate()}
                  style={{textAlign:'center', fontSize:'1.2rem', letterSpacing:'0.2em'}}
                />
              </div>
              <button className="btn primary" onClick={authenticate} style={{width:'100%', padding:'15px'}}>
                {loading ? 'INITIALIZING...' : 'AUTHORIZE TERMINAL'}
              </button>
            </div>
          </div>
        );
      }

      return (
        <div className="terminal-container">
          <header>
            <div className="brand">
              <h1><span className="status-indicator"></span> MINESCOUT COMMAND</h1>
            </div>
            <div className="stats-bar">
              <div className="stat-item">
                <span className="stat-label">Active Nodes</span>
                <span className="stat-value">{registry.nodes.length}</span>
              </div>
              <div className="stat-item">
                <span className="stat-label">Projected MRR</span>
                <span className="stat-value" style={{color:'var(--neon-green)'}}>${calculateMRR()}</span>
              </div>
            </div>
          </header>

          <div className="node-grid">
            {registry.nodes.map((node, i) => (
              <div className="node-card" key={i}>
                <div className="node-header">
                  <div>
                    <div className="node-id">{node.id}</div>
                    <div className="node-name">{node.name}</div>
                  </div>
                  <span className={`tier-badge ${getTierClass(node.tier)}`}>{node.tier}</span>
                </div>

                <div className="node-details">
                  <div className="detail-row">
                    <span className="detail-label">PROD_URL</span>
                    <span className="detail-value link"><a href={node.url} target="_blank">{node.url.replace('https://', '')}</a></span>
                  </div>
                  <div className="detail-row">
                    <span className="detail-label">LAST_SYNC</span>
                    <span className="detail-value">{node.lastSync}</span>
                  </div>
                  <div className="detail-row">
                    <span className="detail-label">REVENUE</span>
                    <span className="detail-value" style={{color: 'var(--neon-green)'}}>{getTierPrice(node.tier)}</span>
                  </div>
                </div>

                <div className="node-actions">
                  <a href={`${node.url}#admin`} target="_blank" className="btn primary">Open Backstage</a>
                  <button className="btn danger" onClick={() => handleRemoveNode(i)}>Unlink</button>
                </div>
              </div>
            ))}

            {/* Add Node Button */}
            <button className="add-node-btn" onClick={() => setShowAddModal(true)}>
              + PROVISION NEW NODE
            </button>
          </div>

          {/* Add Node Modal */}
          {showAddModal && (
            <div className="overlay">
              <div className="modal-card">
                <h3 style={{fontFamily:'var(--font-mono)', marginBottom:'2rem'}}>Provision New Client</h3>
                
                <div className="input-group">
                  <label>Minescout Site ID (e.g. janes_bakery)</label>
                  <input value={newNode.id} onChange={e => setNewNode({...newNode, id: e.target.value})} placeholder="Lowercase, no spaces" />
                </div>
                
                <div className="input-group">
                  <label>Client / Business Name</label>
                  <input value={newNode.name} onChange={e => setNewNode({...newNode, name: e.target.value})} placeholder="Jane's Bakery LLC" />
                </div>

                <div className="input-group">
                  <label>Production URL</label>
                  <input value={newNode.url} onChange={e => setNewNode({...newNode, url: e.target.value})} placeholder="https://..." />
                </div>

                <div className="input-group">
                  <label>Service Tier</label>
                  <select value={newNode.tier} onChange={e => setNewNode({...newNode, tier: e.target.value})}>
                    <option value="Classic Remodel">Classic Remodel ($29/mo)</option>
                    <option value="AI Managed Node">AI Managed Node ($59/mo)</option>
                    <option value="Charter Spot">Charter Spot ($0/mo - 1yr)</option>
                  </select>
                </div>

                <div style={{display:'flex', gap:'10px', marginTop:'2rem'}}>
                  <button className="btn" onClick={() => setShowAddModal(false)}>Cancel</button>
                  <button className="btn primary" onClick={handleAddNode}>Provision Node</button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
