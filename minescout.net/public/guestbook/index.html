<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guestbook — Thomas Carleton</title>
  <link rel="icon" type="image/png" href="../../assets/favicon.png" />
  <link rel="stylesheet" href="../../styles/main.css?v=8.1" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
  <meta property="og:type"         content="website" />
  <meta property="og:site_name"    content="Thomas Carleton" />
  <meta property="og:title"        content="Guestbook — Thomas Carleton" />
  <meta property="og:description"  content="Leave a note for Thomas Carleton." />
  <meta property="og:url"          content="https://minescout.net/guestbook" />
  <meta property="og:image"        content="https://minescout.net/assets/og-image.png" />
  <meta property="og:image:width"  content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card"        content="summary_large_image" />
  <meta name="twitter:title"       content="Guestbook — Thomas Carleton" />
  <meta name="twitter:description" content="Leave a note for Thomas Carleton." />
  <meta name="twitter:image"       content="https://minescout.net/assets/og-image.png" />
  <style>
    .guestbook-wrap { max-width: 600px; }
    .gb-intro { font-size: 0.95rem; color: var(--muted); line-height: 1.7; margin-bottom: 2.5rem; opacity: 0; animation: fadeUp 0.5s ease 0.2s forwards; }
    .gb-form { display: flex; flex-direction: column; gap: 1rem; padding: 1.5rem; background: var(--light); border: 1px solid var(--border); border-radius: 6px; margin-bottom: 3rem; opacity: 0; animation: fadeUp 0.5s ease 0.3s forwards; }
    .gb-form-row { display: flex; gap: 1rem; }
    .form-group { display: flex; flex-direction: column; gap: 0.4rem; flex: 1; }
    .form-group label { font-size: 0.7rem; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg); }
    .form-group input, .form-group textarea {
      font-family: var(--sans); font-size: 0.88rem; color: var(--fg);
      background: var(--bg); border: 1px solid var(--border); border-radius: 4px;
      padding: 0.65rem 0.85rem; outline: none; transition: border-color 0.15s, box-shadow 0.15s;
      resize: none; width: 100%; box-sizing: border-box;
    }
    .form-group input::placeholder, .form-group textarea::placeholder { color: var(--border); }
    .form-group input:focus, .form-group textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(255,77,28,0.1); }
    .form-group textarea { min-height: 90px; line-height: 1.6; }
    .gb-submit { font-family: var(--sans); font-size: 0.72rem; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: var(--bg); background: var(--fg); border: none; border-radius: 4px; padding: 0.75rem 1.5rem; cursor: pointer; transition: background 0.15s; align-self: flex-start; }
    .gb-submit:hover { background: var(--accent); }
    .gb-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .gb-entries-label { font-size: 0.7rem; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 1.25rem; opacity: 0; animation: fadeUp 0.5s ease 0.4s forwards; }
    .gb-entry { padding: 1.1rem 0; border-bottom: 1px solid var(--border); display: grid; grid-template-columns: 1fr auto; gap: 0.5rem; align-items: start; animation: fadeUp 0.4s ease forwards; }
    .gb-entry-name { font-size: 0.82rem; font-weight: 500; color: var(--fg); margin-bottom: 0.2rem; }
    .gb-entry-date { font-size: 0.7rem; color: var(--muted); margin-bottom: 0.5rem; }
    .gb-entry-message { font-size: 0.88rem; color: var(--fg); line-height: 1.6; }
    .gb-delete { background: none; border: none; cursor: pointer; color: var(--border); font-size: 0.75rem; padding: 0.2rem 0.4rem; border-radius: 3px; transition: color 0.15s, background 0.15s; display: none; }
    .gb-delete:hover { color: #c0392b; background: #fdf0ef; }
    .admin-mode .gb-delete { display: inline-block; }
    .admin-bar { margin-bottom: 2rem; opacity: 0; animation: fadeUp 0.5s ease 0.35s forwards; }
    .admin-toggle { background: none; border: none; font-family: var(--sans); font-size: 0.7rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); cursor: pointer; padding: 0; transition: color 0.15s; }
    .admin-toggle:hover { color: var(--fg); }
    .admin-pin-wrap { display: none; margin-top: 0.6rem; gap: 0.5rem; align-items: center; }
    .admin-pin-wrap.visible { display: flex; }
    .admin-pin-input { font-family: var(--sans); font-size: 0.82rem; padding: 0.4rem 0.7rem; border: 1px solid var(--border); border-radius: 4px; outline: none; width: 120px; color: var(--fg); background: var(--bg); }
    .admin-pin-input:focus { border-color: var(--accent); }
    .admin-pin-btn { font-family: var(--sans); font-size: 0.7rem; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; background: var(--fg); color: var(--bg); border: none; border-radius: 4px; padding: 0.4rem 0.8rem; cursor: pointer; }
    .admin-pin-btn:hover { background: var(--accent); }
    .admin-active-label { font-size: 0.7rem; color: var(--accent); letter-spacing: 0.05em; text-transform: uppercase; display: none; }
    .admin-mode .admin-active-label { display: inline; }
    .admin-mode .admin-toggle { display: none; }
    .gb-loading { font-size: 0.82rem; color: var(--muted); padding: 1rem 0; }
    .gb-empty { font-size: 0.88rem; color: var(--muted); font-style: italic; padding: 1rem 0; }
  </style>
</head>
<body>



  <main class="main main--page">
    <div class="page-content guestbook-wrap">
      <p class="page-label">Guestbook</p>
      <h1 class="page-title">Say Hello</h1>

      <p class="gb-intro">
        You stopped by — leave a note! Whether you have a question, a kind word,
        or just want to say hi, I'd love to hear from you.
      </p>

      <div class="gb-form">
        <div class="gb-form-row">
          <div class="form-group">
            <label for="gb-name">Name <span style="color:var(--accent)">*</span></label>
            <input type="text" id="gb-name" placeholder="Your name" maxlength="60" required />
          </div>
          <div class="form-group">
            <label for="gb-location">Location <span style="color:var(--muted);font-weight:300">(optional)</span></label>
            <input type="text" id="gb-location" placeholder="City, Country" maxlength="60" />
          </div>
        </div>
        <div class="form-group">
          <label for="gb-message">Message <span style="color:var(--accent)">*</span></label>
          <textarea id="gb-message" placeholder="Leave a note..." maxlength="500"></textarea>
        </div>
        <button class="gb-submit" id="gb-submit">Post to Guestbook</button>
      </div>

      <div class="admin-bar">
        <button class="admin-toggle" id="admin-toggle" onclick="showPinInput()">Admin</button>
        <span class="admin-active-label">● Admin mode on</span>
        <div class="admin-pin-wrap" id="admin-pin-wrap">
          <input type="password" class="admin-pin-input" id="admin-pin" placeholder="Enter PIN" />
          <button class="admin-pin-btn" onclick="checkPin()">Unlock</button>
        </div>
      </div>

      <p class="gb-entries-label" id="entries-label">— Entries —</p>
      <div class="gb-entries" id="gb-entries">
        <p class="gb-loading">Loading entries...</p>
      </div>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, orderBy, query, serverTimestamp }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAmZbRI37rbHWGaOSVomMdcG-IvHMf6S3Y",
      authDomain: "minescout-5533a.firebaseapp.com",
      projectId: "minescout-5533a",
      storageBucket: "minescout-5533a.firebasestorage.app",
      messagingSenderId: "639262143843",
      appId: "1:639262143843:web:4fe407d3b15a4c885a8f56",
      measurementId: "G-VD5NNWE1MK"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function loadEntries() {
      const container = document.getElementById('gb-entries');
      const q = query(collection(db, 'guestbook'), orderBy('timestamp', 'desc'));
      const snap = await getDocs(q);
      if (snap.empty) { container.innerHTML = '<p class="gb-empty">No entries yet — be the first!</p>'; return; }
      container.innerHTML = '';
      snap.forEach(docSnap => {
        const d = docSnap.data();
        const date = d.timestamp?.toDate
          ? d.timestamp.toDate().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })
          : 'Just now';
        const entry = document.createElement('div');
        entry.className = 'gb-entry';
        entry.innerHTML = `
          <div class="gb-entry-main">
            <div class="gb-entry-name">${esc(d.name)}${d.location ? ' · <span style="font-weight:300;color:var(--muted)">' + esc(d.location) + '</span>' : ''}</div>
            <div class="gb-entry-date">${date}</div>
            <div class="gb-entry-message">${esc(d.message)}</div>
          </div>
          <button class="gb-delete" title="Delete entry" onclick="window._deleteEntry('${docSnap.id}', this)">✕</button>
        `;
        container.appendChild(entry);
      });
    }

    document.getElementById('gb-submit').addEventListener('click', async () => {
      const name    = document.getElementById('gb-name').value.trim();
      const location = document.getElementById('gb-location').value.trim();
      const message = document.getElementById('gb-message').value.trim();
      const btn     = document.getElementById('gb-submit');
      if (!name)    { alert('Please enter your name.'); return; }
      if (!message) { alert('Please enter a message.'); return; }
      btn.disabled = true; btn.textContent = 'Posting...';
      try {
        await addDoc(collection(db, 'guestbook'), { name, location, message, timestamp: serverTimestamp() });
        document.getElementById('gb-name').value = '';
        document.getElementById('gb-location').value = '';
        document.getElementById('gb-message').value = '';
        await loadEntries();
      } catch (err) { alert('Something went wrong. Try again.'); console.error(err); }
      btn.disabled = false; btn.textContent = 'Post to Guestbook';
    });

    window._deleteEntry = async (id, btn) => {
      if (!confirm('Delete this entry?')) return;
      try { await deleteDoc(doc(db, 'guestbook', id)); btn.closest('.gb-entry').remove(); }
      catch (err) { alert('Could not delete.'); console.error(err); }
    };

    function esc(str) {
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    loadEntries();
  </script>

  <script>
    const ADMIN_PIN = '1294';
    function showPinInput() {
      document.getElementById('admin-pin-wrap').classList.add('visible');
      document.getElementById('admin-pin').focus();
    }
    function checkPin() {
      const entered = document.getElementById('admin-pin').value;
      if (entered === ADMIN_PIN) {
        document.querySelector('.guestbook-wrap').classList.add('admin-mode');
        document.getElementById('admin-pin-wrap').classList.remove('visible');
      } else {
        alert('Incorrect PIN.');
        document.getElementById('admin-pin').value = '';
      }
    }
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('admin-pin').addEventListener('keydown', e => {
        if (e.key === 'Enter') checkPin();
      });
    });
  </script>
  <script src="/scripts/sidebar.js"></script>
  <script src="/scripts/main.js"></script>
</body>
</html>
