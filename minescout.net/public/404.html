<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found — Thomas Carleton</title>
  <link rel="icon" type="image/png" href="/assets/favicon.png" />
  
  <link rel="stylesheet" href="/styles/main.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <style>
    /* Hardcoded layout just for the static 404 fallback */
    body {
      margin: 0;
      padding: 0;
      background: var(--bg, #ffffff);
      color: var(--fg, #0a2540);
      font-family: var(--sans, 'Jost', sans-serif);
      display: flex;
      min-height: 100vh;
    }

    /* Emulate the SPA sidebar visually */
    .static-sidebar {
      width: 260px;
      background: var(--light, #f8fafc);
      border-right: 1px solid var(--border, #e2e8f0);
      display: flex;
      flex-direction: column;
      padding: 2rem 1.5rem;
      flex-shrink: 0;
    }

    .static-sidebar a {
      text-decoration: none;
      color: var(--muted, #64748b);
      padding: 0.5rem 0.85rem;
      border-radius: 4px;
      font-size: 0.85rem;
      margin-bottom: 0.2rem;
      transition: background 0.2s, color 0.2s;
    }

    .static-sidebar a:hover {
      background: var(--border, #e2e8f0);
      color: var(--fg, #0a2540);
    }

    .sidebar-logo-wrap { display: flex; align-items: center; gap: 1rem; margin-bottom: 3rem; padding: 0 0.5rem; }
    .sidebar-logo { width: 36px; height: 36px; border-radius: 6px; }
    .sidebar-name { font-weight: 600; font-size: 0.9rem; color: var(--fg); }
    .sidebar-tagline { font-size: 0.65rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
    
    .sidebar-divider { height: 1px; background: var(--border); margin: 1.5rem 0; }

    /* 404 Content Centering */
    .static-main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .not-found-wrap {
      text-align: center;
      max-width: 420px;
      animation: fadeUp 0.5s ease forwards;
    }

    .not-found-number {
      font-family: var(--serif, 'Libre Baskerville', serif);
      font-size: 7rem;
      font-weight: 700;
      color: var(--fg);
      line-height: 1;
      margin-bottom: 0.5rem;
      letter-spacing: -0.02em;
    }

    .not-found-number em {
      color: var(--accent, #c9a96e);
      font-style: italic;
    }

    .not-found-title {
      font-family: var(--serif);
      font-size: 1.8rem;
      color: var(--fg);
      margin-bottom: 1rem;
    }

    .not-found-desc {
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 2.5rem;
      font-size: 0.95rem;
    }

    .not-found-links {
      display: flex;
      gap: 1rem;
      justify-content: center;
    }

    .not-found-link {
      padding: 0.8rem 1.5rem;
      border-radius: 4px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-size: 0.75rem;
      text-decoration: none;
      transition: all 0.2s;
    }

    .not-found-link.primary {
      background: var(--fg);
      color: #fff;
    }

    .not-found-link.primary:hover {
      background: var(--accent);
    }

    .not-found-link.ghost {
      background: transparent;
      color: var(--fg);
      border: 1px solid var(--border);
    }

    .not-found-link.ghost:hover {
      border-color: var(--fg);
    }

    @media (max-width: 768px) {
      body { flex-direction: column; }
      .static-sidebar { display: none; } /* Hide static sidebar on mobile to save space */
      .static-main { min-height: 100vh; }
    }
    
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <aside class="static-sidebar">
    <div class="sidebar-logo-wrap">
      <img src="/assets/favicon.png" alt="TC" class="sidebar-logo" />
      <div>
        <div class="sidebar-name">Thomas Carleton</div>
        <div class="sidebar-tagline">minescout.net</div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 0.2rem;">
      <a href="/">Home</a>
      <a href="/work">Work</a>
      <a href="/blog">Blog</a>
      <a href="/resume">Resume</a>
      <a href="/about">About</a>
    </div>

    <div class="sidebar-divider"></div>

    <div style="display: flex; flex-direction: column; gap: 0.2rem;">
      <a href="/ai">AI Services</a>
      <a href="/contact">Contact</a>
      <a href="/guestbook">Guestbook</a>
      <a href="/now">Now</a>
      <a href="/ask">Ask</a>
    </div>
  </aside>

  <main class="static-main">
    <div class="not-found-wrap">
      <div class="not-found-number">40<em>4</em></div>
      <h1 class="not-found-title">Page Not Found</h1>
      <p class="not-found-desc">Looks like you've ventured off the map. The page you're looking for doesn't exist or has been moved.</p>
      
      <div class="not-found-links">
        <a href="/" class="not-found-link primary">Return Home</a>
        <a href="/work" class="not-found-link ghost">View Work</a>
      </div>
    </div>
  </main>

</body>
</html>
