<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Console | The Chop Lab Admin</title>
    <link rel="stylesheet" href="assets/css/index.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="assets/images/Favicon.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2D3133">
    <style>
        body { background: #F4F4F6; }
        
        .admin-container { 
            max-width: 1400px; 
            margin: 40px auto; 
            padding: 0 24px; 
        }

        .admin-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: flex-end; 
            margin-bottom: 30px; 
            padding-bottom: 20px;
            border-bottom: 2px solid #2D3133;
        }

        /* Engineering Table Style */
        .table-wrapper {
            background: white;
            box-shadow: var(--elevation-1);
            border: 1px solid var(--tcl-border);
        }

        table { 
            width: 100%; 
            border-collapse: collapse; 
        }

        th { 
            background: #2D3133; 
            color: #fff; 
            padding: 15px; 
            text-align: left; 
            font-family: 'Roboto Mono', monospace;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        td { 
            padding: 15px; 
            border-bottom: 1px solid #f0f0f0; 
            font-family: 'Roboto Mono', monospace; 
            font-size: 0.8rem;
            color: #444;
        }

        tr:hover { background: #fafafa; }

        .status-pill { 
            padding: 4px 10px; 
            background: #eee; 
            border-radius: 2px; 
            font-weight: 700;
            font-size: 0.7rem;
            text-transform: uppercase;
        }

        /* Login Gate Polish */
        #login-screen { 
            position: fixed; top:0; left:0; width:100%; height:100%; 
            background:#2D3133; display:flex; justify-content:center; 
            align-items:center; z-index:999; 
        }

        .login-box { 
            background:white; padding:50px; text-align:center; 
            width: 400px; border-radius: 0; 
            box-shadow: var(--elevation-2);
        }

        .login-box h2 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            margin-bottom: 20px;
            letter-spacing: -1px;
        }

        #debug-log { 
            margin-top: 20px; font-size: 0.7rem; color: #d9534f; 
            background: #fff5f5; border: 1px solid #ffdada; 
            padding: 12px; text-align: left; display: none;
        }

        @media (max-width: 1000px) {
            th:nth-child(4), td:nth-child(4),
            th:nth-child(6), td:nth-child(6) { display: none; } 
        }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-box">
            <h2>The Lab Console</h2>
            <p style="font-size: 0.8rem; color: #888; margin-bottom: 25px; text-transform: uppercase; letter-spacing: 1px;">Authorization Required</p>
            <input type="password" id="adminPass" placeholder="Access Code" style="margin-bottom:15px; width:100%; padding:15px; border:1px solid #ddd; font-family: 'Roboto Mono';">
            <button onclick="checkPass()" class="btn-launch" style="width:100%;">Initialize Session</button>
            <div id="debug-log"></div>
        </div>
    </div>

    <div class="admin-container hidden" id="dashboard">
        <div class="admin-header">
            <div>
                <h1 style="font-family:'Playfair Display', serif; font-size: 2.5rem; margin-bottom: 5px;">Order Database</h1>
                <p style="font-family:'Roboto Mono'; font-size: 0.7rem; color: var(--tcl-primary); text-transform: uppercase; letter-spacing: 2px;">● System Live // Project Logs</p>
            </div>
            <div style="display: flex; gap: 10px;">
                <button onclick="location.reload()" class="btn-minimal" style="background: #eee; color: #333; padding: 10px 20px;">Sync Data</button>
                <a href="index.html" class="btn-minimal" style="background: transparent; border: 1px solid #ddd; color: #888; padding: 10px 20px;">Exit</a>
            </div>
        </div>
        
        <div class="table-wrapper" style="overflow-x:auto;">
            <table id="orderTable">
                <thead>
                    <tr>
                        <th>Timestamp</th>
                        <th>Project ID</th>
                        <th>Customer</th>
                        <th>Email Path</th>
                        <th>Product Tag</th>
                        <th>Engineering Specs</th>
                        <th>Handle Style</th>
                        <th>Asset</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    </tbody>
            </table>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxA0tHDzsc4baNHSURGJRMFVvRpXLZMAL0Hhkezq5xC641ehY5asGkTD1X4k6uauBJF9A/exec"; 

        async function checkPass() {
            const input = document.getElementById('adminPass').value;
            const btn = document.querySelector('.btn-launch');
            const debugLog = document.getElementById('debug-log');
            
            btn.innerText = "Authenticating...";
            btn.disabled = true;

            try {
                const response = await fetch(SCRIPT_URL + "?password=" + encodeURIComponent(input));
                if (!response.ok) throw new Error(`Server Error: ${response.status}`);

                const data = await response.json();
                if (data.error === "ACCESS_DENIED") throw new Error("Unauthorized Access Code.");

                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('dashboard').classList.remove('hidden');
                renderTable(data);

            } catch (error) {
                debugLog.style.display = 'block';
                debugLog.innerHTML = `<strong>CRITICAL_ERROR:</strong><br>${error.message}`;
                btn.innerText = "Initialize Session";
                btn.disabled = false;
            }
        }

        function renderTable(data) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = ''; 

            if (data.length === 0) {
                 tbody.innerHTML = '<tr><td colspan="8" style="text-align:center; padding:40px;">Zero active projects found.</td></tr>';
                 return;
            }

            data.reverse().forEach(row => {
                let dateStr = row[0];
                try {
                    const dateObj = new Date(row[0]);
                    dateStr = dateObj.toLocaleDateString() + " " + dateObj.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                } catch(e) {}
                
                const link = row[7] && row[7] !== "No File" ? `<a href="${row[7]}" target="_blank" style="color:var(--tcl-primary); font-weight:bold; text-decoration:none;">[OPEN]</a>` : "---";
                
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="white-space:nowrap; color: #888;">${dateStr}</td>
                    <td><strong>${row[1]}</strong></td>
                    <td style="font-weight: 700;">${row[2]}</td>
                    <td style="color: #666;">${row[3]}</td>
                    <td><span class="status-pill" style="background: #eef2f3;">${row[4]}</span></td>
                    <td style="font-size:0.7rem; color:#666; max-width: 250px;">${row[5]}</td>
                    <td>${row[6]}</td>
                    <td>${link}</td>
                `;
                tbody.appendChild(tr);
            });
        }
        
        document.getElementById('adminPass').addEventListener("keypress", (e) => {
            if (e.key === "Enter") checkPass();
        });
    </script>
</body>
</html>
