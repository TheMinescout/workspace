<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account | The Chop Lab</title>
    <link rel="stylesheet" href="assets/css/index.css">
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="assets/images/Favicon.png">
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#D26244">

    <style>
        /* Table and Portal Specific Styling */
        .status-pill {
            display: inline-block;
            padding: 4px 12px;
            background: #eee;
            color: #333;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
            border-radius: 2px;
        }
        th {
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 700;
            color: #888;
            border-bottom: 1px solid var(--tcl-border);
        }
        .portal-input {
            margin-bottom: 15px;
            border: 1px solid var(--tcl-border);
            border-radius: 0;
            padding: 14px;
            width: 100%;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="container nav-flex">
            <a href="index.html" class="logo">The Chop Lab<span>.</span></a>
            <div class="menu-toggle">&#9776;</div>
        </div>
    </nav>

    <div class="overlay-menu">
        <a href="index.html">Gallery</a>
        <a href="portfolio.html">Portfolio & Process</a>
        <a href="chops.html">Chop Info</a>
        <a href="order.html">Order Form</a>
        <a href="account.html" class="current">My Account</a>
    </div>

    <div class="container" style="margin-top: 80px; min-height: 70vh; max-width: 900px;">
        
        <div id="auth-container" class="order-form" style="max-width: 450px; margin: 0 auto; padding: 50px; border: 1px solid var(--tcl-border); background: #fff;">
            <h2 style="font-family:'Playfair Display'; font-size: 2rem; margin-bottom: 15px; text-align: center;">Client Portal</h2>
            <p style="color:#666; margin-bottom: 35px; text-align: center; font-size: 0.95rem;">Login to view project status and final engineering drafts.</p>
            
            <input type="email" id="loginEmail" class="portal-input" placeholder="Email Address">
            <input type="password" id="loginPass" class="portal-input" placeholder="Password">
            
            <button onclick="handleLogin()" class="btn-launch" style="width: 100%; margin-top: 10px;">Log In</button>
            <button onclick="handleSignup()" class="btn-minimal" style="margin-top: 25px; width: 100%; font-size: 0.75rem; background: transparent; color: #888; border: 1px solid #eee;">Create New Account</button>
            
            <p id="authMsg" style="color: var(--tcl-primary); margin-top: 20px; font-size: 0.85rem; text-align: center;"></p>
        </div>

        <div id="dashboard-container" class="hidden">
            <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom: 50px; border-bottom: 1px solid var(--tcl-border); padding-bottom: 20px;">
                <h1 style="font-family:'Playfair Display'; font-size: 2.5rem;">Project History</h1>
                <button onclick="handleLogout()" class="btn-minimal" style="font-size:0.7rem; background: #eee; color: #333; padding: 8px 16px;">Sign Out</button>
            </div>

            <p id="user-email-display" style="color:#888; margin-bottom: 30px; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px;">Retrieving lab records...</p>

            <div style="overflow-x:auto; background: #fff; border: 1px solid var(--tcl-border);">
                <table style="width:100%; border-collapse:collapse;">
                    <thead>
                        <tr>
                            <th style="padding:20px; text-align:left; font-size: 0.7rem;">Date</th>
                            <th style="padding:20px; text-align:left; font-size: 0.7rem;">ID</th>
                            <th style="padding:20px; text-align:left; font-size: 0.7rem;">Project</th>
                            <th style="padding:20px; text-align:left; font-size: 0.7rem;">Status</th>
                            <th style="padding:20px; text-align:left; font-size: 0.7rem;">Engineering Draft</th>
                        </tr>
                    </thead>
                    <tbody id="historyTableBody">
                        </tbody>
                </table>
            </div>
        </div>

    </div>

    <footer>
        <p>&copy; <span id="footer-year"></span> The Chop Lab</p>
    </footer>

    <script src="assets/js/nav.js"></script>
    <script src="assets/js/firebase-config.js"></script>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxA0tHDzsc4baNHSURGJRMFVvRpXLZMAL0Hhkezq5xC641ehY5asGkTD1X4k6uauBJF9A/exec";
        document.getElementById('footer-year').textContent = new Date().getFullYear();

        if(typeof auth !== 'undefined') {
            auth.onAuthStateChanged((user) => {
                if (user) {
                    document.getElementById('auth-container').classList.add('hidden');
                    document.getElementById('dashboard-container').classList.remove('hidden');
                    document.getElementById('user-email-display').innerText = "Logged in: " + user.email;
                    fetchHistory(user.email);
                } else {
                    document.getElementById('auth-container').classList.remove('hidden');
                    document.getElementById('dashboard-container').classList.add('hidden');
                }
            });
        }

        function handleLogin() {
            const email = document.getElementById('loginEmail').value;
            const pass = document.getElementById('loginPass').value;
            auth.signInWithEmailAndPassword(email, pass)
                .catch((error) => { document.getElementById('authMsg').innerText = error.message; });
        }

        function handleSignup() {
            const email = document.getElementById('loginEmail').value;
            const pass = document.getElementById('loginPass').value;
            auth.createUserWithEmailAndPassword(email, pass)
                .then(() => { alert("Account created! Accessing lab records..."); })
                .catch((error) => { document.getElementById('authMsg').innerText = error.message; });
        }

        function handleLogout() { auth.signOut(); }

        async function fetchHistory(email) {
            const tbody = document.getElementById('historyTableBody');
            tbody.innerHTML = '<tr><td colspan="5" style="padding:40px; text-align:center; color: #888;">Scanning database...</td></tr>';

            try {
                const response = await fetch(SCRIPT_URL + "?email=" + encodeURIComponent(email));
                const data = await response.json();
                tbody.innerHTML = '';

                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="padding:40px; text-align:center; color: #888;">No project history found for this email address.</td></tr>';
                    return;
                }

                data.reverse().forEach(row => {
                    const date = new Date(row[0]).toLocaleDateString();
                    let renderLink = `<span style="color:#ccc;">TBD</span>`;
                    
                    if (row[8] && row[8].startsWith('http')) {
                        renderLink = `<a href="${row[8]}" target="_blank" style="color: var(--tcl-primary); font-weight:700; text-decoration:none; font-size: 0.8rem;">VIEW RENDER &rarr;</a>`;
                    }

                    const status = row[9] || "Received";
                    const tr = document.createElement('tr');
                    tr.style.borderBottom = "1px solid #f5f5f5";
                    tr.innerHTML = `
                        <td style="padding:20px;">${date}</td>
                        <td style="padding:20px; font-family: monospace; color: #888;">${row[1]}</td>
                        <td style="padding:20px; font-weight:700;">${row[4]}</td>
                        <td style="padding:20px;"><span class="status-pill">${status}</span></td>
                        <td style="padding:20px;">${renderLink}</td>
                    `;
                    tbody.appendChild(tr);
                });

            } catch (error) {
                tbody.innerHTML = '<tr><td colspan="5" style="padding:40px; text-align:center; color:red;">Connection Error. Please try again.</td></tr>';
            }
        }
    </script>
</body>
</html>
