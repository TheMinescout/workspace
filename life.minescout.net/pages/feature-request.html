<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit a Request - Minescouts Life</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Updated Fonts to match the M3 Design System -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;500;700&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <!-- Fixed Paths: Absolute locations starting with / -->
    <link rel="stylesheet" href="/assests/css/homepage.css">
    <link rel="icon" type="image/png" href="/assests/images/favicon.png?v=2">
    
    <!-- EMAILJS SDK -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

    <!-- Specific Page Styles (Using M3 Variables) -->
    <style>
        #user-display a { text-decoration: none; color: white; }

        .request-header {
            margin-bottom: 24px;
        }

        .request-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2.2rem;
            color: var(--text-color);
            margin-bottom: 8px;
        }

        .request-subtitle {
            color: var(--md-outline);
            font-size: 1.05rem;
            line-height: 1.6;
        }

        .request-card {
            background: var(--card-bg);
            border: 1px solid var(--md-outline-variant);
            border-radius: var(--radius-lg);
            padding: 32px;
            box-shadow: var(--shadow-1);
            transition: all 0.3s var(--motion-standard);
        }

        .request-card:hover {
            box-shadow: var(--shadow-2);
            border-color: var(--md-outline);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            text-align: left;
            margin-bottom: 20px;
            gap: 6px;
        }

        .form-label {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-color);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--md-outline);
            background: var(--md-surface-container);
            color: var(--text-color);
            font-family: 'DM Sans', sans-serif;
            font-size: 1rem;
            outline: none;
            transition: all 0.2s;
            box-sizing: border-box;
        }

        /* Make selects look consistent with inputs */
        select.form-input {
            cursor: pointer;
            appearance: auto;
        }

        .form-input:focus {
            border-color: var(--md-primary);
            background: var(--bg-color);
            box-shadow: 0 0 0 3px rgba(93, 140, 88, 0.2);
        }

        textarea.form-input {
            resize: vertical;
            min-height: 120px;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: var(--md-primary);
            color: var(--md-on-primary);
            border: none;
            border-radius: var(--radius-full);
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 10px;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .submit-btn:hover {
            filter: brightness(0.9);
            transform: translateY(-1px);
            box-shadow: var(--shadow-2);
        }

        .submit-btn:disabled {
            background: var(--md-outline);
            color: var(--md-surface);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        #status-msg {
            margin-top: 20px;
            padding: 12px;
            border-radius: var(--radius-sm);
            text-align: center;
            font-weight: 600;
            display: none;
        }

        .status-success {
            background: var(--md-primary-container);
            color: var(--md-on-primary-container);
            border: 1px solid var(--md-primary);
            display: block !important;
        }

        .status-error {
            background: rgba(186, 26, 26, 0.1);
            color: var(--md-error);
            border: 1px solid var(--md-error);
            display: block !important;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <header class="main-header">
        <div class="container site-title-container">
            <div id="auth-container">
                <a href="/login.html" id="login-link">Login</a>
            </div>
            <div class="site-title-wrapper">
                <h1 class="site-title"><a href="/index.html" style="color: white; text-decoration: none;">Minescouts Life</a></h1>
                <p class="tagline">Requests</p>
            </div>
            <div id="user-display" class="hidden">
                <a href="/account.html"><span id="user-email-display"></span></a>
                <button id="signOut-btn" class="btn-glass">Sign Out</button>
            </div>
        </div>
    </header>

    <div class="main-content-area">
        <div class="container">
            
            <main class="main-content">
                <div class="request-header">
                    <h1 class="request-title">Submit a Request</h1>
                    <p class="request-subtitle">Found a bug? Want to see a specific tech tip? Have an idea for a new app? Let us know below! Our team reviews these requests regularly.</p>
                </div>

                <div class="request-card">
                    <form id="featureRequestForm">
                        
                        <!-- 1. Request Type -->
                        <div class="form-group">
                            <label for="requestType" class="form-label">Request Type:</label>
                            <select id="requestType" name="requestType" class="form-input" onchange="updateFormFields()">
                                <option value="Feature">✨ Feature Request</option>
                                <option value="Content">📝 New Content Idea</option>
                                <option value="Bug">🐛 Bug / Broken Stuff</option>
                                <option value="Other">❓ Other</option>
                            </select>
                        </div>

                        <!-- 2. Priority (Always Visible) -->
                        <div class="form-group">
                            <label for="priority" class="form-label">Priority Level:</label>
                            <select id="priority" name="priority" class="form-input">
                                <option value="LOW">Low - Nice to have</option>
                                <option value="MED">Medium - Important</option>
                                <option value="HIGH">High - Urgent / Site Broken</option>
                            </select>
                        </div>

                        <!-- 3. Dynamic Subject Line -->
                        <div class="form-group">
                            <label for="subject" id="lbl-subject" class="form-label">Feature Title:</label>
                            <input type="text" id="subject" name="subject" class="form-input" required placeholder="e.g. Dark Mode Toggle">
                        </div>

                        <!-- 4. Dynamic Extra Fields (Bug URL or Content Category) -->
                        <div id="extra-field-bug" class="form-group hidden">
                            <label for="bugUrl" class="form-label">Page URL / Device:</label>
                            <input type="text" id="bugUrl" class="form-input" placeholder="e.g. Homepage on iPhone Safari">
                        </div>

                        <div id="extra-field-content" class="form-group hidden">
                            <label for="contentCategory" class="form-label">Target Category:</label>
                            <select id="contentCategory" class="form-input">
                                <option value="Tech Tips">Tech Tips</option>
                                <option value="Coding">Coding Projects</option>
                                <option value="Puppy">Puppy Life</option>
                                <option value="General">General/Other</option>
                            </select>
                        </div>

                        <!-- 5. Name -->
                        <div class="form-group">
                            <label for="name" class="form-label">Your Name (Optional):</label>
                            <input type="text" id="name" name="name" class="form-input" placeholder="Guest">
                        </div>

                        <!-- 6. Description -->
                        <div class="form-group">
                            <label for="comment" id="lbl-desc" class="form-label">Description:</label>
                            <textarea id="comment" name="comment" class="form-input" required placeholder="Describe the feature in detail..."></textarea>
                        </div>
                        
                        <button type="submit" class="submit-btn">
                            <span class="material-symbols-rounded">send</span>
                            Submit Request
                        </button>
                    </form>
                    
                    <div id="status-msg"></div>
                </div>
            </main>

            <aside id="sidebar">
                <div id="sidebar-container"></div> 
            </aside>
            
        </div>
    </div>

    <footer class="main-footer">
        <div class="container text-center"><p id="copyright">© 2026 Minescouts Life. All rights reserved.</p></div>
    </footer>

    <!-- FIREBASE & EMAIL LOGIC -->
    <script type="module">
        import { db, auth } from "/assests/js/firebase-config.js";
        import { ref, push, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        // --- EMAILJS CONFIGURATION ---
        const EMAIL_SERVICE_ID = "service_khgjq1e";   
        const EMAIL_TEMPLATE_ID = "template_yb9xkyy"; 
        const EMAIL_PUBLIC_KEY = "Fa69EL7WS0e4EWsl-";   

        (function(){ emailjs.init(EMAIL_PUBLIC_KEY); })();

        const form = document.getElementById('featureRequestForm');
        const statusMsg = document.getElementById('status-msg');
        const nameInput = document.getElementById('name');

        // Auto-fill name if logged in
        onAuthStateChanged(auth, user => {
            if(user) {
                const displayName = user.displayName || (user.email ? user.email.split('@')[0] : "User");
                nameInput.value = displayName;
                nameInput.readOnly = true;
                // Add M3 disabled/readonly styling
                nameInput.style.backgroundColor = "var(--md-surface-container)";
                nameInput.style.color = "var(--md-outline)";
                nameInput.style.cursor = "not-allowed";
            }
        });

        // --- DYNAMIC FORM LOGIC ---
        // Attached to window so the HTML 'onchange' works
        window.updateFormFields = function() {
            const type = document.getElementById('requestType').value;
            const lblSubject = document.getElementById('lbl-subject');
            const subjectInput = document.getElementById('subject');
            const lblDesc = document.getElementById('lbl-desc');
            const descInput = document.getElementById('comment');
            
            // Toggle Extra Fields
            document.getElementById('extra-field-bug').classList.add('hidden');
            document.getElementById('extra-field-content').classList.add('hidden');

            if (type === 'Feature') {
                lblSubject.textContent = "Feature Title:";
                subjectInput.placeholder = "e.g. Dark Mode Toggle";
                lblDesc.textContent = "Description:";
                descInput.placeholder = "Describe how this feature should work...";
            } 
            else if (type === 'Content') {
                lblSubject.textContent = "Topic Idea:";
                subjectInput.placeholder = "e.g. How to Build a PC";
                lblDesc.textContent = "Content Details:";
                descInput.placeholder = "What specific points should this article/video cover?";
                document.getElementById('extra-field-content').classList.remove('hidden');
            } 
            else if (type === 'Bug') {
                lblSubject.textContent = "Issue Summary:";
                subjectInput.placeholder = "e.g. Images not loading on homepage";
                lblDesc.textContent = "Steps to Reproduce:";
                descInput.placeholder = "1. Go to homepage\n2. Click login\n3. Error appears...";
                document.getElementById('extra-field-bug').classList.remove('hidden');
            } 
            else {
                lblSubject.textContent = "Subject:";
                subjectInput.placeholder = "Summary of request";
                lblDesc.textContent = "Details:";
                descInput.placeholder = "Explain your request...";
            }
        };

        // --- SUBMIT LOGIC ---
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = form.querySelector('button');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="material-symbols-rounded" style="animation: spin 1s linear infinite;">sync</span> Transmitting...';

            const requestType = document.getElementById('requestType').value;
            const priority = document.getElementById('priority').value;
            const subject = document.getElementById('subject').value;
            const name = document.getElementById('name').value || "Anonymous";
            let desc = document.getElementById('comment').value;

            // Combine Extra Fields into Description for Admin Panel Visibility
            if (requestType === 'Bug') {
                const bugUrl = document.getElementById('bugUrl').value;
                if(bugUrl) desc = `[URL/DEVICE]: ${bugUrl}\n\n${desc}`;
            } 
            else if (requestType === 'Content') {
                const category = document.getElementById('contentCategory').value;
                desc = `[CATEGORY]: ${category}\n\n${desc}`;
            }

            const taggedSubject = `[${requestType.toUpperCase()}] ${subject}`;

            try {
                // 1. Save to Firebase
                await push(ref(db, 'feature_requests'), {
                    type: requestType,
                    sender: name,
                    subject: taggedSubject,
                    description: desc,
                    priority: priority,
                    timestamp: serverTimestamp(),
                    status: 'new'
                });

                // 2. Send Email
                const templateParams = {
                    from_name: name,
                    subject: taggedSubject,
                    priority: `${priority} (${requestType})`,
                    message: desc
                };

                emailjs.send(EMAIL_SERVICE_ID, EMAIL_TEMPLATE_ID, templateParams)
                    .then(() => console.log('Email sent successfully!'))
                    .catch((err) => console.error('Email failed:', err));

                // 3. Success UI
                statusMsg.textContent = "Request received successfully.";
                statusMsg.className = "status-success";
                form.reset();
                updateFormFields(); // Reset UI state

                setTimeout(() => {
                    window.location.href = "/index.html";
                }, 2000);

            } catch (error) {
                console.error("Database Error:", error);
                statusMsg.textContent = "Error submitting request. Please try again.";
                statusMsg.className = "status-error";
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span class="material-symbols-rounded">send</span> Submit Request';
            }
        });
        
        // Initialize default view
        updateFormFields();
    </script>

    <!-- MODULAR SCRIPTS -->
    <script type="module" src="/assests/js/auth.js"></script>
    <script src="/assests/js/loader.js"></script>
</body>
</html>
