<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beta - Minescouts Life</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Updated Fonts to match the M3 Design System -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;500;700&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <!-- Fixed Paths: Absolute locations starting with / -->
    <link rel="stylesheet" href="/assests/css/homepage.css">
    <link rel="stylesheet" href="/assests/css/features.css">
    <link rel="stylesheet" href="/assests/css/AI-ASSISTANT.css">
    <link rel="icon" type="image/png" href="/assests/images/favicon.png?v=2">
    
    <style>
        #user-display a { text-decoration: none; color: white; }

        /* --- THE CRAWL EFFECT --- */
        #matrix-overlay {
            position: fixed; left: 0; width: 100vw; z-index: 9999;
            background-color: black; overflow: hidden;
            top: 50%; transform: translateY(-50%);
            height: 0.5vh; 
            border-top: 2px solid #0F0; border-bottom: 2px solid #0F0;
            box-shadow: 0 0 20px #0F0;
            transition: height 4s ease-in-out;
            display: none;
        }
        #matrix-overlay.seeping { height: 100vh; }
        canvas {
            display: block; height: 100vh; width: 100%;
            position: absolute; top: 50%; transform: translateY(-50%);
        }

        /* BUTTON STYLE */
        .beta-portal-btn {
            background: #000; color: #0F0; border: 1px solid #0F0;
            padding: 10px 20px; font-family: 'Courier New', monospace;
            font-weight: bold; cursor: pointer; margin-right: 15px;
            text-transform: uppercase; box-shadow: 0 0 5px #0F0; transition: 0.3s;
            border-radius: var(--radius-sm);
        }
        .beta-portal-btn:hover { background: #0F0; color: #000; box-shadow: 0 0 15px #0F0; transform: translateY(-2px); }
        
        .controls-wrapper {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;
        }
    </style>
</head>

<body>
    <!-- THE MATRIX OVERLAY -->
    <div id="matrix-overlay">
        <canvas id="transitionCanvas"></canvas>
    </div>

    <!-- HEADER -->
    <header class="main-header">
        <div class="container site-title-container">
            <div id="auth-container">
                <a href="/login.html" id="login-link">Login</a>
            </div>
            <div class="site-title-wrapper">
                <h1 class="site-title"><a href="/index.html" style="color: white; text-decoration: none;">Minescouts Life</a></h1>
                <p class="tagline">Beta Testing</p>
            </div>
            <div id="user-display" class="hidden">
                <a href="/account.html"><span id="user-email-display"></span></a>
                <button id="signOut-btn" class="btn-glass">Sign Out</button>
            </div>
        </div>
    </header>
    
    <div class="main-content-area">
        <div class="container">
            <main class="main-content">
                
                <!-- Controls -->
                <div class="controls-wrapper">
                    <button class="beta-portal-btn" onclick="enterTheMatrix()">[ ENTER TERMINAL ]</button>
                    
                    <!-- Grid Controls (Using proper M3 Material Icons) -->
                    <div class="view-controls">
                        <button id="grid-3" class="view-btn active" data-view="3" title="Grid View"><span class="material-symbols-rounded">grid_view</span></button>
                        <button id="grid-2" class="view-btn" data-view="2" title="Split View"><span class="material-symbols-rounded">view_day</span></button>
                        <button id="grid-1" class="view-btn" data-view="1" title="List View"><span class="material-symbols-rounded">view_agenda</span></button>
                    </div>
                </div>

                <div id="posts-container" class="posts-grid view-3">
                    <p class="text-center" id="loading-message" style="margin-top: 50px; color: var(--md-outline);">Loading Beta Content...</p>
                </div>
            </main>

            <!-- MODULAR SIDEBAR -->
            <aside id="sidebar">
                <div id="sidebar-container"></div> 
            </aside>
        </div>
    </div>
    
    <footer class="main-footer">
        <div class="container text-center">
            <p>Email: <a href="mailto:theminescout@minescout.net" style="color: var(--md-primary); font-weight: 600;">theminescout@minescout.net</a></p>
            <p id="copyright" style="margin-top: 8px;">© 2026 Minescouts Life. All rights reserved.</p>
        </div>
    </footer>

    <!-- MATRIX TRANSITION LOGIC (Kept Inline as it is unique to this page) -->
    <script>
        function enterTheMatrix() {
            const overlay = document.getElementById('matrix-overlay');
            const canvas = document.getElementById('transitionCanvas');
            const ctx = canvas.getContext('2d');

            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            const katakana = 'アァカサタナハマヤャラワガザダバパイィキシチニヒミリヂビピウゥクスツヌフムユュルグズブヅプエェケセテネヘメレゲゼデベペオォコソトノホモヨョロヲゴゾドボポヴッン';
            const latin = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            const chars = katakana + latin;
            
            const fontSize = 14;
            const columns = canvas.width / fontSize;
            const drops = [];
            
            for(let i = 0; i < columns; i++) {
                drops[i] = Math.floor(Math.random() * canvas.height/fontSize); 
            }

            function draw() {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#0F0';
                ctx.font = fontSize + 'px monospace';

                for(let i = 0; i < drops.length; i++) {
                    const text = chars.charAt(Math.floor(Math.random() * chars.length));
                    ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                    if(drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                        drops[i] = 0;
                    }
                    drops[i]++;
                }
                requestAnimationFrame(draw);
            }
            draw();

            overlay.style.display = 'block';
            setTimeout(() => { overlay.classList.add('seeping'); }, 10);
            setTimeout(() => { window.location.href = "https://beta.minescout.net"; }, 4000);
        }
    </script>

    <!-- CONTENT LOADING LOGIC -->
    <script type="module">
        // Import connection from your config file
        import { db } from "/assests/js/firebase-config.js";
        import { ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

        // Logic to fetch posts specifically for the BETA category
        const categoryTitle = "BETA"; 
        const contentRef = ref(db, 'content');
        const postsContainer = document.getElementById('posts-container');
        const loadingMessage = document.getElementById('loading-message');

        onValue(contentRef, (snapshot) => {
            const contentData = snapshot.val();
            let postHtml = '';
            if (loadingMessage) loadingMessage.style.display = 'none';

            if (contentData) {
                const allContent = Object.keys(contentData).map(key => ({ id: key, ...contentData[key] }));

                const filteredPosts = allContent
                    .filter(item => item.type !== 'announcement' && item.category === categoryTitle)
                    .sort((a, b) => b.timestamp - a.timestamp);

                if (filteredPosts.length > 0) {
                    filteredPosts.forEach(post => postHtml += createPostElement(post.id, post));
                } else {
                    postHtml = `<p class="text-center" style="grid-column: 1 / -1; color: var(--md-outline); margin-top: 40px;">No posts found in the "${categoryTitle}" category yet.</p>`;
                }
            } else {
                postHtml = `<p class="text-center" style="grid-column: 1 / -1; color: var(--md-outline); margin-top: 40px;">No content found.</p>`;
            }
            if (postsContainer) postsContainer.innerHTML = postHtml;
        }, (error) => {
            console.error("Firebase Read Error:", error);
            if (loadingMessage) loadingMessage.textContent = 'Error loading posts.';
        });

        // --- M3 UPDATED CARD GENERATOR ---
        function createPostElement(postId, post) {
            const date = new Date(post.timestamp).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
            
            const imgHtml = post.imageUrl 
                ? `<div class="post-image-wrapper"><img src="${post.imageUrl}" alt="${post.title}" loading="lazy" onerror="this.onerror=null; this.src='https://placehold.co/400x300/e0e0e0/333333?text=Image+Unavailable';" /></div>` 
                : `<div class="post-image-wrapper" style="background: var(--md-surface-container); display:flex; align-items:center; justify-content:center; color: var(--md-outline);"><span class="material-symbols-rounded" style="font-size:48px;">article</span></div>`;

            return `
                <article class="post-card" data-post-id="${postId}">
                    ${imgHtml}
                    <div class="post-card-content">
                        <span class="category-pill">${post.category || 'BETA'}</span>
                        <h3 class="post-title"><a href="${post.linkUrl || '#'}">${post.title || 'Untitled Post'}</a></h3>
                        <div class="post-meta">${date}</div>
                        <p class="post-excerpt">${post.summary || 'No summary provided.'}</p>
                        
                        <div style="margin-top:auto;">
                           <a href="${post.linkUrl || '#'}" class="read-more" target="_blank" style="width:100%;">
                                ${post.linkText || 'Read More'}
                           </a>
                        </div>
                    </div>
                </article>
            `;
        }
    </script>

    <!-- STANDARD MODULAR SCRIPTS -->
    <script type="module" src="/assests/js/auth.js"></script>
    <script src="/assests/js/loader.js"></script>
    <script type="module" src="/assests/js/homepage.js"></script>

</body>
</html>
