<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- The title is updated automatically by JS, but set a default -->
    <title>Minescouts Life</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Updated Fonts to match the M3 Design System -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;500;700&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <!-- Fixed Paths: Absolute locations starting with / -->
    <link rel="stylesheet" href="/assests/css/homepage.css">
    <link rel="stylesheet" href="/assests/css/features.css">
    <link rel="icon" type="image/png" href="/assests/images/favicon.png?v=2">
    
    <style>
        /* Ensure username link looks good */
        #user-display a { text-decoration: none; color: white; }
    </style>
</head>

<body>

    <header class="main-header">
        <div class="container site-title-container">
            <div id="auth-container">
                <a href="/login.html" id="login-link">Login</a>
            </div>
            <div class="site-title-wrapper">
                <h1 class="site-title"><a href="/index.html" style="color: white; text-decoration: none;">Minescouts Life</a></h1>
                <!-- Tagline is updated via JS below -->
                <p class="tagline" id="dynamic-tagline">Loading...</p>
            </div>
            <div id="user-display" class="hidden">
                <a href="/account.html"><span id="user-email-display"></span></a>
                <button id="signOut-btn" class="btn-glass">Sign Out</button>
            </div>
        </div>
    </header>

    <div class="main-content-area">
        <div class="container">
            <main class="main-content">

                <!-- Grid Controls (Using proper M3 Material Icons) -->
                <div class="view-controls">
                    <button id="grid-3" class="view-btn active" data-view="3" title="Grid View"><span class="material-symbols-rounded">grid_view</span></button>
                    <button id="grid-2" class="view-btn" data-view="2" title="Split View"><span class="material-symbols-rounded">view_day</span></button>
                    <button id="grid-1" class="view-btn" data-view="1" title="List View"><span class="material-symbols-rounded">view_agenda</span></button>
                </div>

                <div id="posts-container" class="posts-grid view-3">
                    <p class="text-center" id="loading-message" style="margin-top: 50px; color: var(--md-outline);">Loading posts...</p>
                </div>
            </main>

            <!-- Modular Sidebar -->
            <aside id="sidebar">
                <div id="sidebar-container"></div> 
            </aside>

        </div>
    </div>

    <footer class="main-footer">
        <div class="container text-center">
            <p>Email: <a href="mailto:theminescout@minescout.net" style="color: var(--md-primary); font-weight: 600;">theminescout@minescout.net</a></p>
            <p id="copyright" style="margin-top: 8px;">© 2026 Minescouts Life. All rights reserved.</p>
        </div>
    </footer>

    <!-- CONTENT LOADING LOGIC -->
    <script type="module">
        // Import connection from your centralized config
        import { db } from "/assests/js/firebase-config.js";
        import { ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

        // --- AUTOMATIC CATEGORY DETECTION ---
        // 1. Get filename (e.g., "tech-tips.html")
        const filename = window.location.pathname.split('/').pop().replace('.html', '');
        
        // 2. Convert to Title Case (e.g., "Tech Tips")
        let categoryTitle = filename.replace(/-/g, ' ').replace(/\b\w/g, l => l.toUpperCase());

        // 3. Handle special edge cases if filename doesn't match Category name exactly
        if (categoryTitle === "Beta") categoryTitle = "BETA"; 

        // 4. Update Page Title and Tagline
        document.title = `${categoryTitle} - Minescouts Life`;
        const taglineEl = document.getElementById('dynamic-tagline');
        if(taglineEl) taglineEl.textContent = categoryTitle;

        // --- FETCH CONTENT ---
        fetchAndDisplayCategoryPosts(categoryTitle);

        function fetchAndDisplayCategoryPosts(category) {
            const contentRef = ref(db, 'content');
            const postsContainer = document.getElementById('posts-container');
            const loadingMessage = document.getElementById('loading-message');

            onValue(contentRef, (snapshot) => {
                const contentData = snapshot.val();
                let postHtml = '';
                if (loadingMessage) loadingMessage.style.display = 'none';

                if (contentData) {
                    const allContent = Object.keys(contentData).map(key => ({ id: key, ...contentData[key] }));

                    // Filter by the detected category
                    const filteredPosts = allContent
                        .filter(item => item.type !== 'announcement' && item.category === category)
                        .sort((a, b) => b.timestamp - a.timestamp);

                    if (filteredPosts.length > 0) {
                        filteredPosts.forEach(post => postHtml += createPostElement(post.id, post));
                    } else {
                        postHtml = `<p class="text-center" style="grid-column: 1 / -1; color: var(--md-outline); margin-top: 40px;">No posts found in the "${category}" category yet.</p>`;
                    }
                } else {
                    postHtml = `<p class="text-center" style="grid-column: 1 / -1; color: var(--md-outline); margin-top: 40px;">No content found.</p>`;
                }
                postsContainer.innerHTML = postHtml;
            }, (error) => {
                console.error("Firebase Read Error:", error);
                if (loadingMessage) loadingMessage.textContent = 'Error loading posts.';
            });
        }

        // --- M3 UPDATED CARD GENERATOR ---
        function createPostElement(postId, post) {
            const date = new Date(post.timestamp).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
            
            const imgHtml = post.imageUrl 
                ? `<div class="post-image-wrapper"><img src="${post.imageUrl}" alt="${post.title}" loading="lazy" onerror="this.onerror=null; this.src='https://placehold.co/400x300/e0e0e0/333333?text=Image+Unavailable';" /></div>` 
                : `<div class="post-image-wrapper" style="background: var(--md-surface-container); display:flex; align-items:center; justify-content:center; color: var(--md-outline);"><span class="material-symbols-rounded" style="font-size:48px;">article</span></div>`;

            return `
                <article class="post-card" data-post-id="${postId}">
                    ${imgHtml}
                    <div class="post-card-content">
                        <span class="category-pill">${post.category || 'General'}</span>
                        <h3 class="post-title"><a href="${post.linkUrl || '#'}">${post.title || 'Untitled Post'}</a></h3>
                        <div class="post-meta">${date}</div>
                        <p class="post-excerpt">${post.summary || 'No summary provided.'}</p>
                        
                        <div style="margin-top:auto;">
                           <a href="${post.linkUrl || '#'}" class="read-more" target="_blank" style="width:100%;">
                                ${post.linkText || 'Read More'}
                           </a>
                        </div>
                    </div>
                </article>
            `;
        }
    </script>

    <!-- MODULAR SCRIPTS -->
    <!-- 1. Auth (Login/Signout) -->
    <script type="module" src="/assests/js/auth.js"></script>
    
    <!-- 2. Homepage Logic (Grid Controls & UI) -->
    <script type="module" src="/assests/js/homepage.js"></script>
    
    <!-- 3. Sidebar Loader -->
    <script src="/assests/js/loader.js"></script>

</body>
</html>
