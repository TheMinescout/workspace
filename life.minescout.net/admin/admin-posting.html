<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Minescouts Life</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;500;700&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <link rel="stylesheet" href="/assests/css/homepage.css">
    <link rel="icon" type="image/png" href="/assests/images/favicon.png?v=2">

    <style>
        /* Security Shield Styles */
        #security-shield {
            position: fixed;
            inset: 0;
            background: var(--md-sys-color-surface, #121212);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .shield-card {
            background: var(--md-surface-container-high, #1e1e1e);
            padding: 40px;
            border-radius: var(--radius-lg, 12px);
            border: 1px solid var(--md-outline-variant, #333);
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: var(--shadow-3);
        }

        .shield-card h2 {
            font-family: 'Space Grotesk', sans-serif;
            margin-bottom: 24px;
            color: var(--md-primary, #bb86fc);
        }

        .pass-input {
            width: 100%;
            padding: 16px;
            border-radius: var(--radius-sm, 6px);
            border: 1px solid var(--md-outline, #444);
            background: var(--card-bg, #252525);
            color: var(--text-color, #fff);
            margin-bottom: 16px;
            font-size: 1.1rem;
            box-sizing: border-box;
        }

        .verify-btn {
            width: 100%;
            padding: 16px;
            border-radius: var(--radius-full, 50px);
            background: var(--md-primary, #bb86fc);
            color: var(--md-on-primary, #000);
            border: none;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .verify-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .error-msg {
            color: var(--md-error, #cf6679);
            font-size: 0.9rem;
            margin-top: 12px;
            display: none;
        }

        /* Dashboard Styles */
        .dashboard-container { padding: 40px 0; }
        .post-form {
            background: var(--md-surface-container, #1e1e1e);
            padding: 32px;
            border-radius: var(--radius-lg, 12px);
            border: 1px solid var(--md-outline-variant, #333);
        }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%; padding: 12px; border-radius: var(--radius-sm, 6px);
            border: 1px solid var(--md-outline, #444); background: var(--card-bg, #252525);
            color: var(--text-color, #fff); box-sizing: border-box;
        }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="security-shield">
        <div class="shield-card">
            <span class="material-symbols-rounded" style="font-size: 48px; color: var(--md-primary); margin-bottom: 16px;">admin_panel_settings</span>
            <h2>Beta Mainframe Access</h2>
            <input type="password" id="pass-input" class="pass-input" placeholder="Enter System Password">
            <button id="verify-btn" class="verify-btn">Verify Identity</button>
            <p id="error-msg" class="error-msg">Access Denied: Invalid Credentials</p>
        </div>
    </div>

    <header class="main-header">
        <div class="container site-title-container">
            <div class="site-title-wrapper">
                <h1 class="site-title"><a href="/index.html" style="color: white; text-decoration: none;">Minescouts Life</a></h1>
                <p class="tagline">Admin Dashboard</p>
            </div>
            <div id="user-display">
                <a href="/index.html" class="btn-glass">Back to Site</a>
            </div>
        </div>
    </header>

    <div class="main-content-area">
        <div class="container dashboard-container">
            <main class="post-form">
                <h2 style="font-family: 'Space Grotesk', sans-serif; margin-bottom: 24px;">Create New Post / Announcement</h2>
                
                <form id="dashboard-content-form" onsubmit="return false;">
                    <div class="form-group">
                        <label>Content Type</label>
                        <select id="post-type">
                            <option value="post">Standard Blog Post</option>
                            <option value="announcement">Global Announcement Banner</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Title</label>
                        <input type="text" id="post-title" placeholder="Catchy Title...">
                    </div>

                    <div id="blog-only-fields">
                        <div class="form-group">
                            <label>Category</label>
                            <input type="text" id="post-category" placeholder="Tech Tips, Puppy Life, etc.">
                        </div>
                        <div class="form-group">
                            <label>Image URL</label>
                            <input type="text" id="post-image" placeholder="https://...">
                        </div>
                        <div class="form-group">
                            <label>Link Destination (URL)</label>
                            <input type="text" id="post-link" placeholder="/posts/tech/example.html">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Body / Summary</label>
                        <textarea id="post-body" rows="4" placeholder="Brief summary or announcement text..."></textarea>
                    </div>

                    <button id="submit-post-btn" class="verify-btn" style="background: var(--md-primary);">Publish Content</button>
                </form>
            </main>
        </div>
    </div>

    <script type="module">
        // Fixed typo: changed /assests/ to /assests/
        import { db, auth } from "/assests/js/firebase-config.js";
        import { ref, push, set } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

        const GAS_URL = "https://script.google.com/macros/s/AKfycbw9eu8xATir2tcr3SUfXL2QkZ7HHWwewJOCntLXm5iCmv0Hwi4VdPPwQFoi5KSL7Oe1/exec";
        const shield = document.getElementById('security-shield');
        const passInput = document.getElementById('pass-input');
        const verifyBtn = document.getElementById('verify-btn');
        const errorMsg = document.getElementById('error-msg');

        // Check session storage
        if (sessionStorage.getItem('admin_authenticated') === 'true') {
            shield.classList.add('hidden');
        }

        async function verifyAccess() {
            const password = passInput.value.trim();
            if (!password) return;

            verifyBtn.disabled = true;
            verifyBtn.textContent = "Verifying...";
            errorMsg.style.display = 'none';

            try {
                // Fetch handling redirect explicitly for Google Apps Scripts
                const response = await fetch(`${GAS_URL}?pass=${encodeURIComponent(password)}`, {
                    method: 'GET',
                    mode: 'cors'
                });
                const data = await response.json();

                if (data.success || data.status === "success") {
                    sessionStorage.setItem('admin_authenticated', 'true');
                    shield.classList.add('hidden');
                } else {
                    errorMsg.textContent = "Access Denied: Invalid Credentials";
                    errorMsg.style.display = 'block';
                    passInput.value = '';
                }
            } catch (err) {
                console.error("Verification Error:", err);
                errorMsg.textContent = "System Error: Remote verification failed.";
                errorMsg.style.display = 'block';
            } finally {
                verifyBtn.disabled = false;
                verifyBtn.textContent = "Verify Identity";
            }
        }

        verifyBtn.addEventListener('click', verifyAccess);
        passInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') verifyAccess(); });

        // Toggle fields based on type
        document.getElementById('post-type').addEventListener('change', (e) => {
            const blogFields = document.getElementById('blog-only-fields');
            if (e.target.value === 'announcement') {
                blogFields.classList.add('hidden');
            } else {
                blogFields.classList.remove('hidden');
            }
        });

        // Posting Logic
        document.getElementById('submit-post-btn').addEventListener('click', async () => {
            // Double check session auth before running database execution
            if (sessionStorage.getItem('admin_authenticated') !== 'true') {
                alert('Unauthorized activity detected.');
                window.location.reload();
                return;
            }

            const type = document.getElementById('post-type').value;
            const title = document.getElementById('post-title').value.trim();
            const body = document.getElementById('post-body').value.trim();
            
            if (!title || !body) {
                alert("Please fill out both the Title and the Body/Summary text.");
                return;
            }

            const newContentRef = push(ref(db, 'content'));
            
            const data = {
                type: type,
                title: title,
                timestamp: Date.now(),
                from: "System Admin"
            };

            if (type === 'announcement') {
                data.text = body;
            } else {
                data.summary = body;
                data.category = document.getElementById('post-category').value.trim() || "General";
                data.imageUrl = document.getElementById('post-image').value.trim() || "";
                data.linkUrl = document.getElementById('post-link').value.trim() || "#";
                data.linkText = "Read More";
            }

            try {
                await set(newContentRef, data);
                alert('Content Published Successfully!');
                
                // Clear out the form cleanly instead of completely refreshing the window
                document.getElementById('dashboard-content-form').reset();
                document.getElementById('blog-only-fields').classList.remove('hidden');
            } catch (err) {
                alert('Error publishing: ' + err.message);
            }
        });
    </script>
</body>
</html>
