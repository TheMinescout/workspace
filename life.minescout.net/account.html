<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minescouts Life - Account Management</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;500;700&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <!-- Unified Master Stylesheet -->
    <link rel="stylesheet" href="assests/css/homepage.css?v=1.12">
    <link rel="icon" type="image/png" href="assests/images/favicon.png?v=2">

    <!-- Specific Page Styles (Using M3 Variables only) -->
    <style>
        .account-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 65vh;
            padding: 40px 24px;
            gap: 24px;
        }

        .account-card {
            background: var(--card-bg);
            border: 1px solid var(--md-outline-variant);
            border-radius: var(--radius-lg);
            padding: 32px;
            width: 100%;
            max-width: 600px;
            box-shadow: var(--shadow-2);
            transition: all 0.3s var(--motion-standard);
        }

        .account-card:hover {
            box-shadow: var(--shadow-3);
            border-color: var(--md-primary);
        }

        .section-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--md-outline-variant);
            color: var(--text-color);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            text-align: left;
            margin-bottom: 20px;
            gap: 6px;
        }

        .form-label {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-color);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--md-outline);
            background: var(--md-surface-container);
            color: var(--text-color);
            font-family: 'DM Sans', sans-serif;
            font-size: 1rem;
            outline: none;
            transition: all 0.2s;
            box-sizing: border-box;
        }

        .form-input:focus {
            border-color: var(--md-primary);
            background: var(--bg-color);
            box-shadow: 0 0 0 3px rgba(93, 140, 88, 0.2);
        }

        .update-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 20px;
            background: var(--md-primary);
            color: var(--md-on-primary);
            border: none;
            border-radius: var(--radius-full);
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 8px;
        }

        .update-btn:hover {
            filter: brightness(0.9);
            transform: translateY(-1px);
            box-shadow: var(--shadow-1);
        }

        .update-btn:disabled {
            background: var(--md-outline);
            color: var(--md-surface);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        #status-message {
            width: 100%;
            max-width: 600px;
            text-align: center;
            font-weight: 600;
            padding: 16px;
            border-radius: var(--radius-md);
            margin-bottom: 8px;
            box-shadow: var(--shadow-1);
        }

        .status-success {
            background: var(--md-primary-container);
            color: var(--md-on-primary-container);
            border: 1px solid var(--md-primary);
        }

        .status-error {
            background: rgba(186, 26, 26, 0.1);
            color: var(--md-error);
            border: 1px solid var(--md-error);
        }

        .current-info-text {
            color: var(--md-outline);
            margin-bottom: 20px;
            font-size: 0.95rem;
            display: block;
        }

        .current-info-text strong {
            color: var(--text-color);
        }
        
        .hidden { display: none !important; }
        .text-center { text-align: center; }
    </style>
</head>

<body>

    <!-- Standard Header -->
    <header class="main-header">
        <div class="container site-title-container">
            <div id="auth-container">
                <a href="login.html" id="login-link">Login</a>
            </div>
            <div class="site-title-wrapper">
                <h1 class="site-title"><a href="index.html" style="color: white; text-decoration: none;">Minescouts Life</a></h1>
                <p class="tagline">Account Management</p>
            </div>
            <div id="user-display" class="hidden">
                <span id="user-email-display" style="color: white; opacity: 0.9; font-weight: 600;"></span>
                <button id="signOut-btn">Sign Out</button>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <div class="main-content-area">
        <div class="container account-wrapper">
            
            <div id="status-message" class="hidden"></div>
            
            <!-- Logged Out State -->
            <div id="logged-out-message" class="hidden account-card text-center">
                <span class="material-symbols-rounded" style="font-size: 48px; color: var(--md-outline); margin-bottom: 16px;">lock</span>
                <h3 class="section-title" style="border: none; margin-bottom: 8px;">Access Denied</h3>
                <p style="color: var(--md-outline);">Please <a href="login.html" style="color: var(--md-primary); font-weight: 700; text-decoration: underline;">log in</a> to manage your account.</p>
            </div>

            <!-- Account Forms Area -->
            <div id="account-forms" class="hidden" style="width: 100%; display: flex; flex-direction: column; align-items: center; gap: 24px;">
                
                <!-- Change Username -->
                <div class="account-card">
                    <h3 class="section-title">Change Username</h3>
                    <p class="current-info-text">Your current username is: <strong id="current-username">Loading...</strong></p>
                    <form id="username-form">
                        <div class="form-group">
                            <label for="username" class="form-label">New Username</label>
                            <input type="text" id="username" required class="form-input" minlength="3" placeholder="Enter new username">
                        </div>
                        <button type="submit" class="update-btn">Save Username</button>
                    </form>
                </div>

                <!-- Change Email -->
                <div class="account-card">
                    <h3 class="section-title">Change Email</h3>
                    <form id="email-form">
                        <div class="form-group">
                            <label for="new-email" class="form-label">New Email Address</label>
                            <input type="email" id="new-email" required class="form-input" placeholder="new.email@example.com">
                        </div>
                        <button type="submit" class="update-btn">Update Email</button>
                    </form>
                </div>

                <!-- Change Password -->
                <div class="account-card">
                    <h3 class="section-title">Change Password</h3>
                    <form id="password-form">
                        <div class="form-group">
                            <label for="new-password" class="form-label">New Password</label>
                            <input type="password" id="new-password" required class="form-input" minlength="6" placeholder="••••••••">
                        </div>
                        <div class="form-group">
                            <label for="confirm-password" class="form-label">Confirm New Password</label>
                            <input type="password" id="confirm-password" required class="form-input" placeholder="••••••••">
                        </div>
                        <button type="submit" class="update-btn">Update Password</button>
                    </form>
                </div>

            </div>
        </div>
    </div>

    <!-- Standard Footer -->
    <footer class="main-footer">
        <div class="container text-center">
            <p>Email: <a href="mailto:theminescout@minescout.net" style="color: var(--md-primary); font-weight: 600;">theminescout@minescout.net</a></p>
            <p id="copyright" style="margin-top: 8px;">© 2026 Minescouts Life. All rights reserved.</p>
        </div>
    </footer>

    <!-- Updated Modular Script -->
    <script type="module">
        // 1. Import secure config
        import { auth, db } from "./assests/js/firebase-config.js?v=1";
        
        // 2. Import specific functions needed for this page
        import { onAuthStateChanged, signOut, updateEmail, updatePassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { ref, get, set } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

        const ADMIN_EMAIL = 'theminescout@minescout.net';
        const statusMessage = document.getElementById('status-message');

        // Auth Listener
        onAuthStateChanged(auth, user => {
            const authContainer = document.getElementById('auth-container');
            const userDisplay = document.getElementById('user-display');
            const userEmailDisplay = document.getElementById('user-email-display');

            if (user && !user.isAnonymous) {
                // Show user in header
                if(authContainer) authContainer.style.display = 'none';
                if(userDisplay) userDisplay.classList.remove('hidden');
                if(userEmailDisplay) userEmailDisplay.textContent = user.email === ADMIN_EMAIL ? `Admin: ${user.email}` : user.email;

                // Show account forms
                document.getElementById('logged-out-message').classList.add('hidden');
                document.getElementById('account-forms').classList.remove('hidden');

                // Fetch and display current username
                const usernameRef = ref(db, 'usernames/' + user.uid);
                get(usernameRef).then((snapshot) => {
                    if (snapshot.exists()) {
                        document.getElementById('current-username').textContent = snapshot.val();
                    } else {
                        document.getElementById('current-username').textContent = "Not set";
                    }
                });

            } else {
                // Hide user in header
                if(authContainer) authContainer.style.display = 'block';
                if(userDisplay) userDisplay.classList.add('hidden');

                // Hide forms and show login message
                document.getElementById('logged-out-message').classList.remove('hidden');
                document.getElementById('account-forms').classList.add('hidden');
            }
        });

        document.getElementById('signOut-btn').addEventListener('click', () => signOut(auth).then(() => window.location.href = 'index.html'));

        function showStatus(message, isError = false) {
            statusMessage.textContent = message;
            statusMessage.className = isError ? 'status-error' : 'status-success';
            statusMessage.classList.remove('hidden');
            setTimeout(() => statusMessage.classList.add('hidden'), 5000);
        }

        // --- FORM HANDLERS ---
        document.getElementById('username-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const newUsername = document.getElementById('username').value.trim();
            const user = auth.currentUser;
            if (!user) return;

            const usernameRef = ref(db, `usernames/${user.uid}`);
            set(usernameRef, newUsername)
                .then(() => {
                    showStatus("Username updated successfully!");
                    document.getElementById('current-username').textContent = newUsername;
                    e.target.reset();
                })
                .catch(err => showStatus(`Error: ${err.message}`, true));
        });

        document.getElementById('email-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const newEmail = document.getElementById('new-email').value.trim();
            const user = auth.currentUser;
            if (!user) return;

            updateEmail(user, newEmail)
                .then(() => {
                    showStatus("Email updated successfully! Please verify your new email.");
                    e.target.reset();
                })
                .catch(err => {
                    if (err.code === 'auth/requires-recent-login') {
                        showStatus("This is a sensitive action. Please log out and log back in to update your email.", true);
                    } else {
                        showStatus(`Error: ${err.message}`, true);
                    }
                });
        });

        document.getElementById('password-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const user = auth.currentUser;
            if (!user) return;

            if (newPassword !== confirmPassword) {
                return showStatus("Passwords do not match.", true);
            }

            updatePassword(user, newPassword)
                .then(() => {
                    showStatus("Password updated successfully!");
                    e.target.reset();
                })
                .catch(err => {
                    if (err.code === 'auth/requires-recent-login') {
                        showStatus("This is a sensitive action. Please log out and log back in to update your password.", true);
                    } else {
                        showStatus(`Error: ${err.message}`, true);
                    }
                });
        });

    </script>
</body>
</html>
