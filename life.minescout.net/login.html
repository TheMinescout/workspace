<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minescouts Life - Login</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;500;700&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <!-- Unified Master Stylesheet -->
    <link rel="stylesheet" href="assets/css/homepage.css">
    <link rel="icon" type="image/png" href="assets/images/favicon.png?v=2">

    <!-- Specific Page Styles (Using M3 Variables only) -->
    <style>
        .auth-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 65vh;
            padding: 40px 24px;
        }

        .auth-card {
            background: var(--card-bg);
            border: 1px solid var(--md-outline-variant);
            border-radius: var(--radius-lg);
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: var(--shadow-2);
            text-align: center;
            transition: all 0.3s var(--motion-standard);
        }

        .auth-card:hover {
            box-shadow: var(--shadow-3);
            border-color: var(--md-primary);
        }

        .auth-title {
            margin-bottom: 8px;
            color: var(--text-color);
            font-size: 1.8rem;
        }

        .auth-subtitle {
            color: var(--md-outline);
            font-size: 0.9rem;
            margin-bottom: 32px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            text-align: left;
            margin-bottom: 20px;
            gap: 6px;
        }

        .form-label {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-color);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--md-outline);
            background: var(--md-surface-container);
            color: var(--text-color);
            font-family: 'DM Sans', sans-serif;
            font-size: 1rem;
            outline: none;
            transition: all 0.2s;
            box-sizing: border-box;
        }

        .form-input:focus {
            border-color: var(--md-primary);
            background: var(--bg-color);
            box-shadow: 0 0 0 3px rgba(93, 140, 88, 0.2);
        }

        .btn-auth-primary {
            width: 100%;
            padding: 12px;
            background: var(--md-primary);
            color: var(--md-on-primary);
            border: none;
            border-radius: var(--radius-full);
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 10px;
        }

        .btn-auth-primary:hover {
            filter: brightness(0.9);
            transform: translateY(-1px);
            box-shadow: var(--shadow-1);
        }

        .auth-links {
            margin-top: 24px;
            font-size: 0.85rem;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .auth-links a {
            color: var(--md-primary);
            font-weight: 600;
            text-decoration: none;
        }

        .auth-links a:hover {
            text-decoration: underline;
        }

        #auth-error-msg {
            color: var(--md-error);
            font-size: 0.85rem;
            margin-top: 12px;
            font-weight: 600;
            display: none;
            background: rgba(186, 26, 26, 0.1);
            padding: 10px;
            border-radius: var(--radius-sm);
        }
    </style>
</head>

<body>

    <!-- Standard Header -->
    <header class="main-header">
        <div class="container site-title-container">
            <div id="auth-container">
                <!-- Swapped Login for a Home button since we are on the login page -->
                <a href="index.html" id="login-link">
                    <span class="material-symbols-rounded" style="font-size: 16px; vertical-align: middle;">home</span> 
                    Home
                </a>
            </div>
            <div class="site-title-wrapper">
                <h1 class="site-title"><a href="index.html" style="color: white;">Minescouts Life</a></h1>
                <p class="tagline">Life of a Smart Kid</p>
            </div>
            <!-- Hidden by default -->
            <div id="user-display" class="hidden"></div> 
        </div>
    </header>

    <!-- Main Content Area -->
    <div class="main-content-area">
        <div class="container auth-wrapper">
            
            <div class="auth-card">
                <h2 class="auth-title">Welcome Back</h2>
                <p class="auth-subtitle">Sign in to access your dashboard</p>

                <form id="login-form">
                    <div class="form-group">
                        <label for="email" class="form-label">Email Address</label>
                        <input type="email" id="email" class="form-input" placeholder="you@example.com" required>
                    </div>

                    <div class="form-group">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" id="password" class="form-input" placeholder="••••••••" required>
                    </div>

                    <div id="auth-error-msg"></div>

                    <button type="submit" class="btn-auth-primary">Sign In</button>
                </form>

                <div class="auth-links">
                    <a href="forgot-password.html">Forgot your password?</a>
                    <span style="color: var(--md-outline);">Don't have an account? <a href="signup.html">Sign up</a></span>
                </div>
            </div>

        </div>
    </div>

    <!-- Standard Footer -->
    <footer class="main-footer">
        <div class="container text-center">
            <p>Email: <a href="mailto:theminescout@minescout.net" style="color: var(--md-primary); font-weight: 600;">theminescout@minescout.net</a></p>
            <p id="copyright" style="margin-top: 8px;">© 2026 Minescouts Life. All rights reserved.</p>
        </div>
    </footer>

    <!-- Modular Scripts -->
    <script type="module" src="assets/js/firebase-config.js"></script>
    <script type="module" src="assets/js/auth.js"></script>

    <!-- Specific Login Logic -->
    <script type="module">
        import { auth } from "./assets/js/firebase-config.js";
        import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        const loginForm = document.getElementById('login-form');
        const errorMsg = document.getElementById('auth-error-msg');
        const submitBtn = loginForm.querySelector('.btn-auth-primary');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // Reset UI
            errorMsg.style.display = 'none';
            submitBtn.textContent = 'Signing in...';
            submitBtn.disabled = true;

            try {
                await signInWithEmailAndPassword(auth, email, password);
                // On success, redirect to homepage or dashboard
                window.location.href = 'index.html';
            } catch (error) {
                console.error("Login Error:", error);
                errorMsg.textContent = "Invalid email or password. Please try again.";
                errorMsg.style.display = 'block';
                submitBtn.textContent = 'Sign In';
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
