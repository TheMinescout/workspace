<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoMaster Pro</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Swapped from unpkg to jsDelivr (School WiFi Fix) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        
        body { font-family: 'Inter', sans-serif; height: 100vh; overflow: hidden; }
        
        /* Ensure map is actually visible */
        #map { 
            width: 100%; 
            height: 100%; 
            background-color: #cbd5e1; 
            min-height: 400px;
        }

        .leaflet-container { font-family: 'Inter', sans-serif; }
        .leaflet-interactive { transition: fill-opacity 0.15s, stroke-width 0.15s; }
        
        /* Map Labels */
        .leaflet-tooltip.map-label {
            background: transparent; border: none; box-shadow: none;
            font-weight: 900; font-size: 11px; color: #0f172a;
            text-shadow: -1.5px -1.5px 0 #fff, 1.5px -1.5px 0 #fff, -1.5px 1.5px 0 #fff, 1.5px 1.5px 0 #fff;
            padding: 0; margin: 0; pointer-events: none;
        }
        .leaflet-tooltip-top:before, .leaflet-tooltip-bottom:before, 
        .leaflet-tooltip-left:before, .leaflet-tooltip-right:before { display: none !important; }
        
        .hidden { display: none !important; }
        
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1); }
        }
        .animate-pop { animation: popIn 0.2s ease-out forwards; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 10px; }

        /* Slider Styles */
        .toggle-dot { transition: all 0.2s ease-in-out; }
        input:checked ~ .toggle-dot { transform: translateX(100%); }
        input:checked ~ .toggle-bg { background-color: #2563eb; }
    </style>
</head>
<body class="min-h-screen bg-slate-100 p-4 md:p-6 lg:p-8 text-slate-900 relative selection:bg-blue-200">

    <!-- FIXED OVERLAY -->
    <div id="loading-overlay" class="fixed inset-0 z-[9999] bg-slate-900/95 backdrop-blur-md flex flex-col items-center justify-center text-white hidden">
        <div class="relative w-24 h-24 mb-6">
            <div class="absolute inset-0 border-4 border-slate-700 rounded-full"></div>
            <div class="absolute inset-0 border-4 border-blue-500 rounded-full border-t-transparent animate-spin"></div>
            <i class="ph-bold ph-globe absolute inset-0 flex items-center justify-center text-3xl text-blue-400"></i>
        </div>
        <h2 class="text-2xl font-black mb-2">Syncing Locations</h2>
        <p id="loading-msg" class="text-blue-300 font-medium text-sm animate-pulse">Connecting to OpenStreetMap...</p>
        <div class="w-64 h-2 bg-slate-800 rounded-full mt-6 overflow-hidden border border-slate-700">
            <div id="loading-progress" class="h-full bg-blue-500 transition-all duration-300 w-0"></div>
        </div>
    </div>

    <svg width="0" height="0" class="absolute pointer-events-none">
        <defs>
            <pattern id="stripes" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
                <rect width="8" height="8" fill="rgba(239, 68, 68, 0.1)" />
                <line x1="0" y1="0" x2="0" y2="8" stroke="#ef4444" stroke-width="3" />
            </pattern>
        </defs>
    </svg>

    <div class="max-w-[1440px] mx-auto grid lg:grid-cols-12 gap-6 lg:gap-8 h-full">
        
        <!-- SIDEBAR -->
        <div class="lg:col-span-4 xl:col-span-3 flex flex-col gap-6 h-full overflow-y-auto">
            <div class="bg-white rounded-3xl shadow-lg border border-slate-200 overflow-hidden shrink-0">
                <div class="p-6 bg-gradient-to-br from-blue-600 to-blue-800 text-white flex items-center justify-between">
                    <h3 class="text-2xl font-black tracking-tight flex items-center gap-2">
                        <i class="ph-fill ph-globe-hemisphere-west text-3xl text-blue-200"></i>
                        GeoMaster
                    </h3>
                    <span class="text-[10px] bg-white/20 px-2.5 py-1 rounded-full uppercase tracking-widest font-bold backdrop-blur-sm">Pro</span>
                </div>
                
                <div class="p-6 space-y-6">
                    <div class="space-y-3">
                        <label class="text-xs font-bold text-slate-500 uppercase tracking-widest block">Study Sets</label>
                        <div class="flex gap-2 overflow-x-auto pb-1">
                            <button onclick="window.loadPreset('Caribbean')" class="shrink-0 text-[10px] font-bold uppercase bg-slate-100 hover:bg-blue-50 hover:text-blue-600 px-3 py-1.5 rounded-lg border border-slate-200 transition-colors">🏝️ Caribbean</button>
                            <button onclick="window.loadPreset('Central America')" class="shrink-0 text-[10px] font-bold uppercase bg-slate-100 hover:bg-blue-50 hover:text-blue-600 px-3 py-1.5 rounded-lg border border-slate-200 transition-colors">🌎 Central Am.</button>
                            <button onclick="window.loadPreset('South America')" class="shrink-0 text-[10px] font-bold uppercase bg-slate-100 hover:bg-blue-50 hover:text-blue-600 px-3 py-1.5 rounded-lg border border-slate-200 transition-colors">🏔️ South Am.</button>
                        </div>

                        <textarea id="rawInput" class="w-full rounded-2xl border-2 border-slate-200 bg-slate-50 px-4 py-3 text-sm focus:border-blue-500 focus:bg-white focus:ring-0 transition-colors font-medium min-h-[160px] resize-none shadow-inner" placeholder="1 location per line..."></textarea>
                        
                        <div class="grid grid-cols-2 gap-3 pt-2">
                            <button onclick="window.prepareGame('playing')" class="flex flex-col items-center justify-center gap-1 rounded-2xl bg-blue-600 text-white hover:bg-blue-700 active:scale-95 transition-all shadow-md py-3 cursor-pointer">
                                <i class="ph-bold ph-target text-xl"></i>
                                <span class="text-xs font-bold uppercase tracking-wide">Quiz Mode</span>
                            </button>
                            <button onclick="window.prepareGame('learning')" class="flex flex-col items-center justify-center gap-1 rounded-2xl bg-slate-100 text-slate-700 hover:bg-slate-200 active:scale-95 transition-all py-3 border border-slate-200 cursor-pointer">
                                <i class="ph-bold ph-book-open text-xl"></i>
                                <span class="text-xs font-bold uppercase tracking-wide">Learn Mode</span>
                            </button>
                        </div>
                        
                        <button onclick="window.clearSession()" class="w-full mt-2 flex items-center justify-center gap-2 py-2 text-xs font-bold text-slate-400 hover:text-red-500 hover:bg-red-50 rounded-xl transition-colors cursor-pointer">
                            <i class="ph-bold ph-trash"></i> Reset List
                        </button>
                    </div>

                    <hr class="border-slate-100" />

                    <div class="flex items-center justify-between p-4 bg-slate-50 rounded-2xl border border-slate-200">
                        <div class="flex flex-col">
                            <span class="text-sm font-bold text-slate-700">Auto-Advance</span>
                            <span class="text-[10px] text-slate-500 font-medium">Auto-next on correct</span>
                        </div>
                        <label class="flex items-center cursor-pointer">
                            <div class="relative">
                                <input type="checkbox" id="autoNextToggle" class="sr-only" checked onchange="window.toggleAutoNextFunc(this.checked)">
                                <div class="toggle-bg block bg-slate-300 w-12 h-6 rounded-full"></div>
                                <div class="toggle-dot absolute left-1 top-1 bg-white w-4 h-4 rounded-full transition shadow-sm"></div>
                            </div>
                        </label>
                    </div>
                </div>
            </div>
        </div>

        <!-- MAIN AREA -->
        <div class="lg:col-span-8 xl:col-span-9 flex flex-col gap-5 h-full relative">
            
            <!-- PERFORMANCE BAR -->
            <div class="bg-slate-900 text-white px-6 py-4 rounded-3xl shadow-lg border border-slate-800 shrink-0 relative overflow-hidden min-h-[5.5rem] flex items-center justify-center z-[1000]">
                <i class="ph-fill ph-trophy absolute -right-2 -top-6 text-8xl text-white/5 pointer-events-none"></i>

                <div id="perf-overview" class="flex items-center justify-between w-full">
                    <div class="flex items-center gap-5">
                        <div id="accuracy-grade" class="w-14 h-14 bg-slate-800 rounded-xl flex items-center justify-center text-3xl font-black text-slate-500 border-2 border-slate-700 rotate-3 shadow-inner">-</div>
                        <div class="flex flex-col">
                            <span class="text-[10px] text-blue-400 font-bold uppercase tracking-widest mb-0.5">Accuracy</span>
                            <span id="accuracy-score" class="text-3xl font-black text-white leading-none">0%</span>
                        </div>
                    </div>
                    <div class="flex flex-col items-end text-right hidden sm:flex">
                        <span class="text-[10px] text-slate-400 font-bold uppercase mb-0.5">Ready to Start</span>
                        <span id="header-title-display" class="text-lg font-black text-white">Select Region</span>
                    </div>
                </div>

                <div id="perf-gameplay" class="hidden flex items-center justify-between w-full">
                    <div class="flex items-center gap-6">
                        <div class="flex flex-col">
                            <span class="text-[10px] font-bold text-slate-400 uppercase mb-0.5">Progress</span>
                            <span class="text-xl font-black text-white leading-none"><span id="hud-progress">0</span><span class="text-slate-500 text-sm mx-1">/</span><span id="hud-total">0</span></span>
                        </div>
                        <div class="flex flex-col hidden sm:flex">
                            <span class="text-[10px] font-bold text-emerald-400 uppercase mb-0.5">Score</span>
                            <span id="hud-score" class="text-xl font-black text-white leading-none">0%</span>
                        </div>
                    </div>
                    
                    <div class="absolute left-1/2 -translate-x-1/2 flex flex-col items-center w-full max-w-[200px] sm:max-w-[300px]">
                        <span id="hud-verb" class="text-[10px] text-slate-400 font-bold uppercase mb-1">Click on</span>
                        <div class="bg-blue-600 px-4 sm:px-6 py-1.5 rounded-xl shadow-[0_4px_0_#1e3a8a] border border-blue-400 w-full text-center">
                            <span id="hud-target-name" class="text-lg sm:text-xl font-black text-white tracking-tight truncate block w-full">Target</span>
                        </div>
                    </div>
                    
                    <div class="flex flex-col items-end">
                        <span class="text-[10px] font-bold text-slate-400 uppercase mb-0.5">Timer</span>
                        <div class="flex items-center gap-1.5 text-blue-400">
                            <i class="ph-bold ph-timer text-lg"></i>
                            <span id="hud-timer" class="text-xl font-black text-white tabular-nums">00:00</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- MAP CONTAINER -->
            <div class="bg-white rounded-3xl shadow-xl border border-slate-200 flex flex-col flex-1 relative overflow-hidden">
                <div class="flex-1 relative z-0">
                    <div id="map"></div>
                    
                    <!-- Wiki Fact -->
                    <div id="fact-box" class="absolute bottom-4 left-4 z-[1000] bg-white/95 backdrop-blur border border-slate-200 p-4 rounded-2xl shadow-xl max-w-[300px] hidden animate-pop">
                        <h4 class="text-[10px] font-black text-blue-600 uppercase mb-1 border-b pb-1" id="fact-title">Location</h4>
                        <p id="fact-text" class="text-xs text-slate-700 leading-relaxed max-h-24 overflow-y-auto">Summarizing...</p>
                    </div>
                </div>

                <div id="footer-prompt" class="px-6 py-4 bg-white border-t border-slate-100 flex justify-between items-center z-[1000] min-h-[72px]">
                </div>
            </div>
        </div>
    </div>

    <script>
        // Use Global window scope for handlers
        window.PRESETS = {
            "Caribbean": "Antigua and Barbuda\nBahamas\nBarbados\nCuba\nDominica\nDominican Republic\nGrenada\nHaiti\nJamaica\nPuerto Rico\nSaint Kitts and Nevis\nSaint Lucia\nSt. Vincent and Grenadines\nTrinidad and Tobago",
            "Central America": "Belize\nCosta Rica\nEl Salvador\nGuatemala\nHonduras\nMexico\nNicaragua\nPanama",
            "South America": "Argentina\nBolivia\nBrazil\nChile\nColombia\nEcuador\nFrench Guiana\nGuyana\nParaguay\nPeru\nSuriname\nUruguay\nVenezuela"
        };

        let places = [], quizSequence = [], round = 0, attempts = 0, wrongGuessesThisRound = [], missedClicks = [], completedHighlights = {};
        let gameState = "setup", time = 0, hintUsedThisRound = false, isWaitingForNext = false, autoNext = true;
        let mapInstance = null, mapLayers = [], timerInterval = null, lastFramedRound = -1;
        let geoCache = JSON.parse(localStorage.getItem('geomaster-cache-osm-v2')) || {};
        let wikiCache = JSON.parse(localStorage.getItem('geomaster-wiki-v1')) || {};
        let highScores = JSON.parse(localStorage.getItem('geomaster-scores-v1')) || {};
        let audioCtx = null;

        const rawInputEl = document.getElementById('rawInput');
        const loadingOverlay = document.getElementById('loading-overlay');
        const loadingMsgEl = document.getElementById('loading-msg');
        const loadingProgress = document.getElementById('loading-progress');
        const factBox = document.getElementById('fact-box');
        const factTitle = document.getElementById('fact-title');
        const factText = document.getElementById('fact-text');

        window.shuffleArray = (array) => {
            const newArr = [...array];
            for (let i = newArr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArr[i], newArr[j]] = [newArr[j], newArr[i]];
            }
            return newArr;
        };

        window.formatTime = (s) => {
            const mins = Math.floor(s / 60);
            const secs = s % 60;
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        };

        window.loadPreset = (key) => {
            rawInputEl.value = window.PRESETS[key] || "";
            rawInputEl.classList.add('bg-blue-50');
            setTimeout(() => rawInputEl.classList.remove('bg-blue-50'), 300);
        };

        window.toggleAutoNextFunc = (val) => {
            autoNext = val;
            window.updateUI(false);
        };

        window.playSound = (type) => {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            try {
                const osc = audioCtx.createOscillator(), gainNode = audioCtx.createGain();
                osc.connect(gainNode); gainNode.connect(audioCtx.destination);
                const now = audioCtx.currentTime;
                if (type === 'correct') {
                    osc.type = 'sine'; osc.frequency.setValueAtTime(523.25, now); osc.frequency.exponentialRampToValueAtTime(1046.50, now + 0.1);
                    gainNode.gain.setValueAtTime(0.3, now); gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                } else {
                    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, now); osc.frequency.exponentialRampToValueAtTime(100, now + 0.2);
                    gainNode.gain.setValueAtTime(0.2, now); gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                }
                osc.start(now); osc.stop(now + 0.3);
            } catch (e) {}
        };

        window.fetchWikiFact = async (targetName) => {
            if (wikiCache[targetName]) return wikiCache[targetName];
            try {
                const res = await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(targetName)}`);
                const data = await res.json();
                const text = data.extract || "No summary available.";
                wikiCache[targetName] = text;
                localStorage.setItem('geomaster-wiki-v1', JSON.stringify(wikiCache));
                return text;
            } catch (e) { return "Summary restricted."; }
        };

        function addReliableTileLayer() {
            const sources = [
                {
                    // Carto Light - NO LABELS (Preferred study style)
                    url: 'https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png',
                    options: { attribution: '&copy; CARTO', subdomains: 'abcd', maxZoom: 20 }
                },
                {
                    // OpenStreetMap Standard (Unlabeled fallback not easily available, using standard)
                    url: 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
                    options: { attribution: '&copy; OpenStreetMap contributors', maxZoom: 19 }
                },
                {
                    // ArcGIS Gray Base
                    url: 'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}',
                    options: { attribution: '&copy; Esri', maxZoom: 19 }
                }
            ];

            let index = 0;
            const trySource = () => {
                if (index >= sources.length) return;
                const src = sources[index];
                const layer = L.tileLayer(src.url, src.options);
                let failed = false;
                layer.on('tileerror', () => {
                    if (!failed) {
                        failed = true;
                        mapInstance.removeLayer(layer);
                        index++;
                        trySource();
                    }
                });
                layer.addTo(mapInstance);
            };
            trySource();
        }

        function init() {
            if (typeof L === 'undefined') { setTimeout(init, 200); return; }
            if (mapInstance) return;
            if (!rawInputEl.value.trim()) window.loadPreset('Caribbean');

            mapInstance = L.map('map', { 
                center: [15, -70], zoom: 3, minZoom: 2, worldCopyJump: true, zoomControl: false,
                maxBounds: [[-90, -180], [90, 180]]
            });
            
            addReliableTileLayer();
            
            mapInstance.on('click', (e) => { if (gameState === "playing") window.submitGuess(null, e.latlng); });
            window.updateUI();

            // Sizing Failsafes
            setTimeout(() => mapInstance.invalidateSize(), 100);
            setTimeout(() => mapInstance.invalidateSize(), 600);
            new ResizeObserver(() => { if (mapInstance) mapInstance.invalidateSize(); }).observe(document.getElementById('map'));
        }

        window.prepareGame = async (mode) => {
            const rawLines = rawInputEl.value.split("\n").map(s => s.trim()).filter(Boolean);
            if (rawLines.length === 0) return;

            loadingOverlay.classList.remove('hidden');
            gameState = "setup"; factBox.classList.add('hidden');
            time = 0; completedHighlights = {}; wrongGuessesThisRound = []; missedClicks = []; hintUsedThisRound = false; isWaitingForNext = false; lastFramedRound = -1;
            
            const results = [], notFound = [], uniqueLines = [...new Set(rawLines)];

            for (let i = 0; i < uniqueLines.length; i++) {
                const targetName = uniqueLines[i];
                loadingMsgEl.innerText = `Searching: ${targetName}`;
                loadingProgress.style.width = `${(i / uniqueLines.length) * 100}%`;
                
                if (geoCache[targetName] && geoCache[targetName] !== "NOT_FOUND") {
                    results.push(geoCache[targetName]); continue;
                }

                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 6000); 
                    const res = await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&q=${encodeURIComponent(targetName)}&polygon_geojson=1&polygon_threshold=0.01`, { signal: controller.signal });
                    clearTimeout(timeoutId);
                    const data = await res.json();
                    const f = data?.[0];
                    if (f) {
                        const fd = { name: targetName, lat: Number(f.lat), lon: Number(f.lon), bbox: f.boundingbox.map(Number), geojson: f.geojson, isCity: ['city', 'town', 'village', 'point'].includes(f.type || f.addresstype || "") };
                        results.push(fd); geoCache[targetName] = fd;
                    } else { notFound.push(targetName); geoCache[targetName] = "NOT_FOUND"; }
                    localStorage.setItem('geomaster-cache-osm-v2', JSON.stringify(geoCache));
                    if (i < uniqueLines.length - 1) await new Promise(r => setTimeout(r, 1000));
                } catch (e) { notFound.push(targetName); }
            }
            
            loadingOverlay.classList.add('hidden');
            places = results;
            quizSequence = mode === "playing" ? window.shuffleArray([...results]) : [...results];
            round = 0; if (results.length > 0) { gameState = mode; window.startTimer(); }
            window.updateUI();
        };

        window.submitGuess = async (guessedName, mapClickLatLng = null) => {
            if (gameState !== "playing" || isWaitingForNext) return;
            const current = quizSequence[round];
            if (!current) return;

            if (guessedName !== current.name) {
                window.playSound('wrong');
                if (attempts < 2) {
                    attempts++;
                    if (guessedName && !wrongGuessesThisRound.includes(guessedName)) wrongGuessesThisRound.push(guessedName);
                    else if (mapClickLatLng) missedClicks.push(mapClickLatLng);
                    window.updateUI(); 
                } else {
                    if (mapClickLatLng) missedClicks.push(mapClickLatLng);
                    completedHighlights[current.name] = { color: '#ef4444', borderColor: '#b91c1c', attemptsUsed: 4 };
                    isWaitingForNext = true; window.updateUI(); 
                    setTimeout(() => { isWaitingForNext = false; round++; attempts = 0; wrongGuessesThisRound = []; missedClicks = []; window.updateUI(); }, 1500);
                }
            } else {
                window.playSound('correct');
                const finalAttempts = attempts + 1;
                let color, borderColor;
                if (finalAttempts === 1) { color = '#ffffff'; borderColor = '#94a3b8'; }
                else if (finalAttempts === 2) { color = '#fef08a'; borderColor = '#ca8a04'; } 
                else { color = '#f97316'; borderColor = '#c2410c'; }
                completedHighlights[current.name] = { color: '#ffffff', fillColor: color, borderColor: borderColor, attemptsUsed: finalAttempts };
                
                factBox.classList.remove('hidden'); factTitle.innerText = current.name; factText.innerText = "Loading summary...";
                const summary = await window.fetchWikiFact(current.name);
                if (factTitle.innerText === current.name) factText.innerText = summary;

                round++; attempts = 0; wrongGuessesThisRound = []; missedClicks = []; hintUsedThisRound = false; window.updateUI();
            }
        };

        window.useHint = () => {
            if (hintUsedThisRound || gameState !== "playing") return;
            hintUsedThisRound = true; if (attempts < 2) attempts++;
            const current = quizSequence[round];
            if (current && current.bbox) {
                const bounds = L.latLngBounds([current.bbox[0], current.bbox[2]], [current.bbox[1], current.bbox[3]]);
                mapInstance.fitBounds(bounds.pad(2.0), { animate: true, duration: 1.5 });
                lastFramedRound = round;
            }
            window.updateUI();
        };

        window.handleNext = () => {
            attempts = 0; wrongGuessesThisRound = []; missedClicks = [];
            if (round < quizSequence.length - 1) round++;
            else round = quizSequence.length;
            window.updateUI();
        };

        window.startReview = () => {
            const mistakes = places.filter(p => completedHighlights[p.name] && completedHighlights[p.name].attemptsUsed > 1);
            quizSequence = window.shuffleArray([...mistakes]);
            round = 0; attempts = 0; wrongGuessesThisRound = []; missedClicks = []; gameState = "playing"; lastFramedRound = -1;
            mistakes.forEach(m => delete completedHighlights[m.name]);
            window.startTimer(); window.updateUI();
        };

        window.clearSession = () => {
            places = []; quizSequence = []; round = 0; gameState = "setup"; completedHighlights = {};
            wrongGuessesThisRound = []; missedClicks = []; attempts = 0; time = 0; rawInputEl.value = "";
            factBox.classList.add('hidden'); window.stopTimer(); window.updateUI();
        };

        window.startTimer = () => { window.stopTimer(); if (gameState === "playing") timerInterval = setInterval(() => { time++; document.getElementById('hud-timer').innerText = window.formatTime(time); }, 1000); };
        window.stopTimer = () => { if (timerInterval) clearInterval(timerInterval); };

        window.updateUI = (fullRender = true) => {
            const current = quizSequence[round], isFinished = quizSequence.length > 0 && round >= quizSequence.length;
            const completedCount = Object.keys(completedHighlights).length;
            const totalEarnedPoints = Object.values(completedHighlights).reduce((acc, curr) => acc + (curr.attemptsUsed === 1 ? 100 : curr.attemptsUsed === 2 ? 60 : curr.attemptsUsed === 3 ? 30 : 0), 0);
            const avgScore = completedCount > 0 ? Math.round((totalEarnedPoints / (completedCount * 100)) * 100) : 0;

            rawInputEl.disabled = gameState !== "setup";

            if (gameState !== "setup" && !isFinished) {
                document.getElementById('perf-overview').classList.add('hidden'); 
                document.getElementById('perf-gameplay').classList.remove('hidden');
                document.getElementById('hud-progress').innerText = completedCount; 
                document.getElementById('hud-total').innerText = quizSequence.length;
                document.getElementById('hud-score').innerText = `${avgScore}%`;
                if (current) { 
                    document.getElementById('hud-verb').innerText = gameState === "learning" ? "Study" : "Click on"; 
                    document.getElementById('hud-target-name').innerText = current.name; 
                }
            } else {
                document.getElementById('perf-gameplay').classList.add('hidden'); 
                document.getElementById('perf-overview').classList.remove('hidden');
                document.getElementById('accuracy-score').innerText = `${avgScore}%`;
                const gradeEl = document.getElementById('accuracy-grade');
                if(completedCount === 0) gradeEl.innerText = '-';
                else if(avgScore >= 90) gradeEl.innerText = 'S';
                else if(avgScore >= 80) gradeEl.innerText = 'A';
                else if(avgScore >= 70) gradeEl.innerText = 'B';
                else gradeEl.innerText = 'F';
            }

            const btnBase = "inline-flex items-center justify-center rounded-2xl text-sm font-black transition-all active:scale-95 px-6 py-3 shadow-sm ";
            let footerHtml = '';
            if (gameState === "playing" && !isFinished) {
                let dotsHtml = `<div class="flex gap-1.5 mr-4">`;
                for (let i = 0; i < 3; i++) dotsHtml += `<div class="w-3 h-3 rounded-full transition-all ${i < (3 - attempts) ? 'bg-blue-500' : 'bg-slate-200'}"></div>`;
                dotsHtml += `</div>`;
                const hintBtn = `<button onclick="window.useHint()" class="${btnBase} ${hintUsedThisRound ? 'bg-slate-100 text-slate-400 border cursor-not-allowed' : 'bg-amber-100 text-amber-700 border border-amber-300'} ml-auto" ${hintUsedThisRound ? 'disabled' : ''}>Hint</button>`;
                if (isWaitingForNext) footerHtml = `<div class="text-red-600 font-bold uppercase text-xs">Target revealed...</div>`;
                else footerHtml = `<div class="flex items-center justify-between w-full"><div class="flex items-center">${dotsHtml}<div class="text-slate-500 font-bold uppercase text-xs hidden sm:block">Find target</div></div>${hintBtn}</div>`;
            } else if (gameState === "learning" && !isFinished) {
                footerHtml = autoNext ? `<div class="text-slate-400 font-bold uppercase text-xs w-full text-center animate-pulse">Click region to advance</div>` : `<button onclick="window.handleNext()" class="${btnBase} bg-blue-600 text-white mx-auto">Next Target</button>`;
            } else if (isFinished) {
                footerHtml = `<div class="flex gap-3 w-full justify-center items-center"><button onclick="window.startReview()" class="${btnBase} bg-amber-500 text-white">Review Mistakes</button><button onclick="window.clearSession()" class="${btnBase} bg-white border border-slate-300 text-slate-700">New Set</button></div>`;
            } else footerHtml = `<div class="text-slate-400 font-bold uppercase tracking-widest text-[10px] w-full text-center">Select Region to Start</div>`;
            
            document.getElementById('footer-prompt').innerHTML = footerHtml;
            if (fullRender) window.renderMap();
        };

        window.renderMap = () => {
            if (!mapInstance || typeof L === 'undefined') return;
            const current = quizSequence[round], isFinished = round >= quizSequence.length;
            mapLayers.forEach(l => mapInstance.removeLayer(l)); mapLayers = [];

            let playBounds = null;
            if (places.length > 0) {
                playBounds = L.latLngBounds([]);
                places.forEach(p => { if (p.bbox) { playBounds.extend([p.bbox[0], p.bbox[2]]); playBounds.extend([p.bbox[1], p.bbox[3]]); } });
            }

            if (gameState === "setup") { mapInstance.setMaxBounds([[-90, -180], [90, 180]]); mapInstance.setMinZoom(2); }
            else if (playBounds && playBounds.isValid()) {
                const pb = playBounds.pad(0.3); mapInstance.setMaxBounds(pb);
                mapInstance.setMinZoom(Math.max(mapInstance.getBoundsZoom(pb), 2));
            }

            if (isFinished && playBounds && lastFramedRound !== 'fin') { mapInstance.fitBounds(playBounds.pad(0.1), { animate: true }); lastFramedRound = 'fin'; }
            else if (gameState === "playing" && playBounds && lastFramedRound === -1) { mapInstance.fitBounds(playBounds.pad(0.1), { animate: true }); lastFramedRound = 'init'; }
            else if (gameState === "learning" && current) {
                if (current.bbox) mapInstance.fitBounds(L.latLngBounds([current.bbox[0], current.bbox[2]], [current.bbox[1], current.bbox[3]]).pad(0.15), { animate: true });
                else mapInstance.setView([current.lat, current.lon], 6, { animate: true });
            }

            if (gameState !== "setup") L.rectangle([[-90, -180], [90, 180]], { color: 'transparent', fillColor: '#334155', fillOpacity: 0.25, interactive: false }).addTo(mapInstance).on('add', (e)=>mapLayers.push(e.target));

            missedClicks.forEach(ll => L.circleMarker(ll, { radius: 5, color: '#991b1b', fillColor: '#ef4444', fillOpacity: 1, weight: 2, interactive: false }).addTo(mapInstance).on('add', (e)=>mapLayers.push(e.target)));

            places.forEach(p => {
                const isDone = !!completedHighlights[p.name], isWrong = wrongGuessesThisRound.includes(p.name);
                const isFailRev = isWaitingForNext && current && p.name === current.name;
                const isLearn = gameState === "learning" && current && p.name === current.name;
                const data = completedHighlights[p.name];
                let style;
                if (isDone) style = { color: data.borderColor, fillColor: data.fillColor, fillOpacity: 0.9, weight: 2 };
                else if (isFailRev) style = { color: '#7f1d1d', fillColor: '#ef4444', fillOpacity: 0.9, weight: 3, className: 'animate-pulse' };
                else if (isLearn) style = { color: '#2563eb', fillColor: '#60a5fa', fillOpacity: 0.7, weight: 3, dashArray: '5, 5', className: 'animate-pulse' };
                else if (isWrong) style = { color: '#ef4444', fillColor: 'url(#stripes)', fillOpacity: 1, weight: 2 };
                else if (p.isCity) style = { color: '#ffffff', fillColor: '#1e293b', fillOpacity: 1, weight: 3 };
                else style = { color: '#ffffff', fillColor: '#ffffff', fillOpacity: 0.1, weight: 1.5 };

                const clickable = gameState === "playing" && !isDone && !isWrong && !isWaitingForNext;
                let layer;
                if (p.isCity) layer = L.circleMarker([p.lat, p.lon], { ...style, radius: isDone || isWrong || isFailRev ? 7 : 5, interactive: clickable });
                else if (p.geojson) layer = L.geoJSON(p.geojson, { style: () => style, interactive: clickable });

                if (layer) {
                    if (clickable) {
                        layer.on('mouseover', () => { if(p.isCity) layer.setRadius(9); layer.setStyle({ weight: 4 }); });
                        layer.on('mouseout', () => { if(p.isCity) layer.setRadius(5); layer.setStyle({ weight: style.weight }); });
                        layer.on('click', (e) => { L.DomEvent.stopPropagation(e); if(gameState === "learning") { if(autoNext) window.handleNext(); } else window.submitGuess(p.name); });
                    }
                    if (isDone || isFailRev) layer.bindTooltip(p.name, { permanent: true, direction: p.isCity ? 'right' : 'center', className: 'map-label', offset: p.isCity ? [8, 0] : [0, 0] });
                    layer.addTo(mapInstance); mapLayers.push(layer);
                    if (isLearn || isFailRev || isDone) if(layer.bringToFront) layer.bringToFront();
                }
            });
        };

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
