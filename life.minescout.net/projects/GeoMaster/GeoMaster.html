<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoMaster Pro - Africa Edition</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        
        body { font-family: 'Inter', sans-serif; height: 100vh; overflow: hidden; }
        
        #map { 
            width: 100%; 
            height: 100%; 
            background-color: #d4dae0; 
            min-height: 400px;
        }

        .leaflet-container { font-family: 'Inter', sans-serif; }
        .leaflet-interactive { transition: fill-opacity 0.2s, stroke-width 0.2s, r 0.2s, fill 0.2s; }
        
        /* Non-Blocking Labels with Leader Lines */
        .leaflet-tooltip.map-label {
            background: rgba(255, 255, 255, 0.98);
            border: 1px solid #94a3b8;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            font-weight: 800;
            font-size: 10px;
            color: #1e293b;
            padding: 2px 7px;
            border-radius: 4px;
            pointer-events: none !important; /* Click-through */
            user-select: none;
            white-space: nowrap;
        }
        
        .leaflet-tooltip.map-label::before {
            content: '';
            position: absolute;
            background: #94a3b8;
            width: 30px; /* Long leader line */
            height: 1px;
            top: 50%;
            left: -30px;
        }

        .leaflet-tooltip-top:before, .leaflet-tooltip-bottom:before, 
        .leaflet-tooltip-left:before, .leaflet-tooltip-right:before { display: none !important; }
        
        .hidden { display: none !important; }
        
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1); }
        }
        .animate-pop { animation: popIn 0.2s ease-out forwards; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 10px; }

        .toggle-dot { transition: all 0.2s ease-in-out; }
        input:checked ~ .toggle-dot { transform: translateX(100%); }
        input:checked ~ .toggle-bg { background-color: #2563eb; }
    </style>
</head>
<body class="min-h-screen bg-slate-100 p-4 md:p-6 lg:p-8 text-slate-900 relative selection:bg-blue-200">

    <!-- OVERLAYS -->
    <div id="loading-overlay" class="fixed inset-0 z-[9999] bg-slate-900/95 backdrop-blur-md flex flex-col items-center justify-center text-white hidden">
        <div class="relative w-24 h-24 mb-6">
            <div class="absolute inset-0 border-4 border-slate-700 rounded-full"></div>
            <div class="absolute inset-0 border-4 border-blue-500 rounded-full border-t-transparent animate-spin"></div>
            <i class="ph-bold ph-globe absolute inset-0 flex items-center justify-center text-3xl text-blue-400"></i>
        </div>
        <h2 class="text-2xl font-black mb-2">Syncing Data</h2>
        <p id="loading-msg" class="text-blue-300 font-medium text-sm animate-pulse">Initializing map...</p>
        <div class="w-64 h-2 bg-slate-800 rounded-full mt-6 overflow-hidden border border-slate-700">
            <div id="loading-progress" class="h-full bg-blue-500 transition-all duration-300 w-0"></div>
        </div>
    </div>

    <!-- SVG Patterns -->
    <svg width="0" height="0" class="absolute pointer-events-none">
        <defs>
            <pattern id="stripes" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
                <rect width="8" height="8" fill="rgba(239, 68, 68, 0.2)" />
                <line x1="0" y1="0" x2="0" y2="8" stroke="#ef4444" stroke-width="2" />
            </pattern>
        </defs>
    </svg>

    <div class="max-w-[1440px] mx-auto grid lg:grid-cols-12 gap-6 lg:gap-8 h-full">
        
        <!-- SIDEBAR -->
        <div class="lg:col-span-4 xl:col-span-3 flex flex-col gap-6 h-full overflow-y-auto">
            <div class="bg-white rounded-3xl shadow-lg border border-slate-200 overflow-hidden shrink-0">
                <div class="p-6 bg-gradient-to-br from-slate-700 to-slate-900 text-white flex items-center justify-between">
                    <h3 class="text-2xl font-black tracking-tight flex items-center gap-2">
                        <i class="ph-fill ph-globe-hemisphere-east text-3xl text-blue-300"></i>
                        GeoMaster
                    </h3>
                    <span class="text-[10px] bg-white/20 px-2.5 py-1 rounded-full uppercase tracking-widest font-bold backdrop-blur-sm">Pro</span>
                </div>
                
                <div class="p-6 space-y-6">
                    <div class="space-y-3">
                        <label class="text-xs font-bold text-slate-500 uppercase tracking-widest block">Study Sets</label>
                        <div class="flex gap-2 overflow-x-auto pb-1">
                            <button onclick="window.loadPreset('Africa')" class="shrink-0 text-[10px] font-bold uppercase bg-slate-100 hover:bg-blue-50 hover:text-blue-600 px-3 py-1.5 rounded-lg border border-slate-200 transition-colors">🌍 Africa</button>
                        </div>

                        <textarea id="rawInput" class="w-full rounded-2xl border-2 border-slate-200 bg-slate-50 px-4 py-3 text-sm focus:border-blue-500 focus:bg-white transition-colors font-medium min-h-[160px] resize-none" placeholder="1 location per line..."></textarea>
                        
                        <div class="grid grid-cols-2 gap-3 pt-2">
                            <button onclick="window.prepareGame('playing')" class="flex flex-col items-center justify-center gap-1 rounded-2xl bg-blue-600 text-white hover:bg-blue-700 active:scale-95 transition-all shadow-md py-3">
                                <i class="ph-bold ph-target text-xl"></i>
                                <span class="text-xs font-bold uppercase tracking-wide">Quiz Mode</span>
                            </button>
                            <button onclick="window.prepareGame('learning')" class="flex flex-col items-center justify-center gap-1 rounded-2xl bg-slate-100 text-slate-700 hover:bg-slate-200 active:scale-95 transition-all py-3 border border-slate-200">
                                <i class="ph-bold ph-book-open text-xl"></i>
                                <span class="text-xs font-bold uppercase tracking-wide">Learn Mode</span>
                            </button>
                        </div>
                    </div>

                    <hr class="border-slate-100" />

                    <div class="flex items-center justify-between p-4 bg-slate-50 rounded-2xl border border-slate-200">
                        <div class="flex flex-col">
                            <span class="text-sm font-bold text-slate-700">Auto-Advance</span>
                            <span class="text-[10px] text-slate-500 font-medium">Fast transition</span>
                        </div>
                        <label class="flex items-center cursor-pointer">
                            <div class="relative">
                                <input type="checkbox" id="autoNextToggle" class="sr-only" checked onchange="window.toggleAutoNext(this.checked)">
                                <div class="toggle-bg block bg-slate-300 w-12 h-6 rounded-full"></div>
                                <div class="toggle-dot absolute left-1 top-1 bg-white w-4 h-4 rounded-full transition shadow-sm"></div>
                            </div>
                        </label>
                    </div>
                </div>
            </div>
        </div>

        <!-- MAIN AREA -->
        <div class="lg:col-span-8 xl:col-span-9 flex flex-col gap-5 h-full relative">
            
            <!-- PERFORMANCE BAR -->
            <div id="performance-dashboard" class="bg-slate-900 text-white px-6 py-4 rounded-3xl shadow-lg border border-slate-800 shrink-0 relative overflow-hidden min-h-[5.5rem] flex items-center justify-center z-[1000]">
                <i class="ph-fill ph-trophy absolute -right-2 -top-6 text-8xl text-white/5 pointer-events-none"></i>

                <div id="perf-overview" class="flex items-center justify-between w-full">
                    <div class="flex items-center gap-5">
                        <div id="accuracy-grade" class="w-14 h-14 bg-slate-800 rounded-xl flex items-center justify-center text-3xl font-black text-slate-500 border-2 border-slate-700 rotate-3">-</div>
                        <div class="flex flex-col">
                            <span class="text-[10px] text-blue-400 font-bold uppercase tracking-widest mb-0.5">Accuracy</span>
                            <span id="accuracy-score" class="text-3xl font-black text-white leading-none">0%</span>
                        </div>
                    </div>
                    <div class="flex flex-col items-end text-right hidden sm:flex">
                        <span class="text-[10px] text-slate-400 font-bold uppercase mb-0.5">Status</span>
                        <span id="header-status-msg" class="text-lg font-black text-white">Ready to Learn</span>
                    </div>
                </div>

                <div id="perf-gameplay" class="hidden flex items-center justify-between w-full">
                    <div class="flex items-center gap-6">
                        <div class="flex flex-col">
                            <span class="text-[10px] font-bold text-slate-400 uppercase mb-0.5">Progress</span>
                            <span class="text-xl font-black text-white leading-none"><span id="hud-progress">0</span><span class="text-slate-500 text-sm mx-1">/</span><span id="hud-total">0</span></span>
                        </div>
                        <div class="flex flex-col hidden sm:flex">
                            <span class="text-[10px] font-bold text-emerald-400 uppercase mb-0.5">Score</span>
                            <span id="hud-score" class="text-xl font-black text-white leading-none">0%</span>
                        </div>
                    </div>
                    
                    <div class="absolute left-1/2 -translate-x-1/2 flex flex-col items-center w-full max-w-[200px] sm:max-w-[300px]">
                        <span id="hud-verb" class="text-[10px] text-slate-400 font-bold uppercase mb-1">Click on</span>
                        <div class="bg-blue-600 px-6 py-1.5 rounded-xl shadow-[0_4px_0_#1e3a8a] border border-blue-400 w-full text-center">
                            <span id="hud-target-name" class="text-xl font-black text-white truncate block">Target</span>
                        </div>
                    </div>
                    
                    <div class="flex flex-col items-end">
                        <span class="text-[10px] font-bold text-slate-400 uppercase mb-0.5">Timer</span>
                        <div class="flex items-center gap-1.5 text-blue-400">
                            <i class="ph-bold ph-timer text-lg"></i>
                            <span id="hud-timer" class="text-xl font-black text-white tabular-nums">00:00</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- MAP CONTAINER -->
            <div class="bg-white rounded-3xl shadow-xl border border-slate-200 flex flex-col flex-1 relative overflow-hidden">
                <div class="flex-1 relative z-0">
                    <div id="map"></div>
                    
                    <!-- Wiki Fact Box -->
                    <div id="fact-box" class="absolute bottom-4 left-4 z-[1000] bg-white/95 backdrop-blur border border-slate-200 p-4 rounded-2xl shadow-xl max-w-[320px] hidden animate-pop">
                        <h4 class="text-[10px] font-black text-blue-600 uppercase mb-1 border-b pb-1" id="fact-title">Location</h4>
                        <p id="fact-text" class="text-xs text-slate-700 leading-relaxed max-h-32 overflow-y-auto italic">Loading summary...</p>
                    </div>
                </div>

                <div id="footer-prompt" class="px-6 py-4 bg-white border-t border-slate-100 flex justify-between items-center z-[1000] min-h-[72px]">
                </div>
            </div>
        </div>
    </div>

    <script>
        // ARCHITECTURE: Unified State Object
        const state = {
            places: [],
            quizSequence: [],
            round: 0,
            attempts: 0,
            gameState: "setup", 
            time: 0,
            autoNext: true,
            hintUsedThisRound: false,
            isWaitingForNext: false,
            completed: {}, // name -> { attemptsUsed, score }
            wrongGuessesThisRound: [],
            missedClicks: [], // Per-round miss markers
            lastFramedRound: -1
        };

        const PRESETS = {
            "Africa": "Algeria\nAngola\nBenin\nBotswana\nBurkina Faso\nBurundi\nCameroon\nCape Verde\nCentral African Republic\nChad\nComoros\nDemocratic Republic of the Congo\nDjibouti\nEgypt\nEquatorial Guinea\nEritrea\nEswatini\nEthiopia\nGabon\nGhana\nGuinea\nGuinea-Bissau\nIvory Coast\nKenya\nLesotho\nLiberia\nLibya\nMadagascar\nMalawi\nMali\nMauritania\nMauritius\nMorocco\nMozambique\nNamibia\nNiger\nNigeria\nRepublic of the Congo\nRwanda\nSenegal\nSeychelles\nSierra Leone\nSomalia\nSouth Africa\nSouth Sudan\nSudan\nSão Tomé and Príncipe\nTanzania\nThe Gambia\nTogo\nTunisia\nUganda\nWestern Sahara\nZambia\nZimbabwe"
        };

        // PERFORMANCE: Map store to avoid destruction/recreation
        const placeLayers = new Map();
        let mapInstance = null;
        let activeTileLayer = null;
        let timerInterval = null;
        let audioCtx = null;
        let missMarkers = [];

        const geoCache = JSON.parse(localStorage.getItem('geomaster-cache-v7')) || {};
        const wikiCache = JSON.parse(localStorage.getItem('geomaster-wiki-v2')) || {};

        // --- Core Helpers ---

        window.loadPreset = (key) => {
            document.getElementById('rawInput').value = PRESETS[key] || "";
            document.getElementById('rawInput').classList.add('bg-blue-50');
            setTimeout(() => document.getElementById('rawInput').classList.remove('bg-blue-50'), 300);
        };

        window.toggleAutoNext = (val) => { state.autoNext = val; window.updateUI(false); };

        window.formatTime = (s) => {
            const mins = Math.floor(s / 60);
            const secs = s % 60;
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        };

        window.isTooSmall = (p) => {
            if (!p.bbox) return false;
            const latDiff = Math.abs(p.bbox[1] - p.bbox[0]);
            const lonDiff = Math.abs(p.bbox[3] - p.bbox[2]);
            return (latDiff + lonDiff) < 1.3;
        };

        window.playSound = (type) => {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            try {
                const osc = audioCtx.createOscillator(), gainNode = audioCtx.createGain();
                osc.connect(gainNode); gainNode.connect(audioCtx.destination);
                const now = audioCtx.currentTime;
                if (type === 'correct') {
                    osc.type = 'sine'; osc.frequency.setValueAtTime(523.25, now); osc.frequency.exponentialRampToValueAtTime(1046.50, now + 0.1);
                    gainNode.gain.setValueAtTime(0.3, now); gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                } else {
                    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, now); osc.frequency.exponentialRampToValueAtTime(100, now + 0.2);
                    gainNode.gain.setValueAtTime(0.2, now); gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                }
                osc.start(now); osc.stop(now + 0.3);
            } catch (e) {}
        };

        window.fetchWikiFact = async (targetName) => {
            if (wikiCache[targetName]) return wikiCache[targetName];
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 4000); 
                const res = await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(targetName)}`, { signal: controller.signal });
                const data = await res.json();
                clearTimeout(timeoutId);
                const text = data.extract || "No summary available.";
                wikiCache[targetName] = text;
                localStorage.setItem('geomaster-wiki-v2', JSON.stringify(wikiCache));
                return text;
            } catch (e) { return "Summary restricted on this network."; }
        };

        function addReliableTileLayer() {
            const sources = [
                { url: 'https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png', options: { attribution: '&copy; CARTO', subdomains: 'abcd', maxZoom: 20 } },
                { url: 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', options: { attribution: '&copy; OSM', maxZoom: 19 } },
                { url: 'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', options: { attribution: '&copy; Esri', maxZoom: 16 } }
            ];

            let index = 0;
            const trySource = () => {
                if (index >= sources.length) return;
                if (activeTileLayer) mapInstance.removeLayer(activeTileLayer);
                const src = sources[index];
                activeTileLayer = L.tileLayer(src.url, src.options);
                activeTileLayer.on('tileerror', () => { index++; trySource(); });
                activeTileLayer.addTo(mapInstance);
            };
            trySource();
        }

        function init() {
            if (typeof L === 'undefined') { setTimeout(init, 200); return; }
            if (mapInstance) return;
            if (!document.getElementById('rawInput').value.trim()) window.loadPreset('Africa');

            mapInstance = L.map('map', { 
                center: [0, 20], zoom: 3, minZoom: 2, worldCopyJump: true, zoomControl: false,
                maxBounds: [[-90, -180], [90, 180]]
            });
            
            addReliableTileLayer();
            mapInstance.on('zoomend', () => window.updateUI(false));
            
            window.updateUI();
            setTimeout(() => mapInstance.invalidateSize(), 500);
            new ResizeObserver(() => { if (mapInstance) mapInstance.invalidateSize(); }).observe(document.getElementById('map'));
        }

        // --- Game Setup ---

        window.prepareGame = async (mode) => {
            const rawLines = document.getElementById('rawInput').value.split("\n").map(s => s.trim()).filter(Boolean);
            if (rawLines.length === 0) return;

            document.getElementById('loading-overlay').classList.remove('hidden');
            state.gameState = "setup"; 
            document.getElementById('fact-box').classList.add('hidden');
            state.time = 0; state.round = 0; state.attempts = 0;
            state.completed = {}; state.wrongGuessesThisRound = [];
            state.hintUsedThisRound = false; state.isWaitingForNext = false; state.lastFramedRound = -1;
            
            clearMissMarkers();

            const results = [], uniqueLines = [...new Set(rawLines)];

            for (let i = 0; i < uniqueLines.length; i++) {
                const targetName = uniqueLines[i];
                document.getElementById('loading-msg').innerText = `Searching: ${targetName}`;
                // PERFORMANCE: Correct progress logic
                document.getElementById('loading-progress').style.width = `${((i + 1) / uniqueLines.length) * 100}%`;
                
                if (geoCache[targetName] && geoCache[targetName] !== "NOT_FOUND") {
                    results.push(geoCache[targetName]); continue; 
                }

                try {
                    const res = await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&q=${encodeURIComponent(targetName)}&polygon_geojson=1&polygon_threshold=0.01`);
                    const data = await res.json();
                    const f = data?.[0];
                    if (f) {
                        const fd = { name: targetName, lat: Number(f.lat), lon: Number(f.lon), bbox: f.boundingbox.map(Number), geojson: f.geojson, isCity: ['city', 'town', 'village', 'point'].includes(f.type || f.addresstype || "") };
                        results.push(fd); geoCache[targetName] = fd;
                    } else { geoCache[targetName] = "NOT_FOUND"; }
                    localStorage.setItem('geomaster-cache-v7', JSON.stringify(geoCache));
                    // Respectful API request rate
                    await new Promise(r => setTimeout(r, 800));
                } catch (e) {}
            }
            
            document.getElementById('loading-overlay').classList.add('hidden');
            state.places = results;
            state.quizSequence = mode === "playing" ? [...results].sort(() => Math.random() - 0.5) : [...results];
            
            if (results.length > 0) { 
                state.gameState = mode; 
                buildLayersOnce();
                window.startTimer(); 
            }
            window.updateUI();
        };

        function buildLayersOnce() {
            placeLayers.forEach(l => mapInstance.removeLayer(l));
            placeLayers.clear();

            state.places.forEach(p => {
                const small = window.isTooSmall(p);
                // Fix: Interaction enabled for both modes
                const isInteractive = state.gameState === "playing" || state.gameState === "learning";
                let layer;

                const baseStyle = { color: '#64748b', fillColor: '#94a3b8', fillOpacity: 0, weight: 1.5 };

                if (p.isCity || small) {
                    layer = L.circleMarker([p.lat, p.lon], { ...baseStyle, interactive: isInteractive });
                } else if (p.geojson) {
                    layer = L.geoJSON(p.geojson, { style: baseStyle, interactive: isInteractive });
                }

                if (layer) {
                    layer.on('mouseover', () => {
                        if (state.gameState === "setup" || state.isWaitingForNext || state.completed[p.name]) return;
                        layer.setStyle({ fillOpacity: 0.3 });
                        if (p.isCity || small) layer.setRadius(7);
                    });
                    layer.on('mouseout', () => {
                        if (!state.completed[p.name]) {
                            layer.setStyle({ fillOpacity: 0 });
                            if (p.isCity || small) layer.setRadius(window.calculateDotRadius(p));
                        }
                    });
                    layer.on('click', (e) => {
                        L.DomEvent.stopPropagation(e);
                        if (state.gameState === "learning") {
                            if (state.autoNext) window.handleNext();
                        } else {
                            window.submitGuess(p.name, e.latlng);
                        }
                    });
                    layer.addTo(mapInstance);
                    placeLayers.set(p.name, layer);
                }
            });
        }

        function clearMissMarkers() {
            missMarkers.forEach(m => mapInstance.removeLayer(m));
            missMarkers = [];
        }

        // --- Interaction ---

        window.submitGuess = async (guessedName, clickLatLng) => {
            if (state.gameState !== "playing" || state.isWaitingForNext) return;
            const current = state.quizSequence[state.round];
            if (!current) return;

            if (guessedName !== current.name) {
                window.playSound('wrong');
                if (state.attempts < 2) {
                    state.attempts++;
                    if (guessedName && !state.wrongGuessesThisRound.includes(guessedName)) state.wrongGuessesThisRound.push(guessedName);
                    // UX: Red point miss marker
                    const m = L.circleMarker(clickLatLng, { radius: 3, color: '#ef4444', fillColor: '#ef4444', fillOpacity: 1, interactive: false }).addTo(mapInstance);
                    missMarkers.push(m);
                    window.updateUI(); 
                } else {
                    // Strikee 3
                    state.completed[current.name] = { attemptsUsed: 4, score: 0 };
                    state.isWaitingForNext = true; 
                    window.updateUI(); 
                    setTimeout(() => { 
                        state.isWaitingForNext = false; state.round++; state.attempts = 0; state.wrongGuessesThisRound = []; 
                        clearMissMarkers(); window.updateUI(); 
                    }, 1200);
                }
            } else {
                window.playSound('correct');
                // ARCHITECTURE: New granular scoring
                const finalScore = 100 - (state.attempts * 25) - (state.hintUsedThisRound ? 15 : 0);
                state.completed[current.name] = { attemptsUsed: state.attempts + 1, score: Math.max(0, finalScore) };
                
                document.getElementById('fact-box').classList.remove('hidden'); 
                document.getElementById('fact-title').innerText = current.name; 
                document.getElementById('fact-text').innerText = "Loading summary...";
                const summary = await window.fetchWikiFact(current.name);
                if (document.getElementById('fact-title').innerText === current.name) document.getElementById('fact-text').innerText = summary;

                clearMissMarkers();
                state.round++; state.attempts = 0; state.wrongGuessesThisRound = []; state.hintUsedThisRound = false; 
                window.updateUI();
            }
        };

        window.handleNext = () => {
            state.attempts = 0; state.wrongGuessesThisRound = [];
            clearMissMarkers();
            if (state.round < state.quizSequence.length - 1) state.round++;
            else state.round = state.quizSequence.length;
            window.updateUI();
        };

        window.useHint = () => {
            if (state.hintUsedThisRound || state.gameState !== "playing") return;
            state.hintUsedThisRound = true; if (state.attempts < 2) state.attempts++;
            const current = state.quizSequence[state.round];
            if (current) {
                mapInstance.flyTo([current.lat, current.lon], 5, { duration: 1 });
                state.lastFramedRound = state.round;
            }
            window.updateUI();
        };

        window.clearSession = () => {
            state.places = []; state.quizSequence = []; state.round = 0; state.gameState = "setup"; state.completed = {};
            state.wrongGuessesThisRound = []; state.attempts = 0; state.time = 0; 
            document.getElementById('rawInput').value = "";
            document.getElementById('fact-box').classList.add('hidden'); 
            window.stopTimer(); 
            placeLayers.forEach(l => mapInstance.removeLayer(l));
            placeLayers.clear(); clearMissMarkers(); window.updateUI();
        };

        window.startTimer = () => { window.stopTimer(); if (state.gameState === "playing") timerInterval = setInterval(() => { state.time++; document.getElementById('hud-timer').innerText = window.formatTime(state.time); }, 1000); };
        window.stopTimer = () => { if (timerInterval) clearInterval(timerInterval); };

        window.calculateDotRadius = (p) => {
            const zoom = mapInstance ? mapInstance.getZoom() : 3;
            const multiplier = window.isTooSmall(p) ? 2.5 : 1.5;
            return Math.max(2, (zoom / 4) * multiplier);
        };

        // --- View Logic ---

        window.updateUI = (fullRender = true) => {
            const current = state.quizSequence[state.round], isFinished = state.quizSequence.length > 0 && state.round >= state.quizSequence.length;
            const completedCount = Object.keys(state.completed).length;
            const earned = Object.values(state.completed).reduce((acc, curr) => acc + curr.score, 0);
            const avgScore = completedCount > 0 ? Math.round((earned / (completedCount * 100)) * 100) : 0;

            if (state.gameState !== "setup" && !isFinished) {
                document.getElementById('perf-overview').classList.add('hidden'); 
                document.getElementById('perf-gameplay').classList.remove('hidden');
                document.getElementById('hud-progress').innerText = completedCount; 
                document.getElementById('hud-total').innerText = state.quizSequence.length;
                document.getElementById('hud-score').innerText = `${avgScore}%`;
                if (current) { 
                    document.getElementById('hud-verb').innerText = state.gameState === "learning" ? "Study" : "Click on"; 
                    document.getElementById('hud-target-name').innerText = current.name; 
                }
            } else {
                document.getElementById('perf-gameplay').classList.add('hidden'); 
                document.getElementById('perf-overview').classList.remove('hidden');
                document.getElementById('accuracy-score').innerText = `${avgScore}%`;
                document.getElementById('header-status-msg').innerText = isFinished ? "Session Complete" : "Select Region";
                const gradeEl = document.getElementById('accuracy-grade');
                if(completedCount === 0) gradeEl.innerText = '-';
                else if(avgScore >= 90) gradeEl.innerText = 'S';
                else if(avgScore >= 80) gradeEl.innerText = 'A';
                else gradeEl.innerText = avgScore >= 60 ? 'B' : 'F';
            }

            const btnBase = "inline-flex items-center justify-center rounded-2xl text-sm font-black transition-all active:scale-95 px-6 py-3 shadow-sm ";
            let footerHtml = '';
            if (state.gameState === "playing" && !isFinished) {
                let dotsHtml = `<div class="flex gap-1.5 mr-4">`;
                for (let i = 0; i < 3; i++) dotsHtml += `<div class="w-3 h-3 rounded-full transition-all ${i < (3 - state.attempts) ? 'bg-blue-500' : 'bg-slate-200'}"></div>`;
                dotsHtml += `</div>`;
                const hintBtn = `<button onclick="window.useHint()" class="${btnBase} ${state.hintUsedThisRound ? 'bg-slate-100 text-slate-400 border cursor-not-allowed' : 'bg-amber-100 text-amber-700 border border-amber-300'} ml-auto" ${state.hintUsedThisRound ? 'disabled' : ''}>Hint</button>`;
                footerHtml = `<div class="flex items-center justify-between w-full"><div class="flex items-center">${dotsHtml}<div class="text-slate-500 font-bold uppercase text-xs hidden sm:block">Find target</div></div>${hintBtn}</div>`;
            } else if (state.gameState === "learning" && !isFinished) {
                footerHtml = state.autoNext ? `<div class="text-slate-400 font-bold uppercase text-xs w-full text-center animate-pulse">Click target to advance</div>` : `<button onclick="window.handleNext()" class="${btnBase} bg-blue-600 text-white mx-auto">Next Target</button>`;
            } else if (isFinished) {
                footerHtml = `<div class="flex gap-3 w-full justify-center items-center"><button onclick="window.prepareGame('playing')" class="${btnBase} bg-blue-600 text-white">Restart Quiz</button><button onclick="window.clearSession()" class="${btnBase} bg-white border border-slate-300 text-slate-700">New Set</button></div>`;
            } else footerHtml = `<div class="text-slate-400 font-bold uppercase tracking-widest text-[10px] w-full text-center">Ready to Start</div>`;
            
            document.getElementById('footer-prompt').innerHTML = footerHtml;
            if (fullRender) window.renderMap();
        };

        window.renderMap = () => {
            if (!mapInstance || typeof L === 'undefined') return;
            const current = state.quizSequence[state.round];
            
            // Learning mode Smooth Auto-Pan
            if (state.gameState === "learning" && current) {
                if (!mapInstance.getBounds().pad(-0.2).contains([current.lat, current.lon])) {
                    mapInstance.flyTo([current.lat, current.lon], 5, { duration: 1.2 });
                }
            }

            placeLayers.forEach((layer, name) => {
                const p = state.places.find(pl => pl.name === name);
                const isDone = !!state.completed[name];
                const isWrong = state.wrongGuessesThisRound.includes(name);
                const isFailReveal = state.isWaitingForNext && current && name === current.name;
                const isLearn = state.gameState === "learning" && current && name === current.name;
                const data = state.completed[name];
                
                let style;
                if (isDone) {
                    let fill = '#ffffff'; // White for 1st
                    if (data.attemptsUsed === 2) fill = '#fef08a'; // Yellow
                    if (data.attemptsUsed === 3) fill = '#f97316'; // Orange
                    style = { color: '#94a3b8', fillColor: fill, fillOpacity: 0.95, weight: 1.5 };
                } 
                else if (isFailReveal) style = { color: '#7f1d1d', fillColor: '#ef4444', fillOpacity: 0.9, weight: 3, className: 'animate-pulse' };
                else if (isLearn) style = { color: '#2563eb', fillColor: '#60a5fa', fillOpacity: 0.6, weight: 3, dashArray: '5, 5', className: 'animate-pulse' };
                else if (isWrong) style = { color: '#ef4444', fillColor: 'url(#stripes)', fillOpacity: 1, weight: 2 }; 
                else style = { color: '#64748b', fillOpacity: 0, weight: 1.5 }; // Initial empty

                layer.setStyle(style);
                if (layer.setRadius) layer.setRadius(isDone || isFailReveal || isWrong ? window.calculateDotRadius(p) + 2 : window.calculateDotRadius(p));
                
                if (isDone || isFailReveal) {
                    if (!layer.getTooltip()) {
                        layer.bindTooltip(name, { 
                            permanent: true, direction: 'right', className: 'map-label', 
                            offset: [40, 0] // Leader line gap
                        });
                    }
                } else if (layer.getTooltip()) {
                    layer.unbindTooltip();
                }
                if (isLearn || isFailReveal || isDone) layer.bringToFront();
            });
        };

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
