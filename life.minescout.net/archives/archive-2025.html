<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2025 Archive - Minescouts Life</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- M3 Design System Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;500;700&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <!-- Unified Master Stylesheets -->
    <link rel="stylesheet" href="/assests/css/homepage.css">
    <link rel="stylesheet" href="/assests/css/features.css">
    <link rel="icon" type="image/png" href="/assests/images/favicon.png?v=2">
    
    <style>
        #user-display a { text-decoration: none; color: white; }
        
        .archive-header { margin-bottom: 32px; }
        .archive-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2.2rem;
            color: var(--text-color);
            margin-bottom: 8px;
        }
        .archive-subtitle { color: var(--md-outline); font-size: 1.05rem; }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--md-primary);
            font-weight: 700;
            text-decoration: none;
            transition: all 0.3s var(--motion-standard);
            margin-bottom: 16px;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .back-link:hover { transform: translateX(-4px); }

        .month-separator {
            font-family: 'Space Grotesk', sans-serif;
            border-bottom: 2px solid var(--md-primary);
            padding-bottom: 12px;
            margin-bottom: 24px;
            font-size: 1.5rem;
            color: var(--text-color);
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <header class="main-header">
        <div class="container site-title-container">
            <div id="auth-container"><a href="/login.html" id="login-link">Login</a></div>
            <div class="site-title-wrapper">
                <h1 class="site-title"><a href="/index.html" style="color: white; text-decoration: none;">Minescouts Life</a></h1>
                <p class="tagline">Archive: 2025</p>
            </div>
            <div id="user-display" class="hidden">
                <a href="/account.html"><span id="user-email-display"></span></a>
                <button id="signOut-btn" class="btn-glass">Sign Out</button>
            </div>
        </div>
    </header>

    <div class="main-content-area">
        <div class="container">
            <main class="main-content">
                
                <a href="/pages/archives.html" class="back-link">
                    <span class="material-symbols-rounded">arrow_back</span>
                    Back to Archives
                </a>

                <div class="archive-header">
                    <h1 class="archive-title">2025 Collection</h1>
                    <p class="archive-subtitle">Exploring the foundational logs and early experiments of 2025.</p>
                </div>

                <!-- View Controls -->
                <div class="view-controls">
                    <button id="grid-3" class="view-btn active" data-view="3" title="Grid View"><span class="material-symbols-rounded">grid_view</span></button>
                    <button id="grid-2" class="view-btn" data-view="2" title="Split View"><span class="material-symbols-rounded">view_day</span></button>
                    <button id="grid-1" class="view-btn" data-view="1" title="List View"><span class="material-symbols-rounded">view_agenda</span></button>
                </div>

                <div id="posts-container">
                    <section>
                        <h2 class="month-separator">Monthly Archives</h2>
                        <!-- This container will be filled dynamically by the script below -->
                        <div id="all-posts-container" class="posts-grid view-3">
                            <p class="text-center" style="grid-column: 1/-1; padding: 40px; color: var(--md-outline);">Loading months...</p>
                        </div> 
                    </section>
                </div> 
            </main>

            <!-- Modular Sidebar -->
            <aside id="sidebar">
                <div id="sidebar-container"></div> 
            </aside>
        </div>
    </div>

    <footer class="main-footer">
        <div class="container text-center">
            <p id="copyright">© 2026 Minescouts Life. All rights reserved.</p>
        </div>
    </footer>
    
    <!-- DYNAMIC MONTH GENERATOR FOR 2025 -->
    <script type="module">
        const monthNames = [
            "January", "February", "March", "April", "May", "June",
            "July", "August", "September", "October", "November", "December"
        ];

        function generateArchiveGrid() {
            const container = document.getElementById('all-posts-container');
            const targetYear = 2025;
            const now = new Date();
            const currentYear = now.getFullYear();
            const currentMonth = now.getMonth(); 

            // Minescouts Life started in April 2025 (Index 3)
            const siteStartMonth = 3; 

            let maxMonth;
            if (currentYear > targetYear) {
                maxMonth = 11; // Year is in the past, show all available months
            } else if (currentYear === targetYear) {
                maxMonth = currentMonth; // Year is current, show up to now
            } else {
                maxMonth = -1; // Future year
            }

            if (maxMonth < siteStartMonth) {
                container.innerHTML = `<p class="text-center" style="grid-column: 1/-1;">Formation logs begin in April 2025.</p>`;
                return;
            }

            let html = '';
            // Changed logic: Loop forwards from siteStartMonth (April) to maxMonth to "go up"
            for (let i = siteStartMonth; i <= maxMonth; i++) {
                const monthName = monthNames[i];
                const monthNum = i + 1;
                
                html += `
                    <article class="post-card">
                        <div class="post-image-wrapper">
                            <img src="/assests/images/archive/${monthName} Archive.png" 
                                 alt="${monthName} 2025" 
                                 onerror="this.onerror=null; this.src='https://placehold.co/600x400/e0e0e0/333333?text=${monthName}+2025';">
                        </div>
                        <div class="post-card-content">
                            <span class="category-pill">Monthly Log</span>
                            <h3 class="post-title"><a href="/pages/archives/2025/archive-${monthNum}-2025.html">${monthName} 2025</a></h3>
                            <p class="post-excerpt">View all stories and tech updates published in ${monthName} 2025.</p>
                            <div style="margin-top:auto;">
                                <a href="/pages/archives/2025/archive-${monthNum}-2025.html" class="read-more">View Month</a>
                            </div>
                        </div>
                    </article>
                `;
            }
            container.innerHTML = html;
        }

        // Run on load
        generateArchiveGrid();
    </script>

    <!-- MODULAR SCRIPTS -->
    <script type="module" src="/assests/js/auth.js"></script>
    <script type="module" src="/assests/js/homepage.js"></script>
    <script src="/assests/js/loader.js"></script>

</body>
</html>
