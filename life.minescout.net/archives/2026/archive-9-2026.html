<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monthly Archive - Minescouts Life</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- M3 Design System Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;500;700&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <!-- Unified Master Stylesheets -->
    <link rel="stylesheet" href="/assests/css/homepage.css?v=1.12">
    <link rel="stylesheet" href="/assests/css/features.css">
    <link rel="stylesheet" href="/assests/css/AI-ASSISTANT.css">
    <link rel="icon" type="image/png" href="/assests/images/favicon.png?v=2">
    
    <style>
        #user-display a { text-decoration: none; color: white; }
        
        .archive-header { margin-bottom: 32px; }
        .archive-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2.2rem;
            color: var(--text-color);
            margin-bottom: 8px;
        }
        .archive-subtitle { color: var(--md-outline); font-size: 1.05rem; }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--md-primary);
            font-weight: 700;
            text-decoration: none;
            transition: all 0.3s var(--motion-standard);
            margin-bottom: 16px;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .back-link:hover { transform: translateX(-4px); }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <header class="main-header">
        <div class="container site-title-container">
            <div id="auth-container"><a href="/login.html" id="login-link">Login</a></div>
            <div class="site-title-wrapper">
                <h1 class="site-title"><a href="/index.html" style="color: white; text-decoration: none;">Minescouts Life</a></h1>
                <p class="tagline">Archive</p>
            </div>
            <div id="user-display" class="hidden">
                <a href="/account.html"><span id="user-email-display"></span></a>
                <button id="signOut-btn" class="btn-glass">Sign Out</button>
            </div>
        </div>
    </header>

    <div class="main-content-area">
        <div class="container">
            <main class="main-content">
                
                <a href="/pages/archives.html" class="back-link">
                    <span class="material-symbols-rounded">arrow_back</span>
                    Back to Archives
                </a>

                <div class="archive-header">
                    <h1 class="archive-title" id="display-month-year">Loading Archive...</h1>
                    <p class="archive-subtitle">Displaying all logs and updates for this period.</p>
                </div>

                <!-- View Controls (Matched to Index Logic) -->
                <div class="view-controls">
                    <button id="grid-3" class="view-btn active" data-view="3" title="Grid View"><span class="material-symbols-rounded">grid_view</span></button>
                    <button id="grid-2" class="view-btn" data-view="2" title="Split View"><span class="material-symbols-rounded">view_day</span></button>
                    <button id="grid-1" class="view-btn" data-view="1" title="List View"><span class="material-symbols-rounded">view_agenda</span></button>
                </div>

                <!-- Posts Container -->
                <div id="posts-container" class="posts-grid view-3">
                    <p class="text-center" id="loading-message" style="grid-column: 1 / -1; padding: 40px; color: var(--md-outline);">Fetching logs...</p>
                </div> 
            </main>

            <!-- Modular Sidebar -->
            <aside id="sidebar">
                <div id="sidebar-container"></div> 
            </aside>
        </div>
    </div>

    <footer class="main-footer">
        <div class="container text-center">
            <p id="copyright">© 2026 Minescouts Life. All rights reserved.</p>
        </div>
    </footer>

    <!-- FIREBASE & ARCHIVE LOGIC -->
    <script type="module">
        import { db } from "/assests/js/firebase-config.js?v=1";
        import { ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

        // Archive Parsing Logic (Determines month/year from filename)
        const path = window.location.pathname;
        const filename = path.split('/').pop();
        let archiveMonth, archiveYear;
        
        try {
            // Assumes filename format: archive-3-2026.html
            const parts = filename.replace('archive-', '').replace('.html', '').split('-');
            archiveMonth = parseInt(parts[0], 10);
            archiveYear = parseInt(parts[1], 10);
        } catch (e) {
            console.error("Could not parse date from filename", e);
            document.getElementById('loading-message').textContent = "Error: Invalid archive file name.";
        }

        if (archiveMonth && archiveYear) {
            const monthName = new Date(archiveYear, archiveMonth - 1).toLocaleString('default', { month: 'long' });
            document.title = `${monthName} ${archiveYear} Archive - Minescouts Life`;
            document.getElementById('display-month-year').textContent = `${monthName} ${archiveYear}`;
            document.querySelector('.tagline').textContent = `Archive: ${monthName} ${archiveYear}`;
            
            fetchAndDisplayContent(archiveMonth, archiveYear, monthName);
        }

        function fetchAndDisplayContent(month, year, monthName) {
            const contentRef = ref(db, 'content');
            const postsContainer = document.getElementById('posts-container');
            const loadingMessage = document.getElementById('loading-message');

            onValue(contentRef, (snapshot) => {
                const contentData = snapshot.val();
                let postHtml = '';
                if (loadingMessage) loadingMessage.style.display = 'none';

                if (contentData) {
                    const allContent = Object.keys(contentData)
                        .map(key => ({ id: key, ...contentData[key] }))
                        .sort((a, b) => b.timestamp - a.timestamp);
                    
                    const filteredPosts = allContent.filter(item => {
                        if (item.type === 'announcement') return false;
                        const postDate = new Date(item.timestamp);
                        return postDate.getFullYear() === year && (postDate.getMonth() + 1) === month;
                    });

                    if (filteredPosts.length > 0) {
                        filteredPosts.forEach(post => postHtml += createPostElement(post.id, post));
                    } else {
                        postHtml = `<p class="text-center" style="grid-column: 1 / -1; padding: 40px; color: var(--md-outline);">No posts found for ${monthName} ${year}.</p>`;
                    }
                } else {
                    postHtml = `<p class="text-center" style="grid-column: 1 / -1; padding: 40px; color: var(--md-outline);">No content found.</p>`;
                }
                postsContainer.innerHTML = postHtml;
            });
        }

        function createPostElement(postId, post) {
            const date = new Date(post.timestamp).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
            
            const imgHtml = post.imageUrl 
                ? `<div class="post-image-wrapper"><img src="${post.imageUrl}" alt="${post.title}" loading="lazy" onerror="this.onerror=null; this.src='https://placehold.co/400x300/e0e0e0/333333?text=Image+Unavailable';" /></div>` 
                : `<div class="post-image-wrapper" style="background: var(--md-surface-container); display:flex; align-items:center; justify-content:center; color: var(--md-outline);"><span class="material-symbols-rounded" style="font-size:48px;">article</span></div>`;

            return `
                <article class="post-card" data-post-id="${postId}">
                    ${imgHtml}
                    <div class="post-card-content">
                        <span class="category-pill">${post.category || 'General'}</span>
                        <h3 class="post-title"><a href="${post.linkUrl || '#'}">${post.title || 'Untitled Post'}</a></h3>
                        <div class="post-meta">${date}</div>
                        <p class="post-excerpt">${post.summary || 'No summary provided.'}</p>
                        
                        <div style="margin-top:auto;">
                           <a href="${post.linkUrl || '#'}" class="read-more" target="_blank" style="width:100%;">
                                ${post.linkText || 'Read More'}
                           </a>
                        </div>
                    </div>
                </article>
            `;
        }
    </script>

    <!-- MODULAR SCRIPTS -->
    <script type="module" src="/assests/js/auth.js"></script>
    <script type="module" src="/assests/js/homepage.js"></script>
    <script src="/assests/js/loader.js"></script>

</body>
</html>
