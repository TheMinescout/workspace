<section class="comments-section" style="margin-top: 60px; border-top: 1px solid var(--md-outline); padding-top: 40px;">
    <h2 style="font-size: 1.5rem; margin-bottom: 25px; color: var(--md-on-surface); font-weight: 700;">Discussion</h2>

    <!-- Comment Form Card -->
    <div class="comment-form-container" style="background: var(--md-surface-card); padding: 25px; border-radius: var(--radius-card); border: 1px solid var(--md-outline); margin-bottom: 40px; box-shadow: var(--shadow-sm);">
        <h3 style="margin-top: 0; font-size: 1.1rem; margin-bottom: 20px; font-weight: 600;">Leave a Comment</h3>
        
        <form>
            <div class="form-group" style="margin-bottom: 15px;">
                <label for="name" style="display: block; font-weight: 600; margin-bottom: 8px; font-size: 0.85rem; color: var(--md-text-secondary); text-transform: uppercase;">Name</label>
                <input type="text" id="name" name="name" required placeholder="Your Name" 
                       style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--md-outline); background: var(--md-surface); color: var(--md-on-surface); outline: none; transition: border 0.2s;">
            </div>
            
            <div class="form-group" style="margin-bottom: 20px;">
                <label for="comment" style="display: block; font-weight: 600; margin-bottom: 8px; font-size: 0.85rem; color: var(--md-text-secondary); text-transform: uppercase;">Comment</label>
                <textarea id="comment" name="comment" rows="4" required placeholder="Share your thoughts..." 
                          style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--md-outline); background: var(--md-surface); color: var(--md-on-surface); outline: none; font-family: inherit; resize: vertical; transition: border 0.2s;"></textarea>
            </div>
            
            <button type="submit" class="submit-button">Post Comment</button>
        </form>
    </div>

    <!-- Comments List -->
    <div class="comments-list" style="display: flex; flex-direction: column; gap: 20px;">
        <!-- Javascript will inject comments here -->
        <p style="color: var(--md-text-secondary); text-align: center; font-style: italic;">Loading comments...</p>
    </div>
</section>
