<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MineScout Life</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <style>
    /* Inlined so the boot fallback is styled even when the bundle never loads. */
    .boot-panel {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px; background: #faf8f5; color: #1a1814;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .boot-card {
      max-width: 460px; width: 100%; text-align: center; background: #fff;
      border: 1px solid #ddd9d0; border-radius: 20px; padding: 40px 32px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.14);
    }
    .boot-mark { font-size: 40px; line-height: 1; margin-bottom: 12px; }
    .boot-title { font-size: 22px; margin: 0 0 10px; font-weight: 700; }
    .boot-text { font-size: 14px; color: #6b6158; margin: 0 0 16px; line-height: 1.6; }
    .boot-detail {
      font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 11px;
      color: #6b6158; background: #f2efe9; border: 1px solid #e8e4dc;
      border-radius: 12px; padding: 10px 12px; margin: 0 0 20px;
      white-space: pre-wrap; word-break: break-word; text-align: left;
    }
    .boot-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .boot-btn {
      display: inline-block; font: inherit; font-size: 14px; font-weight: 600;
      padding: 10px 20px; border-radius: 12px; cursor: pointer; text-decoration: none;
      border: 1px solid #2d6a4f; background: #2d6a4f; color: #fff;
    }
    .boot-btn-ghost { background: transparent; color: #2d6a4f; }
    @media (prefers-color-scheme: dark) {
      .boot-panel { background: #16140f; color: #f0ece4; }
      .boot-card { background: #1e1c16; border-color: #3a3830; }
      .boot-text, .boot-detail { color: #9e9890; }
      .boot-detail { background: #28261f; border-color: #3a3830; }
    }
  </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Boot guard: if the app bundle never mounts (a broken build, a failed
      // module load, or a runtime error before React takes over) show a
      // branded recovery panel instead of leaving the user on a blank page.
      (function () {
        var root = document.getElementById("root");
        var done = false;
        function fail(reason) {
          if (done || !root) return;
          done = true;
          root.setAttribute("data-boot-failed", "1");
          root.innerHTML =
            '<div class="boot-panel" role="alert"><div class="boot-card">' +
            '<div class="boot-mark">\u26CF\uFE0F</div>' +
            '<h1 class="boot-title">This page didn\u2019t load</h1>' +
            '<p class="boot-text">Something went wrong loading the app. A reload usually fixes it.</p>' +
            '<pre class="boot-detail">' + String(reason || "Unknown error").slice(0, 300) + "</pre>" +
            '<div class="boot-actions"><button type="button" class="boot-btn" onclick="location.reload()">Reload</button>' +
            '<a class="boot-btn boot-btn-ghost" href="%BASE_URL%">Back to home</a></div>' +
            "</div></div>";
        }
        window.addEventListener("error", function (e) {
          if (e && e.target && e.target.tagName === "SCRIPT") fail("Failed to load " + (e.target.src || "script"));
        }, true);
        window.addEventListener("unhandledrejection", function (e) {
          fail("Unhandled error: " + ((e.reason && e.reason.message) || e.reason));
        });
        // If React hasn't painted shortly after load, assume the bundle failed.
        window.addEventListener("load", function () {
          setTimeout(function () {
            if (!done && root && !root.firstElementChild) fail("The app did not start.");
          }, 4000);
        });
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
